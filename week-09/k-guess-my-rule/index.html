<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Guess My Rule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: a felt play-mat with a yarn loop (IN) beside an open OUT area; controls and the block tray sit in a side column. */
:root{
  --bg:#E9EFEC; --mat:#D5E5DD; --card:#FFFFFF; --ink:#1A2627; --muted:#536466; --line:#BFD1CA;
  --loop:#7447CC; --on-loop:#FFFFFF; --loop-soft:#ECE4FB; --loop2:#0B8571; --loop2-soft:#DDF3EE;
  --good:#17804A; --good-soft:#DDF3E5; --oops:#B65300; --oops-soft:#FCEBDB;
  --red:#E1392E; --red-d:#9C1F16; --blue:#2C6AD6; --blue-d:#163F86; --yellow:#F4B600; --yellow-d:#9E7400;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --b:clamp(52px, 7.2vh, 80px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111918; --mat:#1A2725; --card:#22302E; --ink:#E8F0ED; --muted:#A2B4B1; --line:#33443F;
    --loop:#B293F6; --on-loop:#1C1233; --loop-soft:#2C2443; --loop2:#3FCFB4; --loop2-soft:#16332E;
    --good:#56D18E; --good-soft:#163323; --oops:#FFA556; --oops-soft:#3A2614;
    --red-d:#FF8F86; --blue-d:#9DBDF7; --yellow-d:#FFE08A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111918; --mat:#1A2725; --card:#22302E; --ink:#E8F0ED; --muted:#A2B4B1; --line:#33443F;
  --loop:#B293F6; --on-loop:#1C1233; --loop-soft:#2C2443; --loop2:#3FCFB4; --loop2-soft:#16332E;
  --good:#56D18E; --good-soft:#163323; --oops:#FFA556; --oops-soft:#3A2614;
  --red-d:#FF8F86; --blue-d:#9DBDF7; --yellow-d:#FFE08A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:18px; display:flex; flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--loop); outline-offset:3px}

header{display:flex; align-items:center; gap:12px 24px; flex-wrap:wrap; padding-block:14px 8px}
.ttl h1{margin:0; font-family:var(--display); font-weight:700; font-size:clamp(28px,3.2vw,46px); line-height:1; text-wrap:balance}
.ttl p{margin:4px 0 0; color:var(--muted); font-size:clamp(14px,1.2vw,17px)}
.ttl p b{color:var(--loop); font-weight:700}
.tools{margin-left:auto; display:flex; gap:10px; flex-wrap:wrap}
.ghost{border:2px solid var(--line); background:var(--card); border-radius:14px; padding:10px 18px; font-weight:700; font-size:16px; min-height:48px}
.ghost:hover{border-color:var(--ink)}

nav.tabs{display:flex; gap:8px; flex-wrap:wrap; padding-block:6px 12px}
nav.tabs button{display:flex; align-items:center; gap:10px; border:2px solid var(--line); background:var(--card); border-radius:999px; padding:8px 20px 8px 8px; font-family:var(--display); font-weight:600; font-size:clamp(17px,1.6vw,22px); min-height:54px}
nav.tabs button i{font-style:normal; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--mat); font-size:18px}
nav.tabs button[aria-selected="true"]{background:var(--ink); color:var(--card); border-color:var(--ink)}
nav.tabs button[aria-selected="true"] i{background:var(--loop); color:var(--on-loop)}

main{flex:1; min-height:0; overflow:auto; padding-block:0 20px}
.view{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:22px; align-items:start}
.view[hidden]{display:none}
.side{display:flex; flex-direction:column; gap:16px; min-width:0}

/* Say bubble */
.say{display:flex; gap:12px; align-items:flex-start; background:var(--card); border:2px solid var(--line); border-radius:20px; padding:14px 16px; min-height:84px}
.say p{margin:0; font-size:clamp(20px,1.9vw,27px); line-height:1.35; font-family:var(--display); font-weight:500; min-width:0}
.say p b{font-weight:700}
.say.good{background:var(--good-soft); border-color:var(--good)}
.say.oops{background:var(--oops-soft); border-color:var(--oops)}
.spk{flex:none; width:48px; height:48px; border-radius:50%; border:2px solid var(--line); background:var(--bg); display:grid; place-items:center}
.spk svg{width:24px; height:24px; fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.inline-act{margin-top:10px; display:block}

.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.big{border:0; background:var(--loop); color:var(--on-loop); font-family:var(--display); font-weight:600; font-size:clamp(19px,1.7vw,24px); padding:12px 24px; border-radius:16px; min-height:58px}
.big.alt{background:var(--card); color:var(--ink); border:2.5px solid var(--ink)}
.big:disabled{opacity:.4; cursor:default}
.inout{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.inout button{min-height:72px; font-size:clamp(24px,2.4vw,32px); font-family:var(--display); font-weight:700; border-radius:18px; border:3px solid var(--loop); background:var(--loop-soft); color:var(--ink)}
.inout button.o{border:3px dashed var(--muted); background:var(--card)}
.inout[hidden]{display:none}
.lbl-small{font-size:15px; color:var(--muted); margin:0; font-weight:700; letter-spacing:.06em; text-transform:uppercase}

/* Blocks */
.blk{width:var(--b); height:var(--b); border:0; border-radius:14px; background:var(--card); padding:5px; position:relative; box-shadow:0 3px 0 var(--line); transition:transform .15s}
.blk svg{width:100%; height:100%; display:block; overflow:visible}
.blk:hover{transform:translateY(-2px)}
.blk.sel{transform:translateY(-6px) scale(1.08); box-shadow:0 0 0 4px var(--loop), 0 8px 0 var(--line)}
.blk.flash{animation:pop .6s ease-out}
.blk.moved{box-shadow:0 0 0 4px var(--oops)}
.blk.pulse{animation:pulse 1s ease-in-out 3; box-shadow:0 0 0 5px var(--oops)}
.blk.ok{box-shadow:0 0 0 4px var(--good)}
.blk.wrong{box-shadow:0 0 0 4px var(--oops); background:repeating-linear-gradient(45deg, var(--card) 0 8px, var(--oops-soft) 8px 16px)}
.blk .tag{position:absolute; left:50%; bottom:-14px; transform:translateX(-50%); background:var(--ink); color:var(--card); font-size:13px; font-weight:700; padding:2px 8px; border-radius:8px; white-space:nowrap}
.blk .num{position:absolute; top:-10px; right:-10px; width:30px; height:30px; border-radius:50%; background:var(--loop); color:var(--on-loop); font-family:var(--display); font-weight:700; display:grid; place-items:center; font-size:17px}
.c-red{fill:var(--red); stroke:var(--red-d)} .c-blue{fill:var(--blue); stroke:var(--blue-d)} .c-yellow{fill:var(--yellow); stroke:var(--yellow-d)}
.shape *{stroke-width:4; stroke-linejoin:round}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes wig{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.wig{animation:wig .5s}

/* Mat */
.mat{background:var(--mat); border-radius:28px; padding:28px 20px 20px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:20px; align-items:stretch}
.loop{width:min(46vh, 34vw); aspect-ratio:1; border-radius:50%; border:10px solid var(--loop); box-shadow:inset 0 0 0 3px var(--loop-soft), 0 0 0 3px var(--loop-soft); background:color-mix(in srgb, var(--loop-soft) 55%, transparent);
  display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:8px; padding:14%; position:relative; cursor:pointer; max-width:100%}
.loop.static,.out.static{cursor:default}
.region-lbl{position:absolute; top:-22px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px; background:var(--loop); color:var(--on-loop); font-family:var(--display); font-weight:700; font-size:20px; padding:4px 16px; border-radius:999px; white-space:nowrap}
.region-lbl .n{background:color-mix(in srgb, var(--on-loop) 25%, transparent); border-radius:999px; padding:0 10px; min-width:32px; text-align:center}
.region-lbl svg{width:28px; height:28px}
.out{position:relative; border:3px dashed var(--muted); border-radius:22px; padding:34px 14px 14px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px; min-height:200px; cursor:pointer}
.out .region-lbl{background:var(--card); color:var(--ink); border:2.5px dashed var(--muted); top:-20px}
.out .region-lbl .n{background:var(--mat)}
.target .loop, .target .out{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{filter:brightness(1.06); transform:scale(1.01)}}
.tray{display:flex; flex-wrap:wrap; gap:8px; padding:12px; border-radius:18px; background:var(--card); border:2px solid var(--line); min-height:calc(var(--b) + 26px)}
.tray.empty::after{content:"No blocks left."; color:var(--muted); align-self:center; padding:8px}

/* Rule cards */
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(104px,1fr)); gap:10px}
.card{border:2.5px solid var(--line); background:var(--card); border-radius:18px; padding:10px 6px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; font-family:var(--display); font-weight:600; font-size:19px; min-height:104px}
.card svg{width:56px; height:56px}
.card:hover{border-color:var(--loop)}
.card.on{border-color:var(--loop); background:var(--loop-soft)}
.card.dim{opacity:.35}
.ricon .ink{fill:none; stroke:var(--ink); stroke-width:7; stroke-linejoin:round}
.ricon .inkfill{fill:var(--ink); stroke:var(--ink); stroke-width:5; stroke-linejoin:round}
.ricon .faint{fill:none; stroke:var(--muted); stroke-width:5; stroke-dasharray:6 6}
.ricon .dot{fill:var(--loop); stroke:var(--card); stroke-width:3}
.region-lbl .ricon .ink{stroke:var(--on-loop)} .region-lbl .ricon .inkfill{fill:var(--on-loop); stroke:var(--on-loop)}
.panel{background:var(--card); border:2px solid var(--loop); border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:12px}
.panel h3{margin:0; font-family:var(--display); font-size:22px}
.panel[hidden]{display:none}
.chip{display:inline-flex; align-items:center; gap:8px; background:var(--loop-soft); border:2px solid var(--loop); border-radius:999px; padding:4px 14px 4px 6px; font-family:var(--display); font-weight:600; font-size:20px}
.chip svg{width:34px; height:34px}
.dots{display:flex; gap:6px}
.dots span{width:22px; height:22px; border-radius:50%; border:3px solid var(--good)}
.dots span.f{background:var(--good)}

/* Warm-up */
.wodb{justify-self:center; background:var(--mat); border-radius:28px; padding:22px; display:grid; grid-template-columns:1fr 1fr; gap:18px; max-width:620px; width:100%}
.wodb .blk{--b:auto; width:100%; height:auto; aspect-ratio:1; border-radius:24px; padding:12%}
.wodb .blk .tag{font-size:clamp(15px,1.5vw,20px); bottom:10px; padding:4px 12px}

/* Detective */
.qnav{display:flex; gap:8px; flex-wrap:wrap}
.qnav button{min-width:58px; height:58px; border-radius:29px; border:2.5px solid var(--line); background:var(--card); font-family:var(--display); font-weight:700; font-size:22px; padding:0 16px}
.qnav button[aria-pressed="true"]{background:var(--ink); color:var(--card); border-color:var(--ink)}
.q{font-family:var(--display); font-weight:600; font-size:clamp(23px,2.2vw,32px); line-height:1.25; margin:0; text-wrap:balance}
.vennwrap{background:var(--mat); border-radius:28px; padding:14px; display:flex; flex-direction:column; gap:8px}
.vlabels{display:flex; justify-content:space-between; gap:8px; padding:0 4%}
.vlabels .chip.b{background:var(--loop2-soft); border-color:var(--loop2)}
.venn{width:100%; height:auto; display:block; cursor:pointer; touch-action:manipulation}
.venn .ca{fill:var(--loop-soft); fill-opacity:.65; stroke:var(--loop); stroke-width:9}
.venn .cb{fill:var(--loop2-soft); fill-opacity:.65; stroke:var(--loop2); stroke-width:9}
.venn .vb rect.bg{fill:var(--card); stroke:var(--line); stroke-width:2}
.venn .vb.hit rect.bg{stroke:var(--good); stroke-width:6}
.venn .vt{font-family:var(--display); font-weight:600; font-size:26px; fill:var(--muted)}
.tests{display:flex; gap:12px; flex-wrap:wrap}
.pred{display:grid; grid-template-columns:auto 1fr; gap:8px 14px; align-items:center; font-family:var(--display); font-size:22px; font-weight:600}
.pred .res{padding:4px 14px; border-radius:12px; background:var(--mat); justify-self:start}
.pred .res.r-in{background:var(--loop-soft); color:var(--ink); border:2px solid var(--loop)}

@media (max-width: 900px), (orientation: portrait){
  .view{grid-template-columns:minmax(0,1fr)}
  .loop{width:min(78vw, 380px)}
}
@media (max-width: 560px){
  :root{--b:50px}
  html,body{height:auto} main{overflow:visible}
  .mat{grid-template-columns:minmax(0,1fr); justify-items:center; padding:28px 12px 14px}
  .out{width:100%; min-height:120px}
  nav.tabs button{padding-right:14px; font-size:16px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>

<header>
  <div class="ttl">
    <h1>Guess My Rule</h1>
    <p>Kindergarten · Week 9 · Lesson K.9 &nbsp;·&nbsp; <b>What rule put these together?</b></p>
  </div>
  <div class="tools">
    <button class="ghost" id="resetBtn">Start over</button>
    <button class="ghost" id="fsBtn">Full screen</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="warm" aria-selected="true"><i>1</i>Odd one out</button>
  <button role="tab" data-tab="guess" aria-selected="false"><i>2</i>Guess my rule</button>
  <button role="tab" data-tab="sort" aria-selected="false"><i>3</i>My sort</button>
  <button role="tab" data-tab="det" aria-selected="false"><i>4</i>Detectives</button>
</nav>

<main>
  <!-- 1 Warm-up -->
  <section class="view" id="v-warm">
    <div class="wodb" id="wodb"></div>
    <div class="side">
      <div class="say" id="wSay"></div>
      <p class="lbl-small">Reasons found</p>
      <div class="dots" id="wDots"></div>
      <div class="row"><button class="big alt" id="wClear">Hide reasons</button></div>
    </div>
  </section>

  <!-- 2 Guess my rule -->
  <section class="view" id="v-guess" hidden>
    <div class="mat" id="gMat">
      <div class="loop" id="gIn" data-side="in"></div>
      <div class="out" id="gOut" data-side="out"></div>
    </div>
    <div class="side">
      <div class="say" id="gSay"></div>
      <div class="inout" id="gInOut" hidden><button data-side="in">IN</button><button class="o" data-side="out">OUT</button></div>
      <div class="row">
        <button class="big" id="gKnow">I know the rule!</button>
        <button class="big alt" id="gClue">Next clue</button>
      </div>
      <div class="row"><span class="lbl-small">Right in a row</span><div class="dots" id="gDots"></div></div>
      <div class="panel" id="gPanel" hidden><h3 id="gPanelH"></h3><div class="cards" id="gCards"></div></div>
      <p class="lbl-small">Blocks · tap one, then tap IN or OUT</p>
      <div class="tray" id="gTray"></div>
      <div class="row">
        <button class="ghost" id="gNewBtn">New secret rule</button>
        <button class="ghost" id="gTeach">Teacher picks the rule</button>
        <button class="ghost" id="gShow">Show the rule</button>
      </div>
    </div>
  </section>

  <!-- 3 My sort -->
  <section class="view" id="v-sort" hidden>
    <div class="mat" id="mMat">
      <div class="loop" id="mIn" data-side="in"></div>
      <div class="out" id="mOut" data-side="out"></div>
    </div>
    <div class="side">
      <div class="say" id="mSay"></div>
      <div class="panel" id="mPick"><h3>Pick your rule</h3><div class="cards" id="mCards"></div></div>
      <div class="row" id="mRuleRow" hidden><span class="lbl-small">My rule</span><span id="mRuleChip"></span></div>
      <div class="inout" id="mInOut" hidden><button data-side="in">IN</button><button class="o" data-side="out">OUT</button></div>
      <div class="tray" id="mTray" data-side="tray"></div>
      <div class="row" id="mActs" hidden>
        <button class="big" id="mCheck">Check my sort</button>
        <button class="big alt" id="mPartner" hidden>Partner: guess it!</button>
      </div>
      <div class="panel" id="mGuess" hidden><h3>What was the rule?</h3><div class="cards" id="mGCards"></div></div>
      <div class="row" id="mMore" hidden>
        <button class="ghost" id="mNewBlocks">New blocks</button>
        <button class="ghost" id="mNewRule">New rule</button>
      </div>
    </div>
  </section>

  <!-- 4 Detective -->
  <section class="view" id="v-det" hidden>
    <div id="dStage"></div>
    <div class="side">
      <div class="qnav" id="qnav"></div>
      <p class="q" id="qText"></p>
      <div class="say" id="dSay"></div>
      <div class="row" id="dActs"></div>
      <div id="dExtra"></div>
    </div>
  </section>
</main>

<script>
(function(){
/*LOGIC*/
const COLORS=['red','blue','yellow'], SHAPES=['circle','square','triangle'], SIZES=['big','small'];
const ALL=[]; for(const z of SIZES) for(const c of COLORS) for(const s of SHAPES) ALL.push({id:`${z}-${c}-${s}`, color:c, shape:s, size:z});
const B=(z,c,s)=>ALL.find(b=>b.id===`${z}-${c}-${s}`);
const name=b=>`${b.size} ${b.color} ${b.shape}`;
const RULES=[
  {id:'red',    word:'red',    is:'is red',      isnt:'is not red',      test:b=>b.color==='red'},
  {id:'blue',   word:'blue',   is:'is blue',     isnt:'is not blue',     test:b=>b.color==='blue'},
  {id:'yellow', word:'yellow', is:'is yellow',   isnt:'is not yellow',   test:b=>b.color==='yellow'},
  {id:'circle', word:'circle', is:'is a circle', isnt:'is not a circle', test:b=>b.shape==='circle'},
  {id:'square', word:'square', is:'is a square', isnt:'is not a square', test:b=>b.shape==='square'},
  {id:'triangle',word:'triangle',is:'is a triangle',isnt:'is not a triangle',test:b=>b.shape==='triangle'},
  {id:'big',    word:'big',    is:'is big',      isnt:'is not big',      test:b=>b.size==='big'},
  {id:'small',  word:'small',  is:'is small',    isnt:'is not small',    test:b=>b.size==='small'},
  {id:'corners',word:'has corners',is:'has corners',isnt:'has no corners',test:b=>b.shape!=='circle'}
];
const R=id=>RULES.find(r=>r.id===id);
const sideOf=(r,b)=>r.test(b)?'in':'out';
const consistent=placed=>RULES.filter(r=>placed.every(p=>sideOf(r,p.b)===p.side));
const counterexample=(r,placed)=>placed.find(p=>sideOf(r,p.b)!==p.side);
function oddReasons(b,set){
  const others=set.filter(x=>x!==b), out=[];
  if(others.every(o=>o.size!==b.size)) out.push({tag:`only ${b.size}`, say:`It is the only ${b.size} one.`});
  if(others.every(o=>o.color!==b.color)) out.push({tag:`only ${b.color}`, say:`It is the only ${b.color} one.`});
  if(others.every(o=>o.shape!==b.shape)) out.push({tag:`only ${b.shape}`, say:`It is the only ${b.shape}.`});
  return out;
}
const WODB=[B('big','red','triangle'),B('small','red','triangle'),B('big','red','square'),B('big','blue','triangle')];
// Venn
const VA={x:380,y:300}, VB={x:620,y:300}, VR=220;
const SLOTS={A:[[240,225],[215,300],[240,375],[300,300]], B:[[760,225],[785,300],[760,375],[700,300]], AB:[[500,215],[500,300],[500,385]],
  none:[[60,60],[160,60],[840,60],[940,60],[60,560],[160,560],[840,560],[940,560]]};
const regionAt=(x,y)=>{const a=Math.hypot(x-VA.x,y-VA.y)<VR, b=Math.hypot(x-VB.x,y-VB.y)<VR; return (a?'A':'')+(b?'B':'')||'none';};
const regionOf=(A,Bb,b)=>(A.test(b)?'A':'')+(Bb.test(b)?'B':'')||'none';
function regionWhy(A,Bb,b){
  const r=regionOf(A,Bb,b), n=name(b);
  if(r==='AB') return `The ${n} ${A.is} AND ${Bb.is}. It goes in the middle, in both loops.`;
  if(r==='A') return `The ${n} ${A.is}. It ${Bb.isnt}. It goes in the ${A.word} loop only.`;
  if(r==='B') return `The ${n} ${Bb.is}. It ${A.isnt}. It goes in the ${Bb.word} loop only.`;

function gClue(silent, split){

  if(s==='out' && r.test(b)) return `The ${name(b)} ${r.is}. It belongs IN.`;

function mCheck(){

    say('#dSay',msg,'good');
  } else {
    const where={A:`the ${V.A.word} loop only`,B:`the ${V.B.word} loop only`,AB:'the middle',none:'outside both'}[region];
    say('#dSay',`Hmm, not ${where}. ${regionWhy(V.A,V.B,b)} Try again!`,'oops');
    wiggle($('#vTray .sel'));
  }
}
function dAct(label,fn,primary){ const b=document.createElement('button'); b.className=primary?'big':'big alt'; b.textContent=label; b.onclick=fn; $('#dActs').appendChild(b); }
function dRender(keepSay){
  $('#qnav').innerHTML=[1,2,3,4].map(i=>`<button data-q="${i}" aria-pressed="${D.q===i}" aria-label="Question ${i}">${i}</button>`).join('')+`<button data-q="5" aria-pressed="${D.q===5}">★ Challenge</button>`;
  $('#qText').textContent=QS[D.q]; $('#dActs').innerHTML=''; $('#dExtra').innerHTML='';
  const st=$('#dStage');
  if(D.q===1){
    st.innerHTML=staticMat(Q1.in,Q1.out,{share:D.share,count:D.count});
    dAct('Show what they share',()=>{D.share=true; dRender(true); say('#dSay','They are all <b>small</b>. Every OUT block is big. The rule is <b>small</b>.','good');},true);
    dAct('Count them',()=>{D.count=true; dRender(true); say('#dSay',`<b>${Q1.in.length}</b> blocks IN. <b>${Q1.out.length}</b> blocks OUT.`,'good');});
    if(!keepSay) say('#dSay','Look at the IN blocks. Say it with “because”.');
  }
  if(D.q===2){
    st.innerHTML=staticMat(Q2.in,Q2.out);
    dAct('Which rules fit?',()=>{ const c=consistent([...Q2.in.map(b=>({b,side:'in'})),...Q2.out.map(b=>({b,side:'out'}))]);
      say('#dSay',`${c.length} rules fit all 4 blocks: ${c.map(r=>`<b>${r.word}</b>`).join(' and ')}. Test a block to tell them apart.`,'good');},true);
    const ex=document.createElement('div'); ex.style.cssText='display:flex;flex-direction:column;gap:12px';
    ex.innerHTML=`<p class="lbl-small">Test a block</p><div class="tests" id="tests">${Q2.tests.map(b=>blkBtn(b,D.test===b?'sel':'')).join('')}</div><div id="predBox"></div>`;
    $('#dExtra').appendChild(ex);
    $('#tests').onclick=e=>{const t=e.target.closest('[data-id]'); if(!t) return; D.test=byId(t.dataset.id); dRender(true); dPredict();};
    if(D.test) dPredict(true); else if(!keepSay) say('#dSay','Both <b>red</b> and <b>triangle</b> could be the rule. Tap a test block.');
  }
  if(D.q===3||D.q===4||D.q===5){
    st.innerHTML=vennHTML(D.V); vennWire();
    if(D.q!==5) dAct('Show me',()=>{ if(!D.V.pool.length) return; D.V.sel=D.V.pool[0]; vPlace(regionOf(D.V.A,D.V.B,D.V.sel),true); },true);
    else dAct('Start again',()=>{ D.V=newVenn(shuffle(CHAL)); dRender(); });
    if(!keepSay) say('#dSay', D.q===5?'Tap a block. Then tap where it goes on the loops.':'Tap the block. Then tap the place where it goes.');
  }
}
function dPredict(silent){
  const b=D.test, a=sideOf(R('red'),b), t=sideOf(R('triangle'),b);
  $('#predBox').innerHTML=`<div class="pred"><span>${chipHTML(R('red'))}</span><span class="res r-${a}">${a.toUpperCase()}</span><span>${chipHTML(R('triangle'))}</span><span class="res r-${t}">${t.toUpperCase()}</span></div>`;
  if(!silent) say('#dSay', a!==t ? `The ${name(b)}: the two rules disagree! This block can tell them apart.` : `The ${name(b)}: both rules say ${a.toUpperCase()}. It can't tell them apart. Try another.`, a!==t?'good':'oops');
}
function dSet(q){
  D.q=q; D.share=false; D.count=false; D.test=null;
  if(q===3) D.V=newVenn([B('big','red','triangle')]);
  if(q===4) D.V=newVenn([B('small','blue','circle')]);
  if(q===5) D.V=newVenn(shuffle(CHAL));
  dRender();
}
$('#qnav').onclick=e=>{const t=e.target.closest('[data-q]'); if(t) dSet(+t.dataset.q);};

/* ---------- Tabs / global ---------- */
function tab(t){ $$('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t)); ['warm','guess','sort','det'].forEach(k=>$('#v-'+k).hidden=k!==t); try{speechSynthesis.cancel();}catch(e){} }
$$('nav.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function resetAll(){ wReset(); G.secret=null; gNew(); mReset(); dSet(1); }
$('#resetBtn').onclick=resetAll;
$('#fsBtn').onclick=()=>{ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} };
document.addEventListener('fullscreenchange',()=>$('#fsBtn').textContent=document.fullscreenElement?'Exit full screen':'Full screen');
resetAll();
})();
</script>
