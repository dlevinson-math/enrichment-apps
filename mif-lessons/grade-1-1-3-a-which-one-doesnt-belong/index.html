<script>
(function(){
const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= Geometry (all reasons for flat shapes are computed from the drawing) ================= */
const C = [100,100];
function rotPt(p, deg){ const a = deg*Math.PI/180, x=p[0]-C[0], y=p[1]-C[1]; return [C[0]+x*Math.cos(a)-y*Math.sin(a), C[1]+x*Math.sin(a)+y*Math.cos(a)]; }
function scalePt(p, k){ return [C[0]+(p[0]-C[0])*k, C[1]+(p[1]-C[1])*k]; }
const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
function angleAt(prev, p, next){
  const u=[prev[0]-p[0], prev[1]-p[1]], v=[next[0]-p[0], next[1]-p[1]];
  const c=(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v));
  return Math.acos(Math.max(-1,Math.min(1,c)))*180/Math.PI;
}
function pointsOf(s){ return s.pts.map(p => rotPt(scalePt(p, s.k||1), s.rot||0)); }
function geo(s){
  if(s.circle){ const r=(s.r||75)*(s.k||1); return {circle:true, closed:true, nSides:0, nCorners:0, segs:[], allSame:null, sqCorner:false, height:2*r, onCorner:null, twoLongSame:false, longShort:false}; }
  const P = pointsOf(s), n=P.length, closed = s.closed!==false;
  const segs=[]; for(let i=0;i<(closed?n:n-1);i++) segs.push(dist(P[i], P[(i+1)%n]));
  const cornerIdx = closed ? P.map((_,i)=>i) : P.map((_,i)=>i).slice(1,-1);
  const angles = cornerIdx.map(i => angleAt(P[(i-1+n)%n], P[i], P[(i+1)%n]));
  const same = (a,b) => Math.abs(a-b) <= 0.01*Math.max(a,b);
  const allSame = segs.every(l => same(l, segs[0]));
  const ys = P.map(p=>p[1]), maxY=Math.max(...ys), minY=Math.min(...ys);
  const bottom = P.filter(p => Math.abs(p[1]-maxY) < 0.5).length;
  const sorted=[...segs].sort((a,b)=>a-b);
  // triangle with exactly two equal sides that are longer than the third
  const twoLongSame = closed && n===3 && same(sorted[1],sorted[2]) && !same(sorted[0],sorted[1]);
  // four sides: two equal long, two equal short
  const longShort = closed && n===4 && same(sorted[0],sorted[1]) && same(sorted[2],sorted[3]) && !same(sorted[1],sorted[2]);
  return {circle:false, closed, nSides:segs.length, nCorners:cornerIdx.length, segs, angles, cornerIdx, P,
    allSame, sqCorner: angles.some(a => Math.abs(a-90) < 1), height:maxY-minY, onCorner: closed ? bottom===1 : null, twoLongSame, longShort};
}

/* ================= Shapes ================= */
const SQ = [[40,40],[160,40],[160,160],[40,160]];
const RECT = [[20,55],[180,55],[180,145],[20,145]];
const TRI = [[30,160],[170,160],[100,160-70*Math.sqrt(3)]];
const RIGHT = [[30,160],[170,160],[30,55]];
const THIN = [[75,182],[125,182],[100,22]];
const OPEN = [[40,165],[165,150],[95,35],[95+0.75*(40-95), 35+0.75*(165-35)]];
const HEX = [0,60,120,180,240,300].map(a => [100+80*Math.cos(a*Math.PI/180), 100+80*Math.sin(a*Math.PI/180)]);

const SETS = {
  A:{ label:'Set A', kind:'flat', color:'--fill', shapes:[
      {id:'a1', pts:SQ, shaded:true},
      {id:'a2', pts:SQ, shaded:false, rot:45, turnable:true},
      {id:'a3', pts:RECT, shaded:true},
      {id:'a4', pts:TRI, shaded:true} ]},
  B:{ label:'Set B', kind:'solid', color:'--fill-b', shapes:[
      {id:'cube', name:'cube', f:{flat:6, curved:false, tip:false, allSq:true, diffFaces:false, rolls:false, stacks:true, circles:0, corners:8, biggest:false}},
      {id:'box', name:'box', f:{flat:6, curved:false, tip:false, allSq:false, diffFaces:true, rolls:false, stacks:true, circles:0, corners:8, biggest:true}},
      {id:'cyl', name:'cylinder', f:{flat:2, curved:true, tip:false, allSq:false, diffFaces:false, rolls:true, stacks:true, circles:2, corners:0, biggest:false}},
      {id:'cone', name:'cone', f:{flat:1, curved:true, tip:true, allSq:false, diffFaces:false, rolls:true, stacks:false, circles:1, corners:0, biggest:false}} ]},
  C:{ label:'Set C', kind:'flat', color:'--fill-c', shapes:[
      {id:'c1', pts:TRI, shaded:true},
      {id:'c2', pts:THIN, shaded:true},
      {id:'c3', pts:RIGHT, shaded:true},
      {id:'c4', pts:OPEN, shaded:false, closed:false} ]}
};
const FACTS = {
  cube:['6 flat faces','all faces the same square','8 corners','stacks','does not roll'],
  box:['6 flat faces','faces not all the same','8 corners','stacks','does not roll','biggest'],
  cyl:['2 flat faces','2 circle faces','curved','rolls','stacks'],
  cone:['1 flat face','1 circle face','a pointy tip','curved','rolls','cannot stack on it']
};

/* Reason cards. type: geo = sides/corners/faces, pos = how it sits, look = color or size.
   test(shape, geo, allShapes) -> true if the card describes this shape. */
const CHIPS = {
  A:[
    {id:'s4', text:'4 sides', type:'geo', icon:'sq', test:(s,g)=>g.nSides===4, no:'does not have 4 sides', ev:'count'},
    {id:'s3', text:'3 sides', type:'geo', icon:'tri', test:(s,g)=>g.nSides===3, no:'does not have 3 sides', ev:'count'},
    {id:'sqc', text:'square corners', type:'geo', icon:'corner', test:(s,g)=>g.sqCorner, no:'has no square corner', ev:'corner'},
    {id:'nosq', text:'no square corners', type:'geo', icon:'nocorner', test:(s,g)=>!g.sqCorner, no:'has square corners', ev:'corner'},
    {id:'same4', text:'4 sides all the same', type:'geo', icon:'sq', test:(s,g)=>g.nSides===4 && g.allSame, no:'does not have 4 sides all the same', ev:'count'},
    {id:'ls', text:'2 long sides, 2 short sides', type:'geo', icon:'rect', test:(s,g)=>g.longShort, no:'does not have 2 long and 2 short sides', ev:'count'},
    {id:'notall', text:'sides not all the same', type:'geo', icon:'rect', test:(s,g)=>!g.allSame, no:'has sides that are all the same', ev:'count'},
    {id:'onc', text:'standing on a corner', type:'pos', icon:'diamond', test:(s,g)=>g.onCorner===true, no:'is not standing on a corner'},
    {id:'nosh', text:'not shaded', type:'look', icon:'open', test:s=>!s.shaded, no:'is shaded'},
    {id:'shsame', text:'shaded and 4 sides all the same', type:'geo', icon:'sqfill', test:(s,g)=>s.shaded && g.nSides===4 && g.allSame, no:'is not a shaded shape with 4 sides all the same', ev:'count'}
  ],
  B:[
    {id:'tip', text:'a pointy tip', type:'geo', icon:'cone', test:s=>s.f.tip, no:'has no pointy tip'},
    {id:'f1', text:'only 1 flat face', type:'geo', icon:'face', test:s=>s.f.flat===1, no:'does not have just 1 flat face'},
    {id:'c2', text:'2 circle faces', type:'geo', icon:'circ', test:s=>s.f.circles===2, no:'does not have 2 circle faces'},
    {id:'rs', text:'rolls and stacks', type:'geo', icon:'roll', test:s=>s.f.rolls && s.f.stacks, no:'cannot both roll and stack'},
    {id:'allsq', text:'all faces the same square', type:'geo', icon:'sq', test:s=>s.f.allSq, no:'does not have all faces the same square'},
    {id:'diff', text:'flat faces not all the same', type:'geo', icon:'rect', test:s=>s.f.diffFaces, no:'does not have flat faces of different sizes'},
    {id:'rolls', text:'rolls', type:'geo', icon:'roll', test:s=>s.f.rolls, no:'does not roll'},
    {id:'stacks', text:'stacks', type:'geo', icon:'stack', test:s=>s.f.stacks, no:'does not stack'},
    {id:'crn', text:'has corners', type:'geo', icon:'corner', test:s=>s.f.corners>0, no:'has no corners'},
    {id:'big', text:'biggest', type:'look', icon:'big', test:s=>s.f.biggest, no:'is not the biggest'}
  ],
  C:[
    {id:'s3', text:'3 sides', type:'geo', icon:'tri', test:(s,g)=>g.nSides===3, no:'does not have 3 sides', ev:'count'},
    {id:'cl', text:'closed, no gap', type:'geo', icon:'tri', test:(s,g)=>g.closed, no:'is not closed. It has a gap', ev:'count'},
    {id:'gap', text:'not closed, a gap', type:'geo', icon:'gap', test:(s,g)=>!g.closed, no:'is closed. It has no gap', ev:'count'},
    {id:'k2', text:'only 2 corners', type:'geo', icon:'gap', test:(s,g)=>g.nCorners===2, no:'does not have just 2 corners', ev:'corner'},
    {id:'k3', text:'3 corners', type:'geo', icon:'tri', test:(s,g)=>g.nCorners===3, no:'does not have 3 corners', ev:'corner'},
    {id:'sqc', text:'a square corner', type:'geo', icon:'corner', test:(s,g)=>g.sqCorner, no:'has no square corner', ev:'corner'},
    {id:'same3', text:'3 sides all the same', type:'geo', icon:'tri', test:(s,g)=>g.closed && g.nSides===3 && g.allSame, no:'does not have 3 sides all the same', ev:'count'},
    {id:'tl', text:'2 long sides the same, 1 short side', type:'geo', icon:'thin', test:(s,g)=>g.twoLongSame, no:'does not have 2 long sides the same and 1 short', ev:'count'},
    {id:'tall', text:'tallest', type:'look', icon:'big', test:(s,g,all)=>g.height >= Math.max(...all.map(t=>geo(t).height)) - 0.5, no:'is not the tallest'}
  ]
};

/* ================= State ================= */
const PAGES = [
  {id:'warm', label:'Warm-up'},
  {id:'A', label:'Set A'},
  {id:'B', label:'Set B'},
  {id:'C', label:'Set C'},
  {id:'mine', label:'My set'},
  {id:'talk', label:'Talk'}
];
let S;
function fresh(){
  return { page:'warm', sel:null, chip:null, found:{A:{},B:{},C:{}}, words:new Set(), votes:[0,0,0,0], goal:4,
    a2rot:45, overlay:null, factsOn:false, warmMark:null, warmCount:null,
    mine:[{kind:'tri',shaded:true,big:true,turn:false},{kind:'sq',shaded:true,big:true,turn:false},{kind:'rect',shaded:true,big:true,turn:false},{kind:'circ',shaded:true,big:true,turn:false}],
    mineSel:0, mineShow:false, q:1, nudgedOne:{} };
}

/* ================= Drawing ================= */
function flatSVG(s, colorVar, opts={}){
  const k = s.k||1;
  const fill = s.shaded ? `var(${colorVar})` : 'var(--card)';
  let body;
  if(s.circle){ body = `<circle cx="100" cy="100" r="${(s.r||75)*k}" fill="${fill}" stroke="var(--ink)" stroke-width="5"/>`; }
  else {
    const pts = s.pts.map(p => scalePt(p,k).map(v=>v.toFixed(2)).join(',')).join(' ');
    body = s.closed===false
      ? `<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>`

function overlaySVG(s, mode){

    g.segs.forEach((_,i) => { const a=g.P[i], b=g.P[(i+1)%g.P.length];
      const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      // push label outward from the shape's center
      const cx=g.P.reduce((t,p)=>t+p[0],0)/g.P.length, cy=g.P.reduce((t,p)=>t+p[1],0)/g.P.length;
      const dx=m[0]-cx, dy=m[1]-cy, L=Math.hypot(dx,dy)||1;
      out += `<text class="lbl" x="${(m[0]+dx/L*24).toFixed(1)}" y="${(m[1]+dy/L*24+8).toFixed(1)}" text-anchor="middle">${i+1}</text>`;
    });
  } else if(mode==='corner'){
    g.cornerIdx.forEach((ci,j) => {
      const p=g.P[ci], n=g.P.length, a=g.P[(ci-1+n)%n], b=g.P[(ci+1)%n];
      const ok = Math.abs(g.angles[j]-90) < 1;
      const ua=[(a[0]-p[0])/dist(a,p),(a[1]-p[1])/dist(a,p)], ub=[(b[0]-p[0])/dist(b,p),(b[1]-p[1])/dist(b,p)];

      out += `<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="${ok?'var(--good)':'var(--ink)'}" stroke="var(--card)" stroke-width="3"/>`;
    });

}

function holds(chip, s, all){ return !!chip.test(s, SETS_KIND(s)==='flat' ? geo(s) : null, all); }

/* ---------- My set ---------- */
const KINDS = {
  sq:{pts:SQ, turn:45, name:'square'}, rect:{pts:RECT, turn:45, name:'rectangle'}, tri:{pts:TRI, turn:180, name:'triangle'},
  right:{pts:RIGHT, turn:180, name:'square-corner triangle'}, hex:{pts:HEX, turn:30, name:'hexagon'}, circ:{circle:true, name:'circle'}
};
function mineShape(m){
  const K=KINDS[m.kind];
  return K.circle ? {circle:true, r:75, k:m.big?1:0.6, shaded:m.shaded} : {pts:K.pts, k:m.big?1:0.6, rot:m.turn?K.turn:0, shaded:m.shaded};
}
const PRED = [
  {k:'sides', type:'geo', val:(m,g)=>g.nSides, say:v=> v===0 ? 'round, with no sides' : `${v} sides`},
  {k:'same', type:'geo', val:(m,g)=>g.allSame, say:v=> v ? 'all sides the same' : 'sides not all the same'},
  {k:'sq', type:'geo', val:(m,g)=>g.sqCorner, say:v=> v ? 'a square corner' : 'no square corners'},
  {k:'turn', type:'pos', val:(m,g)=>g.onCorner, say:v=> v ? 'standing on a corner' : 'sitting flat'},
  {k:'shade', type:'look', val:m=>m.shaded, say:v=> v ? 'shaded' : 'not shaded'},
  {k:'size', type:'look', val:m=>m.big, say:v=> v ? 'big' : 'small'}
];
function reasonsFor(set){
  const G = set.map(m => geo(mineShape(m)));
  const V = set.map((m,i) => PRED.map(p => { const v=p.val(m,G[i]); return v==null ? null : v; }));
  return set.map((m,i) => {
    const uniq = idxs => {
      if(idxs.some(j => V[i][j]===null)) return false;
      return set.every((_,t) => t===i || idxs.some(j => V[t][j]!==V[i][j]));
    };
    const singles = PRED.map((p,j)=>j).filter(j => uniq([j]));
    const geoS = singles.filter(j => PRED[j].type!=='look');
    if(geoS.length) return {level:'easy', words:[PRED[geoS[0]].say(V[i][geoS[0]])], all:geoS.map(j=>PRED[j].say(V[i][j]))};
    const pairs=[]; for(let a=0;a<PRED.length;a++) for(let b=a+1;b<PRED.length;b++) if(uniq([a,b])) pairs.push([a,b]);
    const geoP = pairs.filter(([a,b]) => PRED[a].type!=='look' && PRED[b].type!=='look');
    if(geoP.length){ const [a,b]=geoP[0]; return {level:'tricky', words:[PRED[a].say(V[i][a]), PRED[b].say(V[i][b])]}; }
    const tris=[]; for(let a=0;a<PRED.length;a++) for(let b=a+1;b<PRED.length;b++) for(let c=b+1;c<PRED.length;c++) if(uniq([a,b,c])) tris.push([a,b,c]);
    const geoT = tris.filter(t => t.filter(j => PRED[j].type==='look').length<=1);
    if(!singles.length && geoT.length){ const t=geoT[0]; return {level:'tricky', words:t.map(j=>PRED[j].say(V[i][j]))}; }
    const lookS = singles.filter(j => PRED[j].type==='look');
    if(lookS.length) return {level:'look', words:[PRED[lookS[0]].say(V[i][lookS[0]])]};
    if(pairs.length){ const [a,b]=pairs[0]; return {level:'tricky-look', words:[PRED[a].say(V[i][a]), PRED[b].say(V[i][b])]}; }
    return {level:'none', words:[]};
  });
}

      <div class="palette" id="palette"></div>
      <div class="row" id="opts"></div>
      <div class="row"><button class="primary" id="showBtn"></button></div>
      <div class="goal"><span>Challenge:</span> make one shape very hard to argue for (✶), and argue for it.</div></div>
      <div class="say" id="say"></div>`;
    $('#showBtn').onclick = () => { S.mineShow=!S.mineShow; renderMine(); mineSay(); };
    say('Here is a starter set. Change any shape, then check.', '');
  }
  const cur = S.mine[S.mineSel];
  $('#palette').innerHTML = Object.entries(KINDS).map(([k,K]) => `<button data-k="${k}" aria-pressed="${cur.kind===k}" aria-label="${K.name}">${flatSVG(K.circle?{circle:true,r:75,shaded:true}:{pts:K.pts,shaded:true},'--fill')}</button>`).join('');
  $('#palette').querySelectorAll('button').forEach(b => b.onclick = () => { cur.kind=b.dataset.k; if(cur.kind==='circ') cur.turn=false; renderMine(); if(S.mineShow) mineSay(); });
  $('#opts').innerHTML = `<div class="seg" role="group" aria-label="Shading"><button data-o="shaded" data-v="1" aria-pressed="${cur.shaded}">Shaded</button><button data-o="shaded" data-v="0" aria-pressed="${!cur.shaded}">Not shaded</button></div>
    <div class="seg" role="group" aria-label="Size"><button data-o="big" data-v="1" aria-pressed="${cur.big}">Big</button><button data-o="big" data-v="0" aria-pressed="${!cur.big}">Small</button></div>
    ${cur.kind!=='circ' ? `<div class="seg" role="group" aria-label="How it sits"><button data-o="turn" data-v="0" aria-pressed="${!cur.turn}">Flat</button><button data-o="turn" data-v="1" aria-pressed="${cur.turn}">On a corner</button></div>` : ''}`;
  $('#opts').querySelectorAll('button').forEach(b => b.onclick = () => { cur[b.dataset.o] = b.dataset.v==='1'; renderMine(); if(S.mineShow) mineSay(); });
  $('#showBtn').textContent = S.mineShow ? 'Hide reasons' : 'Check my set';
}
function mineSay(){
  if(!S.mineShow){ say('Reasons hidden. Can the class find all four?', ''); return; }
  const R = reasonsFor(S.mine);
  const none = R.filter(r=>r.level==='none').length, look = R.filter(r=>r.level==='look').length, hard = R.filter(r=>r.level.startsWith('tricky')).length;
  if(none) say(`${none} shape${none>1?'s have':' has'} no reason yet.`, 'try', 'Change a shape so it is the only one with something.');
  else if(look) say('Every shape has a reason!', 'try', 'True. Now a reason about its sides or corners for the half star?');
  else if(hard) say(`Every shape has a reason, and ${hard===1?'one is':hard+' are'} tricky! ✶`, 'good', 'A ✶ shape needs two clues together. Can you argue for it?');
  else say('Every shape has a reason! ★★★★', 'good', 'Challenge: change one so it is very hard to argue for.');
}

/* ---------- Talk ---------- */
const QS = {
  1:{q:'Can every shape be the odd one out?', btn:'Show Set A reasons', run:()=>{
      const all=setShapes('A');
      const best = all.map(s => CHIPS.A.filter(c => c.type!=='look' && evaluate('A', s.id, c.id).unique).map(c=>c.text));
      showMini(all.map((s,i)=>({svg:flatSVG(s,'--fill'), why:best[i][0]})));
      say('Yes! In Set A, every shape has a reason.', 'good', 'So there is more than one right answer.'); }},
  2:{q:'Is the white square a diamond?', btn:'Turn it', run:()=>{
      const s=SETS.A.shapes[1];
      showMini([{svg:flatSVG(s,'--fill',{rot:45}), why:'on its corner'},{svg:flatSVG(s,'--fill',{rot:0}), why:'turned'}], true);
      say('Did the shape change, or only how it sits?', '', 'Same 4 sides all the same. Same 4 square corners. It is a square.'); }},
  3:{q:'Which shape was the hardest?', btn:'Show the hard one', run:()=>{
      const all=setShapes('A');
      showMini(all.map(s=>({svg:flatSVG(s,'--fill'), why: s.id==='a1' ? 'shaded + 4 sides the same' : '', dim:s.id!=='a1'})));
      say('The shaded square needs two clues together.', 'good', 'It is the only shaded shape with 4 sides all the same.'); }},
  4:{q:'What shape words did we use?', btn:'Show our words', run:()=>{
      const w=[...S.words];
      $('#frame').classList.remove('two');
      $('#frame').innerHTML = `<div class="cardx" style="grid-column:1/3;grid-row:1/3;padding:18px;align-items:flex-start"><div class="wordchart">${w.length ? w.map(x=>`<span>${esc(x)}</span>`).join('') : '<span>Find some reasons first!</span>'}</div></div>`;
      say(w.length ? `We used ${w.length} shape word${w.length>1?'s':''}.` : 'No words yet. Play Sets A, B and C first.', w.length?'good':'try', 'Did we count sides and corners, or only talk about color?'); }},
  5:{q:'How did our vote turn out?', btn:'Show the vote', run:()=>{
      const tot=S.votes.reduce((a,b)=>a+b,0);
      $('#frame').innerHTML = `<div class="cardx" style="grid-column:1/3;grid-row:1/3;padding:18px"><svg viewBox="0 0 400 300" style="width:100%;height:100%">${
        S.votes.map((v,i)=>{ const max=Math.max(1,...S.votes); const h=v/max*200; const x=40+i*90;
          return `<rect x="${x}" y="${240-h}" width="60" height="${h}" rx="8" fill="${i===3?'var(--good)':'var(--accent)'}"/><text x="${x+30}" y="${232-h}" text-anchor="middle" font-size="22" font-family="Lexend" fill="var(--ink)">${v}</text><text x="${x+30}" y="275" text-anchor="middle" font-size="28" font-weight="700" font-family="Fredoka" fill="var(--ink)">${i+1}</text>`; }).join('')
      }<line x1="30" y1="240" x2="390" y2="240" stroke="var(--ink)" stroke-width="3"/></svg></div>`;
      say(tot ? `${S.votes[3]} of ${tot} voted 4. The answer: all 4 can!` : 'No votes yet. The answer: all 4 can be the odd one out!', 'good'); }},
  6:{q:'Journal', btn:'Show the prompt', run:()=>{
      $('#frame').innerHTML = `<div class="cardx" style="grid-column:1/3;grid-row:1/3;padding:24px;text-align:center"><div style="font-family:var(--display);font-weight:600;font-size:clamp(26px,3vw,44px);line-height:1.25">Draw four shapes.<br>Circle one.<br>Tell why it doesn't belong.</div></div>`;
      say('Use a word about sides or corners.', ''); }}
};
function showMini(items, animate){
  $('#frame').innerHTML = items.concat(items.length===2?[{},{}]:[]).slice(0,4).map((it,i) => it.svg
    ? `<div class="cardx" style="${it.dim?'opacity:.35':''}">${it.svg}${it.why?`<span class="why">${esc(it.why)}</span>`:''}</div>` : `<div class="cardx"></div>`).join('');
  if(animate && !reduced){
    const el = $('#frame').children[1].querySelector('.shape-body');
    el.style.transform='rotate(45deg)'; requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transform='rotate(0deg)'; }));
  }
}
function renderTalk(){
  $('#hint').textContent = 'Talk it over first. Then tap the button for evidence.';
  $('#panel').innerHTML = `<div class="box"><h3>Share and reflect</h3><div class="qnav" id="qnav"></div><h2 id="qtext"></h2>
    <div class="row"><button class="primary" id="qbtn"></button></div></div><div class="say" id="say"></div>`;
  const draw = () => {
    $('#qnav').innerHTML = Object.keys(QS).map(i => `<button data-q="${i}" aria-pressed="${S.q==i}" aria-label="Question ${i}">${i}</button>`).join('');
    $('#qnav').querySelectorAll('button').forEach(b => b.onclick = () => { S.q=+b.dataset.q; draw(); idle(); });
    $('#qtext').textContent = QS[S.q].q; $('#qbtn').textContent = QS[S.q].btn;
    $('#qbtn').onclick = QS[S.q].run;
  };
  const idle = () => {
    $('#frame').innerHTML = setShapes('A').map(s=>`<div class="cardx">${flatSVG(s,'--fill')}</div>`).join('');
    say('Think. Turn to a partner. Then share.', '');
  };
  draw(); idle();
}

/* ================= Wire up ================= */
$('#resetBtn').onclick = () => { S = fresh(); $('#panel').innerHTML=''; render(); };
$('#fsBtn').onclick = () => { try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} };
document.addEventListener('fullscreenchange', () => $('#fsBtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen');
const _render = render;
render = function(){ const p=S.page; if(!['warm'].includes(p) && $('#warmPanel')) $('#panel').innerHTML=''; if(p!=='mine' && $('#minePanel')) $('#panel').innerHTML=''; if(!SETS[p] && $('#setPanel')) $('#panel').innerHTML=''; _render(); };
S = fresh(); render();
window.__wodb = {geo, SETS, CHIPS, evaluate, setShapes, reasonsFor, get S(){return S;}, set S(v){S=v;}};
})();
</script>
