<style>
/* Layout: a drafting table. The flag (on its cm rulers) is the stage on the left; the class's steps and tools sit in a panel on the right. */
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#14213A; --muted:#55627A; --line:#C9D2DE;
  --accent:#2556D6; --accent-ink:#FFFFFF; --accent-soft:#E1E8FB;
  --good:#11744A; --good-soft:#DCF2E6; --warn:#B3362C; --warn-soft:#FBE5E2;
  --ruler:#F3C645; --ruler-ink:#3A2D05; --gridline:rgba(20,33,58,.28);
  --f-red:#D3243B; --f-blue:#1E4DB5; --f-white:#FFFFFF; --f-gold:#F2B705; --f-green:#15864A;
  --f-black:#1B1C21; --f-orange:#EE7A1A; --f-purple:#7539B5; --f-blank:#E6EAF0; --f-outline:#1B1C21;
  --on-dark:#FFFFFF; --on-light:#16171C;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1522; --sheet:#172136; --ink:#E8EDF5; --muted:#9EABC0; --line:#2D3A52;
    --accent:#86A6FF; --accent-ink:#0E1522; --accent-soft:#1D2A49;
    --good:#55D394; --good-soft:#123425; --warn:#FF8F84; --warn-soft:#3B1D1B;
    --gridline:rgba(20,33,58,.32); --f-outline:#0B0C10; --f-blank:#C9D0DB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1522; --sheet:#172136; --ink:#E8EDF5; --muted:#9EABC0; --line:#2D3A52;
  --accent:#86A6FF; --accent-ink:#0E1522; --accent-soft:#1D2A49;
  --good:#55D394; --good-soft:#123425; --warn:#FF8F84; --warn-soft:#3B1D1B;
  --gridline:rgba(20,33,58,.32); --f-outline:#0B0C10; --f-blank:#C9D0DB;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 32px;
  -webkit-tap-highlight-color:transparent}
button,select,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.top{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding-block:18px 10px; max-width:1500px; margin:0 auto}
.brand{display:flex; align-items:center; gap:14px; min-width:0}
.pennant{width:46px; height:46px; flex:none}
.brand h1{font-family:var(--display); font-weight:800; font-size:clamp(30px,3.2vw,44px); line-height:1; margin:0; letter-spacing:-.01em}
.sub{margin:2px 0 0; color:var(--muted); font-size:clamp(14px,1.2vw,17px); letter-spacing:.02em}
.tools{margin-left:auto; display:flex; gap:10px; flex-wrap:wrap}
.ghost{min-height:48px; padding:8px 18px; border-radius:12px; border:2px solid var(--line); background:var(--sheet); font-weight:700; font-size:16px}
.ghost:hover{border-color:var(--ink)}
.ghost.armed{border-color:var(--warn); color:var(--warn)}

.tabs{display:flex; gap:6px; flex-wrap:wrap; max-width:1500px; margin:0 auto 14px; border-bottom:2px solid var(--line)}
.tabs button{border:0; background:none; padding:12px 14px 10px; font-family:var(--display); font-weight:700; font-size:clamp(17px,1.5vw,22px); color:var(--muted); border-bottom:4px solid transparent; margin-bottom:-2px; min-height:52px}
.tabs button small{display:block; font-family:var(--body); font-weight:400; font-size:13px; letter-spacing:.06em; text-transform:uppercase; line-height:1}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

.view{max-width:1500px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:28px; align-items:start}
.stage{background:var(--sheet); border:2px solid var(--line); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:12px; min-width:0}
.stage h2{font-family:var(--display); font-size:clamp(22px,2vw,30px); margin:0; line-height:1.15; text-wrap:balance}
.eyebrow{font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700}
.panel{display:flex; flex-direction:column; gap:16px; min-width:0}
.panel h3{font-family:var(--display); font-size:22px; margin:0; line-height:1.2}
.panel p{margin:0}
.prompt{font-size:clamp(19px,1.6vw,24px); line-height:1.4}
.muted{color:var(--muted)}
.small{font-size:15px}

.steps{display:flex; flex-wrap:wrap; gap:8px}
.steps button{min-height:46px; padding:6px 16px; border-radius:999px; border:2px solid var(--line); background:var(--sheet); font-weight:700; font-size:16px; color:var(--muted)}
.steps button[aria-pressed="true"]{background:var(--ink); color:var(--sheet); border-color:var(--ink)}

.seg{display:inline-flex; flex-wrap:wrap; gap:4px; background:var(--sheet); border:2px solid var(--line); border-radius:14px; padding:4px}
.seg button{border:0; background:none; min-height:46px; padding:6px 16px; border-radius:10px; font-weight:700; font-size:17px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.seg button:disabled{opacity:.35; cursor:default}
.field-label{font-size:14px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.group{display:flex; flex-direction:column; gap:8px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.primary{border:0; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:19px; min-height:54px; padding:10px 24px; border-radius:14px}
.primary:disabled{opacity:.4; cursor:default}
.secondary{border:2px solid var(--ink); background:var(--sheet); font-weight:700; font-size:17px; min-height:50px; padding:8px 18px; border-radius:14px}
.secondary:disabled{opacity:.4; cursor:default}
.choice{min-width:64px; min-height:58px; font-size:22px; font-weight:700; border-radius:14px; border:2px solid var(--line); background:var(--sheet)}

.note{padding:14px 16px; border-radius:14px; background:var(--accent-soft); font-size:18px; line-height:1.45}
.note.good{background:var(--good-soft)}

.flagwrap{width:100%}

.flagsvg text{font-family:var(--mono)}
.ruler{fill:var(--ruler)}
.tick{stroke:var(--ruler-ink); stroke-width:.06}
.rnum{fill:var(--ruler-ink); font-size:.6px; text-anchor:middle}
.part{stroke:var(--f-outline); stroke-width:.07; stroke-linejoin:round; transition:fill .2s}
.part.tap{cursor:pointer}
.part.tap:hover{filter:brightness(1.06)}
.part.hl{stroke:var(--accent); stroke-width:.3}
.part.dim{opacity:.3}
.border{fill:none; stroke:var(--f-outline); stroke-width:.14}
.gridl{stroke:var(--gridline); stroke-width:.04}
.plabel{font-weight:500; text-anchor:middle; dominant-baseline:middle; pointer-events:none}
.emb{stroke:var(--f-outline); stroke-width:.1; stroke-linejoin:round}
.ebadge{fill:var(--ink)} .ebadge-t{fill:var(--sheet); font-size:.7px; text-anchor:middle; dominant-baseline:central}
.fold{stroke:var(--accent); stroke-width:.12; stroke-dasharray:.4 .25}
.handle{cursor:grab; outline:none}
.handle circle{fill:var(--accent); stroke:var(--sheet); stroke-width:.12}
.handle text{fill:var(--accent-ink); font-size:.75px; text-anchor:middle; dominant-baseline:central; pointer-events:none}
.handle:focus-visible circle{stroke:var(--ink); stroke-width:.2}
.hit{stroke:transparent; stroke-width:1.6}
.dimtext{fill:var(--ink); font-size:.7px; text-anchor:middle; dominant-baseline:middle}
.overtext{fill:var(--warn); font-size:.7px; text-anchor:middle; font-weight:500}
.sq-n{fill:var(--on-light); font-size:.42px; text-anchor:middle; dominant-baseline:central; pointer-events:none}
.sq-whole{fill:rgba(255,255,255,.55); stroke:var(--f-outline); stroke-width:.03}
.sq-half{fill:url(#hatchHalf); stroke:var(--f-outline); stroke-width:.03}

.stack{display:block; width:100%; height:auto; max-height:180px}
.stack .sp{stroke-width:.14; fill-opacity:.16}
.stack text{font-family:var(--mono); font-size:.7px; fill:var(--ink)}

.checklist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.checklist li{display:flex; gap:10px; align-items:flex-start; font-size:17px}
.checklist li::before{content:""; flex:none; width:24px; height:24px; border-radius:7px; border:2px solid var(--line); margin-top:1px}
.checklist li.ok::before{content:"✓"; background:var(--good); border-color:var(--good); color:var(--sheet); display:grid; place-items:center; font-weight:700; font-size:16px}

.swatches{display:flex; flex-wrap:wrap; gap:8px}
.sw{width:52px; height:52px; border-radius:12px; border:2px solid var(--f-outline); box-shadow:0 0 0 3px var(--sheet), 0 0 0 5px transparent}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sheet), 0 0 0 6px var(--accent)}
.shapes{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px}
.shapebtn{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; border-radius:12px; border:2px solid var(--line); background:var(--sheet); font-size:14px; font-weight:700; min-height:84px}
.shapebtn svg{width:40px; height:34px}
.shapebtn svg *{fill:var(--accent-soft); stroke:var(--ink); stroke-width:.12; stroke-linejoin:round}
.shapebtn:disabled{opacity:.4; cursor:default}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:8px; padding:6px 6px 6px 12px; border-radius:999px; border:2px solid var(--line); background:var(--sheet); font-size:15px}
.chip button{width:34px; height:34px; border-radius:50%; border:0; background:var(--paper); font-weight:700}
select,input[type="number"],input[type="text"]{min-height:48px; padding:6px 10px; border-radius:10px; border:2px solid var(--line); background:var(--sheet); font-size:18px; max-width:100%}
input[type="number"]{width:5.2em; font-family:var(--mono); text-align:center}
input.bad,select.bad{border-color:var(--warn); background:var(--warn-soft)}
input.okf,select.okf{border-color:var(--good)}

.specform{display:flex; flex-direction:column; gap:12px; background:var(--sheet); border:2px solid var(--line); border-radius:16px; padding:16px}
.specform .line{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:18px}
.results{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.results li{padding:10px 14px; border-radius:12px; background:var(--good-soft); font-size:17px}
.results li.no{background:var(--warn-soft)}
.results li .rt{display:block; font-weight:700}

.speccard{font-family:var(--body); font-size:clamp(20px,1.9vw,27px); line-height:1.5; padding:18px 20px; border-radius:14px; border:2px dashed var(--line); background:var(--paper)}
.speccard .nation{font-family:var(--display); font-weight:800; font-size:1.2em; display:block}
.gap{display:inline-block; min-width:6em; border-bottom:3px solid var(--warn); color:var(--warn); font-weight:700; text-align:center}

.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px}
.card{display:flex; flex-direction:column; gap:6px; padding:10px; border-radius:14px; border:2px solid var(--line); background:var(--sheet); text-align:left}
.card b{font-family:var(--display); font-size:19px; line-height:1.1}
.card span{font-size:14px; color:var(--muted)}
.card[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent)}
.card.found{border-color:var(--good); box-shadow:0 0 0 2px var(--good)}
.card.nope{border-color:var(--warn)}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.pair figure,.trio figure{margin:0; display:flex; flex-direction:column; gap:6px}
.pair figcaption,.trio figcaption{font-weight:700; font-size:16px}
.trio{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
table.partd{border-collapse:collapse; width:100%; font-size:17px}
table.partd th,table.partd td{padding:10px 8px; border-bottom:1.5px solid var(--line); text-align:left; vertical-align:top}
table.partd th{font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.yes{color:var(--good); font-weight:700} .no{color:var(--warn); font-weight:700}
.tbl-wrap{overflow-x:auto}
.partb{border-collapse:collapse}
.partb th,.partb td{padding:6px 10px; text-align:left; border-bottom:1.5px solid var(--line)}
.partb th{font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.dots .dot{fill:var(--ink)}
.dots .dothit{fill:transparent; cursor:pointer}
.dots .dothit:hover{fill:var(--accent-soft)}
.dots .first{fill:var(--accent)}
.dots .poly{fill:var(--accent-soft); stroke:var(--accent); stroke-width:.09; stroke-linejoin:round}
.dots .open{fill:none; stroke:var(--accent); stroke-width:.09; stroke-linejoin:round; stroke-linecap:round}
.dots .vx{fill:var(--accent)}
.dots .lbl{fill:var(--ink); font-family:var(--mono); font-size:.32px; text-anchor:middle; dominant-baseline:central}
.paintgrid{touch-action:none}
.pcell{stroke:var(--f-outline); stroke-width:.04; cursor:pointer}
.tally{display:flex; flex-wrap:wrap; gap:10px}
.tally div{display:flex; align-items:center; gap:8px; padding:6px 12px; border-radius:12px; background:var(--sheet); border:2px solid var(--line); font-family:var(--mono); font-size:18px}
.tally i{width:20px; height:20px; border-radius:5px; border:1.5px solid var(--f-outline)}
.big-num{font-family:var(--display); font-weight:800; font-size:clamp(28px,3vw,40px); line-height:1}

@media (max-width: 960px){
  .view{grid-template-columns:minmax(0,1fr)}
  .trio{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 520px){
  .pair{grid-template-columns:minmax(0,1fr)}
  .stage{padding:12px}
  .seg button{padding:6px 12px; font-size:16px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>

<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= Math core ================= */
const COLORS = ['red','blue','white','gold','green','black','orange','purple'];
const DARK = new Set(['red','blue','green','black','purple']);
const onColor = c => c && DARK.has(c) ? 'var(--on-dark)' : 'var(--on-light)';
const ONE = {2:'half',3:'third',4:'fourth'}, MANY = {2:'halves',3:'thirds',4:'fourths'};
const fracName = (k,n) => k===n ? 'the whole field' : `${k} ${k===1 ? ONE[n] : MANY[n]}`;
const listText = a => a.length<=1 ? a.join('') : a.length===2 ? a.join(' and ') : a.slice(0,-1).join(', ') + ', and ' + a[a.length-1];
const plus = (g,n) => Array(n).fill(g).join(' + ');

const NAMES = {
  v:{2:['left half','right half'],3:['left third','middle third','right third'],4:['stripe 1 (left)','stripe 2','stripe 3','stripe 4 (right)']},
  h:{2:['top half','bottom half'],3:['top third','middle third','bottom third'],4:['stripe 1 (top)','stripe 2','stripe 3','stripe 4 (bottom)']},
  grid:{4:['top-left fourth','top-right fourth','bottom-left fourth','bottom-right fourth']},
  mixed:{3:['left stripe','top-right part','bottom-right part'],4:['stripe 1 (left)','stripe 2','upper triangle','lower triangle']},
  diag:{2:['upper triangle','lower triangle']}
};
const rect = (x0,y0,x1,y1,name) => ({pts:[[x0,y0],[x1,y0],[x1,y1],[x0,y1]], name, w:x1-x0, h:y1-y0, isRect:true});
const tri = (a,b,c,name) => ({pts:[a,b,c], name, isTri:true});
function getParts(f){
  if(f.parts) return f.parts;
  const n=f.n, W=24, H=12, P=[];
  if(f.layout==='v') for(let i=0;i<n;i++) P.push(rect(W*i/n,0,W*(i+1)/n,H,NAMES.v[n][i]));
  else if(f.layout==='h') for(let i=0;i<n;i++) P.push(rect(0,H*i/n,W,H*(i+1)/n,NAMES.h[n][i]));
  else if(f.layout==='grid'){ const N=NAMES.grid[4]; P.push(rect(0,0,12,6,N[0]),rect(12,0,24,6,N[1]),rect(0,6,12,12,N[2]),rect(12,6,24,12,N[3])); }
  else if(f.layout==='mixed' && n===3){ const N=NAMES.mixed[3]; P.push(rect(0,0,8,12,N[0]),rect(8,0,24,6,N[1]),rect(8,6,24,12,N[2])); }
  else if(f.layout==='mixed' && n===4){ const N=NAMES.mixed[4]; P.push(rect(0,0,6,12,N[0]),rect(6,0,12,12,N[1]),tri([12,0],[24,0],[24,12],N[2]),tri([12,0],[24,12],[12,12],N[3])); }
  else if(f.layout==='diag'){ const N=NAMES.diag[2]; P.push(tri([0,0],[24,0],[24,12],N[0]),tri([0,0],[24,12],[0,12],N[1])); }
  return P;
}
function polyArea(pts){ let a=0; for(let i=0;i<pts.length;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length]; a+=x1*y2-x2*y1; } return a/2; }
const areaOf = p => Math.abs(polyArea(p.pts));
function centroid(pts){
  let a=0,cx=0,cy=0;
  for(let i=0;i<pts.length;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length]; const k=x1*y2-x2*y1; a+=k; cx+=(x1+x2)*k; cy+=(y1+y2)*k; }
  a/=2; return [cx/(6*a), cy/(6*a)];
}
function incircle(pts){

  const a=d(B,C), b=d(A,C), c=d(A,B), s=(a+b+c)/2, ar=Math.abs(polyArea(pts));

function compareFlags(src, b){
  const out=[];
  const pOk = src.layout===b.layout && src.n===b.n;
  out.push({k:'partition', label:'Partition: same fraction, equal parts', ok:pOk, why: pOk ? `Both: ${partsLine(src)}` : `The spec says: “${partsLine(src)}” You built: “${partsLine(b)}”`});
  const cOk = src.colors.length===b.colors.length && src.colors.every((c,i)=>c===b.colors[i]);
  out.push({k:'shapes', label:'Shapes: same sides and vertices', ok:null});
  const keyOf = e => `${SH[e.shape].sides}|${e.part}`;
  const A=src.emblems.map(keyOf).sort(), B=b.emblems.map(keyOf).sort();
  const sOk = A.length===B.length && A.every((x,i)=>x===B[i]);
  const sp=getParts(src);
  out[1].ok=sOk; out[1].why = sOk ? `Every shape matches: ${src.emblems.map(e=>`${SH[e.shape].sides} sides and ${SH[e.shape].sides} vertices`).join('; ') || 'no emblem'}.` :
    `The spec asks for: ${src.emblems.map(e=>`${SH[e.shape].sides===0?'a circle':`a ${SH[e.shape].sides}-sided shape`} in the ${sp[e.part].name}`).join('; ') || 'no emblem'}. You built: ${b.emblems.map(e=>`${SH[e.shape].sides===0?'a circle':`a ${SH[e.shape].sides}-sided shape`} in the ${(getParts(b)[e.part]||{}).name}`).join('; ') || 'no emblem'}.`;
  out.push({k:'colors', label:'Colors in the right order', ok:cOk, why: cOk ? `${src.colors.join(', ')}.` : `Spec: ${src.colors.join(', ')}. Built: ${b.colors.map(c=>c||'blank').join(', ')}.`});
  return out;
}

const CH_FLAGS = {four:{layout:'mixed',n:4,colors:['purple','orange','gold','white'],emblems:[]}, three:{layout:'mixed',n:3,colors:['green','white','gold'],emblems:[]}};
const PW=6, PH=4, PCOL=['red','blue','gold','green'];
function paintDefault(n){ return Array.from({length:PW*PH},(_,k)=>{ const x=k%PW, y=Math.floor(k/PW); return n===4 ? PCOL[y] : n===3 ? PCOL[Math.floor(x/2)] : PCOL[Math.floor(x/3)]; }); }
function checkPaint(){
  const p=S.ch.paint, n=p.n, want=PW*PH/n, cols=PCOL.slice(0,n);
  const blank=p.cells.filter(c=>!c).length;
  if(blank) return {ok:false, html:`${blank} square${blank===1?' is':'s are'} still blank. Every square belongs to one part.`};
  const cnt=cols.map(c=>p.cells.filter(x=>x===c).length);
  const off=cols.map((c,i)=>[c,cnt[i]]).filter(([,k])=>k!==want);
  if(off.length) return {ok:false, html:`${MANY[n][0].toUpperCase()+MANY[n].slice(1)} of 24 squares need <b>${want} each</b> (${plus(want,n)} = 24). ${off.map(([c,k])=>`${c[0].toUpperCase()+c.slice(1)} has ${k}, ${k>want?`${k-want} too many`:`${want-k} too few`}.`).join(' ')}`};
  const pieces = c => { const set=new Set(p.cells.map((x,k)=>x===c?k:-1).filter(k=>k>=0)); let comps=0; const seen=new Set();
    for(const s of set){ if(seen.has(s)) continue; comps++; const st=[s]; seen.add(s); while(st.length){ const k=st.pop(), x=k%PW, y=Math.floor(k/PW);
      [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].forEach(([a,b])=>{ if(a<0||b<0||a>=PW||b>=PH) return; const j=b*PW+a; if(set.has(j)&&!seen.has(j)){ seen.add(j); st.push(j);} }); } } return comps; };
  const split=cols.filter(c=>pieces(c)>1);
  if(split.length) return {ok:false, html:`${listText(split.map(c=>c[0].toUpperCase()+c.slice(1)))} ${split.length===1?'is':'are'} in separate pieces. Join each color into one piece so each part is one shape.`};
  const keys=cols.map(c=>shapeKey(p.cells.map((x,k)=>x===c?[k%PW,Math.floor(k/PW)]:null).filter(Boolean)));
  const same=new Set(keys).size===1;
  return {ok:true, same, html:`<b>Equal parts!</b> Each color covers ${want} squares, so each is 1 ${ONE[n]}. ${same ? 'All the parts are the same shape (turn or flip them and they match). Can you make them different shapes but still '+want+' squares each?' : '<b>And they are not all the same shape.</b> That is the challenge: equal shares do not have to match.'}`};
}

function renderCh(){
  const c=S.ch;
  const list=[['four','Fourths, different shapes'],['three','Thirds, not stripes'],['paint','Square painter']];
  let stage='', panel=steps(list,c.step,'chstep');
  panel = `<p class="prompt"><i>Design a flag cut into fourths where the four parts are not all the same shape, and prove each is a fourth by counting square centimeters. Then try thirds that are not stripes.</i></p>` + panel;
  if(c.step==='four'||c.step==='three'){
    const f=CH_FLAGS[c.step], parts=getParts(f), counted=c.counted[c.step]||{}, prog=c.prog[c.step]||{};
    let under='';
    parts.forEach((p,i)=>{ if(!(i in counted)) return; const {whole,half}=countSquares(p), shown=prog[i]??Infinity; let k=0;
      whole.forEach(([x,y])=>{ k++; if(k>shown) return; under+=`<rect class="sq-whole" x="${x}" y="${y}" width="1" height="1"/><text class="sq-n" x="${x+.5}" y="${y+.5}">${k}</text>`; });
      if(shown>=whole.length) half.forEach(([x,y])=>{ const tri = p.pts; // draw only the half inside the part
        const inUpper = p.name==='upper triangle';
        const pts = inUpper ? [[x,y],[x+1,y],[x+1,y+1]] : [[x,y],[x+1,y+1],[x,y+1]];
        under+=`<polygon class="sq-half" points="${P(pts)}"/>`; });
    });
    stage=`<span class="eyebrow">Extension · 1 square = 1 square centimeter</span><h2>${c.step==='four'?'Four parts, two shapes. Are they all fourths?':'Three parts, not stripes. Are they all thirds?'}</h2>
      <div class="flagwrap">${flagSVG(f,{ruler:true, grid:true, under, aria:'Flag on a square grid'})}</div>`;
    panel+=`<p>Tap a part to count its squares.</p><div class="group">${parts.map((p,i)=>`<button type="button" class="secondary" style="text-align:left" data-act="chcount" data-v="${i}">Count the ${esc(p.name)}</button>`).join('')}</div>`;
    const done=Object.keys(counted);
    if(done.length){
      panel+=`<ul class="results">${done.map(i=>{ const p=parts[i], {whole,half}=countSquares(p);
        const m = half.length ? `${whole.length} whole squares + ${half.length} half squares. Two halves make one whole, so ${half.length} halves = ${half.length/2} wholes. ${whole.length} + ${half.length/2} = <b>${whole.length+half.length/2} squares</b>.` : `${p.h} rows of ${p.w} squares = <b>${whole.length} squares</b>.`;
        return `<li><span class="rt">${esc(p.name)}</span>${m}</li>`; }).join('')}</ul>`;
      if(done.length===parts.length){ const each=areaOf(parts[0]);
        panel+=`<div class="note good"><b>Every part covers ${each} squares.</b> ${plus(each,parts.length)} = 288, the whole flag. So each part is 1 ${ONE[parts.length]}, ${c.step==='four'?'even though two are rectangles and two are triangles':'even though one is a tall stripe and two are long flat pieces'}.</div>`; }
    }
  } else {
    const p=c.paint; if(!p.cells) p.cells=paintDefault(p.n);
    const want=24/p.n, cols=PCOL.slice(0,p.n);
    let cells=''; p.cells.forEach((col,k)=>{ const x=k%PW, y=Math.floor(k/PW); cells+=`<rect class="pcell" data-pc="${k}" x="${x}" y="${y}" width="1" height="1" style="fill:${col?`var(--f-${col})`:'var(--f-blank)'}"/>`; });
    stage=`<span class="eyebrow">Square painter · mini flag 6 cm × 4 cm = 24 squares</span><h2>Paint ${MANY[p.n]}: ${want} squares each</h2>
      <div class="flagwrap" id="paintStage"><svg class="flagsvg paintgrid" viewBox="-.2 -.2 ${PW+.4} ${PH+.4}" role="img" aria-label="Painting grid">${cells}<rect class="border" x="0" y="0" width="${PW}" height="${PH}" style="stroke-width:.08"/></svg></div>`;
    panel+=`<div class="group"><span class="field-label">Make</span>${seg([[2,'Halves'],[3,'Thirds'],[4,'Fourths']], p.n, 'pnn')}</div>
      <div class="group"><span class="field-label">Paint color (drag to paint)</span><div class="swatches">${cols.map(cc=>`<button type="button" class="sw" data-act="pcolor" data-v="${cc}" aria-pressed="${p.color===cc}" aria-label="${cc}" style="background:var(--f-${cc})"></button>`).join('')}<button type="button" class="sw" data-act="pcolor" data-v="" aria-pressed="${p.color===''}" aria-label="eraser" style="background:var(--f-blank)">⌫</button></div></div>
      <div class="tally">${cols.map(cc=>`<div><i style="background:var(--f-${cc})"></i>${p.cells.filter(x=>x===cc).length}</div>`).join('')}</div>
      <div class="row"><button class="primary" type="button" data-act="pcheck2">Check my ${MANY[p.n]}</button><button class="secondary" type="button" data-act="preset">Back to stripes</button><button class="secondary" type="button" data-act="pclear">Clear</button></div>
      ${p.result?`<div class="note ${p.result.ok?'good':'warn'}">${p.result.html}</div>`:''}`;
  }
  app.innerHTML = `<section class="view"><div class="stage">${stage}</div><div class="panel">${panel}</div></section>`;
}
function startCount(step,i){
  const parts=getParts(CH_FLAGS[step]); const {whole}=countSquares(parts[i]);
  S.ch.counted[step]=S.ch.counted[step]||{}; S.ch.counted[step][i]=true;
  S.ch.prog[step]=S.ch.prog[step]||{};
  clearInterval(countTimer);
  if(reduced){ S.ch.prog[step][i]=whole.length; render(); return; }
  S.ch.prog[step][i]=0; render();
  countTimer=setInterval(()=>{ const pr=S.ch.prog[step]; pr[i]=Math.min(whole.length, pr[i]+3); if(S.tab==='ch'&&S.ch.step===step) render(); if(pr[i]>=whole.length) clearInterval(countTimer); }, 40);
}

/* ================= Events ================= */
const ACT = {
  c1step:d=>{ S.c1.step=d.v; },
  wcount:d=>{ S.c1.wCount=+d.v; S.c1.wEq=null; },
  weq:d=>{ S.c1.wEq=d.v; },
  wnav:d=>{ S.c1.wi=Math.max(0,Math.min(WARM.length-1,S.c1.wi+ +d.v)); S.c1.wCount=null; S.c1.wEq=null; },
  fn:d=>{ const fd=S.c1.fold; fd.n=+d.v; if(fd.way==='grid'&&fd.n!==4) fd.way='v'; fd.cuts=defaultCuts(fd.way==='grid'?4:fd.n,fd.way); fd.result=null; fd.tries=0; },
  fway:d=>{ const fd=S.c1.fold; fd.way=d.v; if(d.v==='grid') fd.n=4; fd.cuts=defaultCuts(fd.n,fd.way); fd.result=null; fd.tries=0; },
  fmeasure:()=>{ S.c1.fold.measure=!S.c1.fold.measure; },
  fcheck:()=>checkFold(),
  pn:d=>{ S.c1.prac.n=+d.v; },
  pcheck:()=>{ const v=$('#pracIn').value.trim(); const pr=S.c1.prac; pr.guess[pr.n]= v===''?'':String(Math.max(1,Math.min(12,Math.round(+v)||1))); pr.checked[pr.n]=true; },
  share:d=>{ S.c1.share=+d.v; },
  c2step:d=>{ S.c2.step=d.v; },
  dtarget:d=>{ S.c2.target=d.v; },
  dot:d=>{ const c=S.c2; if(c.closed) return; const x=+d.x, y=+d.y;
    if(c.dots.length>=3 && c.dots[0][0]===x && c.dots[0][1]===y){ c.closed=true; return; }
    if(c.dots.some(p=>p[0]===x&&p[1]===y)) return;
    c.dots.push([x,y]); },
  dundo:()=>{ S.c2.dots.pop(); },
  dclear:()=>{ S.c2.dots=[]; S.c2.closed=false; },
  pbcheck:()=>{ S.c2.partBChecked=true; },
  dfrac:d=>{ const f=D[d.key].get(); setFracLayout(f,+d.v,f.layout); afterDesign(d.key); },
  dlay:d=>{ const f=D[d.key].get(); setFracLayout(f,f.n,d.v); afterDesign(d.key); },
  dcolor:d=>{ D[d.key].st().paint=d.v; },
  dpart:d=>{ const f=D[d.key].get(); f.colors[+d.i]=D[d.key].st().paint; afterDesign(d.key); },
  dshape:d=>{ const f=D[d.key].get(), st=D[d.key].st(); if(f.emblems.length>=3) return; f.emblems.push({shape:d.v, part:st.place, color:st.paint}); afterDesign(d.key); },
  ddel:d=>{ D[d.key].get().emblems.splice(+d.v,1); afterDesign(d.key); },
  c2grid:()=>{ S.c2.grid=!S.c2.grid; },
  speccheck:()=>{ S.c2.results=checkSpec(S.c2.flag, defaultForm(S.c2.flag)); },
  savefd:()=>{ const f=clone(S.c2.flag); f.ours=true; S.gallery.push(f); S.c2.saved=true; S.c3.src=S.gallery.length-1; },
  c2share:d=>{ S.c2.readAloud = d.v==='read'; S.c2.reveal=false; },
  c2reveal:()=>{ S.c2.reveal=!S.c2.reveal; },
  miss:d=>{ S.c2.missPick=d.v; },
  missfull:()=>{ S.c2.showFull=!S.c2.showFull; },
  missnav:d=>{ S.c2.missI=Math.max(0,Math.min(MISS.length-1,S.c2.missI+ +d.v)); S.c2.missPick=null; S.c2.showFull=false; },
  c3step:d=>{ S.c3.step=d.v; },
  compare:()=>{ S.c3.compared=true; S.c3.verdict={}; },
  rebuildagain:()=>{ S.c3.compared=false; },
  rebuildnew:()=>{ S.c3.compared=false; S.c3.src=(S.c3.src+1)%S.gallery.length; S.c3.built={layout:'v',n:2,colors:[null,null],emblems:[]}; },
  verdict:(d,b)=>{ S.c3.verdict[b.closest('[data-k]')?.dataset.k||d.k]=d.v; },
  exmode:d=>{ S.c3.hunt = d.v==='hunt'; S.c3.huntMsg=null; },
  quiznew:()=>newQuiz(),
  quizpick:d=>{ S.c3.quiz.pick=+d.v; },
  card:d=>{ const i=+d.i; if(S.c3.hunt) huntTap(i); else S.c3.sel=i; },
  chstep:d=>{ S.ch.step=d.v; },
  chcount:d=>{ startCount(S.ch.step,+d.v); return 'norender'; },
  pnn:d=>{ const p=S.ch.paint; p.n=+d.v; p.cells=paintDefault(p.n); p.color=PCOL[0]; p.result=null; },
  pcolor:d=>{ S.ch.paint.color=d.v; },
  pcheck2:()=>{ S.ch.paint.result=checkPaint(); },
  preset:()=>{ const p=S.ch.paint; p.cells=paintDefault(p.n); p.result=null; },
  pclear:()=>{ const p=S.ch.paint; p.cells=Array(PW*PH).fill(''); p.result=null; }
};
function afterDesign(key){ if(key==='c2'){ S.c2.results=null; S.c2.saved=false; } }

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-tab]');
  if(t){ S.tab=t.dataset.tab; render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const fn=ACT[b.dataset.act]; if(!fn) return;
  // keep the "verdict" row key
  const d=Object.assign({}, b.dataset);
  if(b.dataset.act==='verdict'){ d.k=b.closest('.seg')?.querySelector('[data-k]')?.dataset.k || b.dataset.k; }
  const r=fn(d,b); if(r!=='norender') render();
});
document.addEventListener('change', e=>{
  const el=e.target, ch=el.dataset.ch; if(!ch) return;
  if(ch==='dplace'){ D[el.dataset.key].st().place=+el.value; return; }
  if(ch==='sf'){ S.c2.form[el.dataset.k]=el.value; if(el.dataset.rerender){ render(); } return; }
  if(ch==='sfcol'){ S.c2.form.colors[+el.dataset.i]=el.value; return; }
  if(ch==='sfem'){ S.c2.form.em[+el.dataset.i][el.dataset.k]=el.value; return; }
  if(ch==='pb'){ S.c2.partB[el.dataset.k]=el.value; return; }
  if(ch==='src'){ S.c3.src=+el.value; S.c3.compared=false; render(); return; }
});
document.addEventListener('input', e=>{
  const el=e.target, ch=el.dataset.ch; if(!ch) return;
  if(ch==='sf' && el.tagName==='INPUT') S.c2.form[el.dataset.k]=el.value;
  if(ch==='sfem' && el.tagName==='INPUT') S.c2.form.em[+el.dataset.i][el.dataset.k]=el.value;
  if(ch==='pb') S.c2.partB[el.dataset.k]=el.value;
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='pracIn'){ ACT.pcheck(); render(); }
});

/* Fold-line dragging */
let drag=null;
function toCm(e){ const svg=$('#foldStage svg'); if(!svg) return null; const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function setCut(k, val){
  const fd=S.c1.fold; const c=fd.cuts.slice();
  if(fd.way==='grid'){ c[k]=Math.max(1,Math.min(k===0?23:11,val)); }
  else { const max=fd.way==='v'?24:12, lo=(k===0?0:c[k-1])+1, hi=(k===c.length-1?max:c[k+1])-1; c[k]=Math.max(lo,Math.min(hi,val)); }
  if(c[k]!==fd.cuts[k]){ fd.cuts=c; fd.result=null; return true; } return false;
}
document.addEventListener('pointerdown', e=>{
  const h=e.target.closest('[data-cut]'); if(!h||!$('#foldStage')) return;
  e.preventDefault(); drag={k:+h.dataset.cut, dir:h.dataset.dir};
});
window.addEventListener('pointermove', e=>{
  if(drag){ const p=toCm(e); if(!p) return; if(setCut(drag.k, Math.round(drag.dir==='x'?p.x:p.y))) render(); return; }
  if(paintDrag) paintAt(e);
});
window.addEventListener('pointerup', ()=>{ drag=null; paintDrag=false; });
window.addEventListener('pointercancel', ()=>{ drag=null; paintDrag=false; });
document.addEventListener('keydown', e=>{
  const h=e.target.closest && e.target.closest('[data-cut]'); if(!h) return;
  const k=+h.dataset.cut, step = (e.key==='ArrowRight'||e.key==='ArrowDown')?1:(e.key==='ArrowLeft'||e.key==='ArrowUp')?-1:0;
  if(!step) return; e.preventDefault();
  const fd=S.c1.fold; if(setCut(k, fd.cuts[k]+step)){ render(); const nh=document.querySelector(`[data-cut="${k}"]`); nh&&nh.focus(); }
});
/* Square painter */
let paintDrag=false;
function paintAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY); const r=el&&el.closest&&el.closest('[data-pc]'); if(!r) return;
  const p=S.ch.paint, k=+r.dataset.pc; if(p.cells[k]===p.color) return;
  p.cells[k]=p.color; p.result=null; render();
}
document.addEventListener('pointerdown', e=>{ const r=e.target.closest('[data-pc]'); if(!r) return; e.preventDefault(); paintDrag=true; paintAt(e); });

/* Header tools */
$('#fsBtn').addEventListener('click', ()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else { const p=document.documentElement.requestFullscreen(); p&&p.catch&&p.catch(()=>{}); } }catch(_){} });
document.addEventListener('fullscreenchange', ()=>{ $('#fsBtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
let armT=null;
$('#resetBtn').addEventListener('click', e=>{
  const b=e.currentTarget;
  if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='Tap again to clear everything'; clearTimeout(armT); armT=setTimeout(()=>{ b.classList.remove('armed'); b.textContent='Start over'; },3500); return; }
  clearTimeout(armT); b.classList.remove('armed'); b.textContent='Start over'; clearInterval(countTimer);
  const tab=S.tab; S=freshState(); S.tab=tab; render();
});

render();
})();
</script>
