<style>
/* Layout: a drafting-table workshop. Blueprint-grid paper, one column of "Parts" per class, each a stage (drawing) beside its tools. */
:root{
  --paper:#EDF1F6; --card:#FFFFFF; --ink:#14223A; --muted:#55617A; --line:#CBD4E1; --grid:#DCE3EE;
  --sail:#DE4329; --sail-soft:#FCE5DF; --sun:#F0AE2C; --sun-soft:#FDF1D8;
  --fold:#0B8582; --fold-soft:#DDF2F0; --angle:#7445C9; --spar:#8A5A22;
  --good:#1C7F45; --good-soft:#E1F3E8; --try:#B0402A; --try-soft:#FBEAE4;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1520; --card:#17202D; --ink:#E7ECF3; --muted:#9BA7B9; --line:#2D3A4D; --grid:#1B2533;
    --sail:#FF6B4F; --sail-soft:#3A1E18; --sun:#F4C04F; --sun-soft:#3A2F14;
    --fold:#3FCBC3; --fold-soft:#123331; --angle:#B192FF; --spar:#D39B55;
    --good:#55C885; --good-soft:#15301F; --try:#FF8A6E; --try-soft:#3A201A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1520; --card:#17202D; --ink:#E7ECF3; --muted:#9BA7B9; --line:#2D3A4D; --grid:#1B2533;
  --sail:#FF6B4F; --sail-soft:#3A1E18; --sun:#F4C04F; --sun-soft:#3A2F14;
  --fold:#3FCBC3; --fold-soft:#123331; --angle:#B192FF; --spar:#D39B55;
  --good:#55C885; --good-soft:#15301F; --try:#FF8A6E; --try-soft:#3A201A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:28px 28px;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:1360px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:14px 40px}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fold); outline-offset:2px}

header{display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 24px; padding-block:6px 14px}
.brand{min-width:0}
.eyebrow{font-family:var(--mono); font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
h1{font-family:var(--display); font-weight:800; font-size:clamp(34px,4.4vw,60px); line-height:1; margin:4px 0 6px; letter-spacing:-.02em; text-wrap:balance}
h1 .k{color:var(--sail)}
.premise{margin:0; color:var(--muted); font-size:clamp(16px,1.4vw,20px)}
.tools{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.ghost{border:2px solid var(--line); background:var(--card); border-radius:12px; padding:10px 16px; font-weight:700; min-height:48px}
.ghost:hover{border-color:var(--ink)}

nav.classes{display:flex; gap:8px; flex-wrap:wrap; z-index:5; background:var(--paper); padding-block:8px; border-bottom:2px solid var(--line); margin-bottom:18px}
@media (min-width:700px){nav.classes{position:sticky; top:env(safe-area-inset-top,0px)}}
nav.classes button{border:2px solid var(--line); background:var(--card); border-radius:14px; padding:10px 16px; min-height:56px; text-align:left; display:flex; flex-direction:column; line-height:1.15}
nav.classes button small{font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
nav.classes button b{font-family:var(--display); font-size:19px}
nav.classes button[aria-selected="true"]{background:var(--ink); border-color:var(--ink); color:var(--card)}
nav.classes button[aria-selected="true"] small{color:var(--card); opacity:.75}

.view[hidden]{display:none}
.part{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:clamp(14px,2vw,26px); margin-bottom:20px}
.part-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px}
.tag{font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:.08em; color:var(--card); background:var(--sail); padding:4px 10px; border-radius:8px}
h2{font-family:var(--display); font-size:clamp(26px,2.6vw,36px); margin:0; line-height:1.1}
h3{font-family:var(--display); font-size:clamp(20px,1.8vw,24px); margin:18px 0 8px}
.lead{margin:4px 0 14px; color:var(--muted); max-width:62ch}
.grid2{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:22px; align-items:start}
.grid2 > *{min-width:0}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--paper); border:2px solid var(--line); border-radius:14px; padding:8px; position:relative}
.stage svg{display:block; width:100%; height:auto; touch-action:none; user-select:none}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.btn{border:0; background:var(--sail); color:#fff; font-weight:700; font-size:18px; padding:12px 22px; border-radius:14px; min-height:52px}
.btn.alt{background:var(--card); color:var(--ink); border:2px solid var(--ink)}
.btn.fold{background:var(--fold); color:#fff}
.btn:disabled{opacity:.45; cursor:default}
.seg{display:inline-flex; flex-wrap:wrap; border:2px solid var(--line); border-radius:14px; padding:3px; background:var(--card); gap:2px}
.seg button{border:0; background:none; padding:10px 16px; border-radius:10px; font-weight:700; min-height:46px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.fb{border-radius:12px; padding:12px 16px; margin:10px 0 0; font-size:18px; max-width:62ch}
.fb:empty{display:none}
.fb.ok{background:var(--good-soft); border-left:6px solid var(--good)}
.fb.try{background:var(--try-soft); border-left:6px solid var(--try)}
.fb.info{background:var(--fold-soft); border-left:6px solid var(--fold)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:15px}

/* Toolkit */
.answers{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:10px}
.answers button{border:2px solid var(--line); background:var(--card); border-radius:12px; min-height:56px; font-weight:700; font-size:17px; padding:8px}
.answers button:hover{border-color:var(--ink)}
.answers button.right{background:var(--good-soft); border-color:var(--good)}
.answers button.wrong{background:var(--try-soft); border-color:var(--try)}
.score{font-family:var(--mono); font-size:15px; color:var(--muted)}
.hunt{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-top:14px}
.hunt label{display:flex; flex-direction:column; gap:4px; font-weight:700; font-size:16px}
.hunt input{border:2px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--card); min-height:48px}

/* Catalog table */
.tblwrap{overflow-x:auto}
table.cat{border-collapse:separate; border-spacing:0 6px; width:100%; min-width:520px}
table.cat th{font-size:14px; text-align:center; color:var(--muted); font-weight:700; padding:0 4px; line-height:1.2}
table.cat th:first-child{text-align:left}
table.cat td{text-align:center; padding:0 3px}
table.cat td:first-child{text-align:left}
.shapebtn{display:flex; align-items:center; gap:8px; border:2px solid transparent; background:none; border-radius:10px; padding:4px 8px 4px 4px; font-weight:700; min-height:48px; text-align:left}
.shapebtn svg{width:40px; height:34px; flex:none}
.shapebtn[aria-pressed="true"]{border-color:var(--fold); background:var(--fold-soft)}
.cyc{width:60px; height:48px; border:2px solid var(--line); border-radius:10px; background:var(--card); font-family:var(--mono); font-weight:700; font-size:19px}
.cyc.empty{color:var(--muted)}
.cyc.bad{border-color:var(--try); background:var(--try-soft)}
.cyc.good{border-color:var(--good); background:var(--good-soft)}
.marks{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chip{border:2px solid var(--line); background:var(--card); border-radius:999px; padding:8px 14px; font-weight:700; font-size:15px; min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--card); border-color:var(--ink)}
.chip.good{border-color:var(--good); background:var(--good-soft); color:var(--ink)}
.chip.bad{border-color:var(--try); background:var(--try-soft); color:var(--ink)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.tcard{border:2px solid var(--line); background:var(--card); border-radius:14px; padding:6px; display:flex; flex-direction:column; align-items:center; gap:2px; min-height:150px}
.tcard svg{width:100%; height:96px}
.tcard .lab{font-weight:700; font-size:16px; padding:4px 10px; border-radius:999px; background:var(--paper)}
.tcard.bad{border-color:var(--try)} .tcard.good{border-color:var(--good)}
.yn{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0}
.yn span{font-weight:700; min-width:15ch}

/* Practice kite & blueprint fields */
.qlist{display:flex; flex-direction:column; gap:12px; counter-reset:q; padding:0; margin:0; list-style:none}
.qlist li{display:grid; grid-template-columns:36px minmax(0,1fr); gap:10px; align-items:start}
.qlist li::before{counter-increment:q; content:counter(q); width:34px; height:34px; border-radius:50%; background:var(--ink); color:var(--card); display:grid; place-items:center; font-weight:700; font-family:var(--mono)}
.qlist li.done::before{content:"✓"; background:var(--good)}
.qtext{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px}
.inp{width:84px; min-height:48px; border:2px solid var(--line); border-radius:10px; padding:6px 8px; text-align:center; font-family:var(--mono); font-weight:700; font-size:20px; background:var(--card)}
.inp.bad{border-color:var(--try); background:var(--try-soft)} .inp.good{border-color:var(--good); background:var(--good-soft)}
select.inp{width:auto; font-family:var(--body); font-size:17px; padding-inline:10px}
.qfb{grid-column:2; font-size:16px; border-radius:10px; padding:8px 12px}
.qfb:empty{display:none}
.qfb.ok{background:var(--good-soft)} .qfb.try{background:var(--try-soft)}
.sliders{display:grid; gap:10px; margin-top:10px}
.sliders label{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; align-items:center; font-weight:700}
.sliders input[type=range]{grid-column:1 / -1; width:100%; height:36px; accent-color:var(--sail)}
.spec{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 16px; font-size:16px; margin:10px 0}
.spec div{display:flex; justify-content:space-between; border-bottom:1px dashed var(--line); padding:4px 0}
.bp{display:flex; flex-direction:column; gap:12px}
.bp .line{display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center}
.bp .line > b{min-width:11ch}
.team{border:2px solid var(--line); border-radius:10px; padding:10px 12px; min-height:48px; background:var(--card); width:min(100%,260px)}

/* Festival */
.fest{display:grid; grid-template-columns:220px minmax(0,1.3fr) minmax(0,1fr); gap:18px; align-items:start}
.fest > *{min-width:0}
@media (max-width:1100px){.fest{grid-template-columns:minmax(0,1fr)}}
.entries{display:flex; flex-direction:column; gap:6px}
@media (max-width:1100px){.entries{flex-direction:row; flex-wrap:wrap}}
.entries button{border:2px solid var(--line); background:var(--card); border-radius:12px; padding:10px 12px; text-align:left; min-height:52px; font-weight:700}
.entries button small{display:block; font-weight:400; color:var(--muted); font-size:13px}
.entries button[aria-pressed="true"]{border-color:var(--sail); background:var(--sail-soft)}
.card2{border:2px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--card)}
.claims{font-size:16px; display:grid; gap:4px}
.claims div{display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed var(--line); padding:3px 0}
.judge{display:grid; gap:10px; margin-top:12px}
.jrow{border:2px solid var(--line); border-radius:12px; padding:10px 12px; display:grid; gap:8px}
.jrow.good{border-color:var(--good)} .jrow.bad{border-color:var(--try)}
.jrow .t{font-weight:700}
.mm{display:flex; gap:6px}
.mm button{flex:1; border:2px solid var(--line); border-radius:10px; background:var(--card); min-height:46px; font-weight:700}
.mm button[aria-pressed="true"].y{background:var(--good); border-color:var(--good); color:#fff}
.mm button[aria-pressed="true"].n{background:var(--try); border-color:var(--try); color:#fff}
.tally{font-family:var(--display); font-size:24px; font-weight:800; margin-top:6px}
body.present header .premise, body.present nav.classes, body.present .fest .entries, body.present .lead{display:none}
body.present .fest{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:1100px){body.present .fest{grid-template-columns:minmax(0,1fr)}}

/* Challenge */
.goals{display:flex; flex-direction:column; gap:8px; margin:10px 0}
.goal{display:flex; gap:10px; align-items:center; border:2px solid var(--line); border-radius:12px; padding:10px 12px; font-weight:700}
.goal i{width:28px; height:28px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-style:normal; flex:none}
.goal.met{border-color:var(--good); background:var(--good-soft)}
.goal.met i{background:var(--good); border-color:var(--good); color:#fff}
.bigstat{font-family:var(--display); font-size:clamp(28px,3vw,44px); font-weight:800; line-height:1}
table.res{border-collapse:collapse; font-size:17px; margin-top:8px}
table.res td,table.res th{padding:6px 16px 6px 0; text-align:left; border-bottom:1px solid var(--line)}
table.res td.num{text-align:right}

svg text{font-family:var(--body)}
.svg-ink{stroke:var(--ink)} 
@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}
</style>

<script>
(function(){
// ---- core geometry (shared with app) ----
const EPS=1e-7;
function centroid(P){let x=0,y=0;for(const p of P){x+=p[0];y+=p[1];}return [x/P.length,y/P.length];}
function reflect(p,o,d){const vx=p[0]-o[0],vy=p[1]-o[1];const t=vx*d[0]+vy*d[1];return [o[0]+2*t*d[0]-vx, o[1]+2*t*d[1]-vy];}
function same(a,b){return Math.abs(a[0]-b[0])<1e-6&&Math.abs(a[1]-b[1])<1e-6;}
function isAxis(P,o,d){const n=P.length;const R=P.map(p=>reflect(p,o,d));
  for(let k=0;k<n;k++){let ok=true;for(let i=0;i<n&&ok;i++){if(!same(R[i],P[((k-i)%n+n)%n]))ok=false;}if(ok)return true;}return false;}
function candAxes(P){const o=centroid(P),n=P.length,out=[];
  const pts=[];for(let i=0;i<n;i++){pts.push(P[i]);pts.push([(P[i][0]+P[(i+1)%n][0])/2,(P[i][1]+P[(i+1)%n][1])/2]);}
  for(const q of pts){let dx=q[0]-o[0],dy=q[1]-o[1];const L=Math.hypot(dx,dy);if(L<1e-9)continue;dx/=L;dy/=L;if(dx<-1e-9||(Math.abs(dx)<1e-9&&dy<0)){dx=-dx;dy=-dy;}
    if(!out.some(d=>Math.abs(d[0]-dx)<1e-6&&Math.abs(d[1]-dy)<1e-6))out.push([dx,dy]);}
  return {o,axes:out};}
function symLines(P){const {o,axes}=candAxes(P);return axes.filter(d=>isAxis(P,o,d));}
// integer helpers
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], cross=(a,b)=>a[0]*b[1]-a[1]*b[0], dot=(a,b)=>a[0]*b[0]+a[1]*b[1], d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
function segX(p1,p2,p3,p4){const o=(a,b,c)=>Math.sign(cross(sub(b,a),sub(c,a)));const on=(a,b,c)=>Math.min(a[0],b[0])<=c[0]&&c[0]<=Math.max(a[0],b[0])&&Math.min(a[1],b[1])<=c[1]&&c[1]<=Math.max(a[1],b[1]);
  const o1=o(p1,p2,p3),o2=o(p1,p2,p4),o3=o(p3,p4,p1),o4=o(p3,p4,p2);
  if(o1!==o2&&o3!==o4)return true;if(o1===0&&on(p1,p2,p3))return true;if(o2===0&&on(p1,p2,p4))return true;if(o3===0&&on(p3,p4,p1))return true;if(o4===0&&on(p3,p4,p2))return true;return false;}
function polyIssue(P){const n=P.length;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(P[i][0]===P[j][0]&&P[i][1]===P[j][1])return 'dup';
  for(let i=0;i<n;i++){if(cross(sub(P[(i+1)%n],P[i]),sub(P[(i+n-1)%n],P[i]))===0)return 'straight';}
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){if(j===i+1||(i===0&&j===n-1))continue;if(segX(P[i],P[(i+1)%n],P[j],P[(j+1)%n]))return 'cross';}return null;}
// interior angle type at vertex i for a simple polygon: returns 'right'|'acute'|'obtuse'|'reflex'
function area2(P){let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=a[0]*b[1]-a[1]*b[0];}return s;}
function angleType(P,i){const n=P.length,a=P[(i+n-1)%n],v=P[i],b=P[(i+1)%n];const u=sub(a,v),w=sub(b,v);
  const sgn=Math.sign(area2(P));const cr=cross(sub(v,a),sub(b,v));// turn
  const convex=Math.sign(cr)===sgn; if(!convex)return 'reflex';const dt=dot(u,w);return dt===0?'right':dt>0?'acute':'obtuse';}

/* ---------- PART 6: Festival ---------- */
const SAMPLES=[
 {team:'Team Falcon',sample:true,d:{mode:'diamond',A:80,C:50},claims:{angles:[80,115,50,115],name:'Kite',props:['adj','diag'],lines:2,sp1:90,sp2:360}},
 {team:'Team Comet',sample:true,d:{mode:'diamond',A:70,C:70},claims:{angles:[70,110,70,110],name:'Rhombus',props:['all','par2','adj','diag'],lines:2,sp1:90,sp2:360}},
 {team:'Team Gust',sample:true,d:{mode:'box',w:60,h:40},claims:{angles:[90,90,90,90],name:'Square',props:['rt','all'],lines:2,sp1:90,sp2:360}},
 {team:'Team Nimbus',sample:true,d:{mode:'diamond',A:100,C:60},claims:{angles:[100,110,60,110],name:'Kite',props:['adj','diag'],lines:1,sp1:90,sp2:360}}];
function mountFestival(){const el=$('#p6');let cur=0,meas=null,fold=false,spar=false,judge={},checked=false;const list=()=>[...SAMPLES,...FEST];
  el.innerHTML=`<div class="part-head"><span class="tag">PART 6</span><h2>Festival Judge Card</h2></div>
  <p class="lead">Judge another team’s kite against its blueprint. Tap a corner to measure it with the protractor, fold the kite, and check the spars. Then mark each check.</p>
  <div class="fest"><div class="entries" id="fEnt"></div><div><div class="stage" id="fStage"></div>
   <div class="row" style="margin-top:10px"><button class="btn alt" id="fFold">Fold test</button><button class="btn alt" id="fSpar">Check the spars</button></div><div class="fb" id="fEv" aria-live="polite"></div></div>
   <div><div class="card2"><h3 style="margin-top:0" id="fTeam"></h3><div class="claims" id="fClaims"></div></div>
    <div class="judge" id="fJudge"></div><div class="tally" id="fTally"></div>
    <div class="row" style="margin-top:8px"><button class="btn" id="fCheck">Check my judging</button></div><div class="fb" id="fFb" aria-live="polite"></div></div></div>`;
  const ROWS=[{k:'name',t:'Shape name and properties are correct'},{k:'angle',t:'One angle checked with protractor'},{k:'fold',t:'Lines of symmetry checked by folding'},{k:'spar',t:'Spars cross at a right angle'}];
  function truthOf(e,g){const c=e.claims;return {name:c.name===g.name&&c.props.length>0&&c.props.every(p=>g.truth[p]),angle:meas==null?null:c.angles[meas]===g.angles[meas],fold:c.lines===g.lines.length,spar:c.sp1===90&&c.sp2===360};}
  function render(){const L=list();if(cur>=L.length)cur=0;const e=L[cur],g=geoOf(e.d);
    $('#fEnt').innerHTML=L.map((x,i)=>`<button data-i="${i}" aria-pressed="${i===cur}">${esc(x.team)}<small>${x.sample?'Sample entry':'From Part 5'}</small></button>`).join('');
    $$('#fEnt button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;meas=null;fold=false;spar=false;judge={};checked=false;$('#fEv').className='fb';$('#fEv').innerHTML='';$('#fFb').className='fb';$('#fFb').innerHTML='';render();});
    drawKite($('#fStage'),g,{fold,sparMark:spar,protractor:meas,aria:`${e.team} kite`,onVertex:i=>{meas=i;judge.angle=undefined;render();fbox($('#fEv'),'info',`Angle ${'ABCD'[i]} measures <b class="num">${g.angles[i]}°</b>. The blueprint says <b class="num">${e.claims.angles[i]==null?'(blank)':e.claims.angles[i]+'°'}</b>.`);},
      onFold:(m)=>fbox($('#fEv'),m?'ok':'try',m?'<b>It folds onto itself.</b> That is one line of symmetry. Keep folding to count them all.':'<b>No match on this fold.</b> Not a line of symmetry.')});
    $('#fTeam').textContent=`${e.team}’s blueprint`;const c=e.claims;const pn=c.props.map(p=>PROPS.find(x=>x.k===p).t);
    $('#fClaims').innerHTML=`<div><span>Shape name</span><b>${esc(c.name||'(blank)')}</b></div><div><span>Properties</span><b style="text-align:right">${pn.length?pn.map(esc).join('; '):'(blank)'}</b></div>
      <div><span>Angles A, B, C, D</span><b class="num">${c.angles.map(a=>a==null?'?':a+'°').join(', ')}</b></div><div><span>Lines of symmetry</span><b class="num">${c.lines==null?'(blank)':c.lines}</b></div><div><span>Spar crossing</span><b class="num">4 × ${c.sp1??'?'}° = ${c.sp2??'?'}°</b></div>`;
    const tr=truthOf(e,g);
    $('#fJudge').innerHTML=ROWS.map(r=>{const extra=r.k==='angle'?(meas==null?' <span class="small muted">(tap a corner on the kite first)</span>':`: angle ${'ABCD'[meas]} = <b class="num">${g.angles[meas]}°</b>`):'';
      const st=checked&&judge[r.k]!==undefined&&tr[r.k]!=null?(judge[r.k]===tr[r.k]?' good':' bad'):'';
      return `<div class="jrow${st}"><div class="t">${r.t}${extra}</div><div class="mm" role="group" aria-label="${r.t}"><button class="y" data-r="${r.k}" data-v="1" aria-pressed="${judge[r.k]===true}" ${r.k==='angle'&&meas==null?'disabled':''}>Matches</button><button class="n" data-r="${r.k}" data-v="0" aria-pressed="${judge[r.k]===false}" ${r.k==='angle'&&meas==null?'disabled':''}>Mismatch</button></div></div>`;}).join('');
    $$('#fJudge .mm button').forEach(b=>b.onclick=()=>{judge[b.dataset.r]=b.dataset.v==='1';checked=false;render();});
    const mm=Object.values(judge).filter(v=>v===false).length;$('#fTally').innerHTML=`Mismatches: <span class="num">${mm}</span> &nbsp;·&nbsp; Score: <span class="num">${mm?'−'+mm:'0'}</span>`;}
  $('#fFold').onclick=()=>{fold=!fold;render();if(fold)fbox($('#fEv'),'info','Tap a dashed line to fold the kite.');};
  $('#fSpar').onclick=()=>{spar=!spar;render();if(spar)fbox($('#fEv'),'info','The spars cross at S with four square corners (90° each).');};
  $('#fCheck').onclick=()=>{const e=list()[cur],g=geoOf(e.d),tr=truthOf(e,g);const done=ROWS.filter(r=>judge[r.k]!==undefined);
    if(done.length<4){fbox($('#fFb'),'info',`Mark all four checks first. ${meas==null?'Start by tapping a corner to measure it.':''}`);return;}
    checked=true;render();const wrong=ROWS.filter(r=>judge[r.k]!==tr[r.k]);
    const why={name:()=>{const bad=e.claims.props.filter(p=>!g.truth[p]).map(p=>PROPS.find(x=>x.k===p).t.toLowerCase());return e.claims.name!==g.name?`This kite is a <b>${g.name.toLowerCase()}</b>, not a ${String(e.claims.name||'blank').toLowerCase()}. ${g.truth.all?'All sides are equal.':'Not all four sides are equal.'} ${g.truth.rt?'It has four right angles.':''}`:bad.length?`The name is right, but “${bad[0]}” is not true for this kite.`:'The name and every listed property are true.';},
      angle:()=>`The protractor reads ${g.angles[meas]}° at ${'ABCD'[meas]}; the blueprint says ${e.claims.angles[meas]??'nothing'}.`,
      fold:()=>`Folding finds ${g.lines.length} line${g.lines.length===1?'':'s'} of symmetry; the blueprint says ${e.claims.lines??'nothing'}.`,
      spar:()=>`The spars cross at 90°, four times: 360°. The blueprint says 4 × ${e.claims.sp1??'?'}° = ${e.claims.sp2??'?'}°.`};
    if(!wrong.length)fbox($('#fFb'),'ok',`<b>Sharp judging.</b> Every mark agrees with the evidence. ${e.team} gets ${Object.values(tr).filter(v=>v===false).length?'−'+Object.values(tr).filter(v=>v===false).length:'a perfect 0'}.`);
    else fbox($('#fFb'),'try',`<b>${wrong.length} mark${wrong.length===1?'':'s'} to rethink</b> (red). ${why[wrong[0].k]()} Change your mark and check again.`);};
  window.__festRefresh=render;render();}
/* ---------- Challenge ---------- */
const HEX2=[[1,4],[2,3],[6,3],[7,4],[6,5],[2,5]],HEX1=[[3,2],[5,2],[6,4],[5,7],[3,7],[2,4]],HEX1b=[[4,1],[6,3],[6,6],[4,7],[2,6],[2,3]];
function mountSails(){const el=$('#ch1');let n=6;const met={h2:false,h1:false,q2:false};
  el.innerHTML=`<div class="part-head"><span class="tag">CHALLENGE 1–2</span><h2>The Sail Lab</h2></div>
  <p class="lead">Place the corners of a sail on the dot board. Every line of symmetry shows up as a teal dashed line as soon as the shape has one.</p>
  <div class="seg" role="group" aria-label="Sail type"><button data-n="6" aria-pressed="true">Six-sided sail</button><button data-n="4" aria-pressed="false">Four-sided sail</button></div>
  <div class="grid2" style="margin-top:12px"><div class="stage" id="slBoard"></div>
  <div><div class="bigstat" id="slStat">0 corners</div><p class="muted" id="slSub" style="margin:6px 0 0"></p>
   <div class="goals" id="slGoals"></div>
   <div class="row"><button class="btn alt" id="slClear">Clear</button><button class="btn alt" id="slEx">Show an example</button></div>
   <div class="fb" id="slFb" aria-live="polite"></div></div></div>`;
  let exI=0;
  const board=makeBoard($('#slBoard'),{n:9,k:6,onChange:w=>{if(w==='full')fbox($('#slFb'),'info','All corners are placed. Drag a corner to move it.');else if(typeof update==='function')update();},
    overlay:(P,M,W,G,pad)=>{if(P.length!==n||polyIssue(P))return '';const L=symLines(P);const o=centroid(P);let s='';const bnd=[-pad/G,-pad/G,(W-pad)/G,(W-pad)/G];
      for(const d of L){const [a,b]=linePts(o,d,bnd);const A=M(a),B=M(b);s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="var(--fold)" stroke-width="4" stroke-dasharray="12 8"/>`;}
      return s+(n===4?marksSVG(P,M,{right:true,equal:true,size:16}):'');}});
  function update(){if(!board)return;const P=board.P;const stat=$('#slStat'),sub=$('#slSub');
    if(P.length<n){stat.textContent=`${P.length} of ${n} corners`;sub.textContent='Tap dots to place corners in order around the sail.';}
    else{const iss=polyIssue(P);if(iss){stat.textContent='Not a sail yet';sub.textContent=iss==='straight'?'Three corners are on one straight line, so one corner is flat. Move it.':'Two sides cross. Move a corner so the sides only meet at corners.';}
      else{const L=symLines(P).length;stat.textContent=`${L} line${L===1?'':'s'} of symmetry`;
        if(n===4){const nm=quadName(P);sub.textContent=`This quadrilateral is a ${nm}.`;if(L===2&&nm!=='rhombus')met.q2=true;}
        else{sub.textContent=L===0?'No fold works yet. Try making the left and right sides mirror each other.':'';if(L===2)met.h2=true;if(L===1)met.h1=true;}}}
    const goals=n===6?[['h2','A six-sided sail with exactly two lines of symmetry'],['h1','A six-sided sail with exactly one line of symmetry']]:[['q2','A quadrilateral with exactly two lines of symmetry that is NOT a rhombus']];
    $('#slGoals').innerHTML=goals.map(([k,t])=>`<div class="goal ${met[k]?'met':''}"><i>${met[k]?'✓':''}</i>${t}</div>`).join('');}
  const setN=v=>{n=v;board.k=v;exI=0;$$('[data-n]',el).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===v));$('#slFb').className='fb';$('#slFb').innerHTML='';board.clear();};
  $$('[data-n]',el).forEach(b=>b.onclick=()=>setN(+b.dataset.n));
  $('#slClear').onclick=()=>{board.clear();$('#slFb').className='fb';$('#slFb').innerHTML='';};
  $('#slEx').onclick=()=>{const ex=n===6?[HEX2,HEX1,HEX1b]:[[[2,2],[7,2],[7,5],[2,5]]];const P=ex[exI%ex.length];exI++;board.set(P);const L=symLines(P).length;
    fbox($('#slFb'),'info',n===6?`Here is one with ${L} line${L===1?'':'s'} of symmetry. Drag a corner to make your own version.`:'A rectangle that is not a square: fold it top-to-bottom or side-to-side. The diagonals do not work as folds.');};
  update();}
function mountThird(){const el=$('#ch2');
  el.innerHTML=`<div class="part-head"><span class="tag">CHALLENGE 3</span><h2>Is there a third kind?</h2></div>
  <p class="lead">A rhombus and a rectangle both have exactly two lines of symmetry. Is there any other quadrilateral that does? Make a prediction, then let the computer test every quadrilateral on a 7 × 7 dot board.</p>
  <div class="row"><button class="btn" id="tkRun">Test every quadrilateral</button></div><div id="tkOut"></div>`;
  $('#tkRun').onclick=()=>{const N=7,G=[];for(let x=0;x<N;x++)for(let y=0;y<N;y++)G.push([x,y]);const by={},two={};let total=0;
    for(let i=0;i<G.length;i++)for(let j=i+1;j<G.length;j++)for(let a=j+1;a<G.length;a++)for(let b=a+1;b<G.length;b++){const q=[G[i],G[j],G[a],G[b]];
      for(const o of [[0,1,2,3],[0,1,3,2],[0,2,1,3]]){const P=o.map(t=>q[t]);if(polyIssue(P))continue;total++;const L=symLines(P).length;by[L]=(by[L]||0)+1;if(L===2){const nm=quadName(P);two[nm]=(two[nm]||0)+1;}}}
    const other=Object.entries(two).filter(([k])=>k!=='rectangle'&&k!=='rhombus').reduce((s,[,v])=>s+v,0);
    $('#tkOut').innerHTML=`<div class="grid2" style="margin-top:14px"><div><div class="bigstat num">${total.toLocaleString()}</div><p class="muted" style="margin:4px 0 8px">quadrilaterals tested</p>
      <table class="res"><tr><th>Lines of symmetry</th><th>How many</th></tr>${[0,1,2,3,4].map(L=>`<tr><td>${L}</td><td class="num">${(by[L]||0).toLocaleString()}</td></tr>`).join('')}</table></div>
      <div><p style="margin:0 0 6px"><b>The ones with exactly two lines:</b></p><table class="res"><tr><td>Rectangles (not squares)</td><td class="num">${(two.rectangle||0).toLocaleString()}</td></tr><tr><td>Rhombuses (not squares)</td><td class="num">${(two.rhombus||0).toLocaleString()}</td></tr><tr><td><b>Anything else</b></td><td class="num"><b>${other}</b></td></tr></table>
      <div class="fb info"><b>${other===0?'No third kind.':'Something else turned up!'}</b> ${other===0?'Here is why. A line of symmetry on a quadrilateral either joins two opposite corners or joins the middles of two opposite sides. Two corner-to-corner folds make all four sides equal: a rhombus. Two middle-to-middle folds make four right angles: a rectangle. One of each can’t happen: the second fold would have to run through corners too. (A square has both kinds, so it has four lines.)':''}</div></div></div>`;};}
/* ---------- App shell ---------- */
let curView='c1';
function show(v){curView=v;$$('nav.classes button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));['c1','c2','c3','ch'].forEach(x=>$('#v-'+x).hidden=x!==v);
  $('#presentBtn').hidden=v!=='c3';if(v!=='c3'){document.body.classList.remove('present');$('#presentBtn').textContent='Showcase mode';}}
function mountAll(){FEST.length=0;mountToolkit();mountCatalog();mountTriangles();mountWarmup();mountPractice();mountBlueprint();mountFestival();mountSails();mountThird();}
$$('nav.classes button').forEach(b=>b.onclick=()=>{show(b.dataset.view);window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});});
$('#resetBtn').onclick=()=>{document.body.classList.remove('present');mountAll();show('c1');window.scrollTo(0,0);};
$('#fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}};
document.addEventListener('fullscreenchange',()=>$('#fsBtn').textContent=document.fullscreenElement?'Exit full screen':'Full screen');
$('#presentBtn').onclick=()=>{const on=document.body.classList.toggle('present');$('#presentBtn').textContent=on?'Exit showcase':'Showcase mode';};
mountAll();show('c1');
})();
</script>
