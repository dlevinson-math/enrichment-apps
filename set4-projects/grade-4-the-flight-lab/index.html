<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Flight Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a flight-test logbook. Header strip, three class tabs + Showcase, then one working card per worksheet part. */
:root{
  --bg:#E9EFF4; --panel:#FFFFFF; --panel2:#F4F7FA; --ink:#14213D; --muted:#55627A; --line:#C9D4E0;
  --accent:#E8890C; --accent-ink:#A65F00; --accent-soft:#FDF0DC;
  --sky:#2563A8; --sky-soft:#E1ECF8;
  --good:#1D8355; --good-soft:#E2F4EA; --try:#B3261E; --try-soft:#FBE9E7;
  --display:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1622; --panel:#162133; --panel2:#1B283D; --ink:#E7EDF5; --muted:#9BA9BE; --line:#2C3B53;
  --accent:#F5A524; --accent-ink:#F7B954; --accent-soft:#3A2A12;
  --sky:#74A9E6; --sky-soft:#1C2E47;
  --good:#52C68D; --good-soft:#15342A; --try:#FF8A80; --try-soft:#3D1F1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1622; --panel:#162133; --panel2:#1B283D; --ink:#E7EDF5; --muted:#9BA9BE; --line:#2C3B53;
  --accent:#F5A524; --accent-ink:#F7B954; --accent-soft:#3A2A12;
  --sky:#74A9E6; --sky-soft:#1C2E47;
  --good:#52C68D; --good-soft:#15342A; --try:#FF8A80; --try-soft:#3D1F1F; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{min-height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:clamp(17px,1.25vw,20px); line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:12px 40px}
.wrap{max-width:1240px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; line-height:1.1}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* header */
.top{display:flex; flex-wrap:wrap; gap:12px 24px; align-items:flex-end; padding-top:6px}
.brand{min-width:0; flex:1 1 420px}
.eyebrow{margin:0; font-family:var(--display); font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:.78em; color:var(--accent-ink)}
.brand h1{font-size:clamp(34px,4.4vw,58px); font-weight:700; letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.tagline{margin:4px 0 0; color:var(--muted)}
.tools{display:flex; gap:10px; flex-wrap:wrap}
.ghost{border:2px solid var(--line); background:var(--panel); border-radius:12px; padding:10px 18px; font-weight:700; min-height:48px}
.ghost:hover{border-color:var(--ink)}

/* class tabs */
.classes{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.classes button{border:2px solid var(--line); background:var(--panel); border-radius:14px; padding:10px 14px; text-align:left; min-height:64px; display:flex; flex-direction:column; justify-content:center}
.classes button b{font-family:var(--display); font-size:1.15em}
.classes button small{color:var(--muted); font-size:.82em}
.classes button[aria-selected="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.classes button[aria-selected="true"] small{color:inherit; opacity:.8}
@media (max-width:760px){.classes{grid-template-columns:repeat(2,1fr)}}

.parts{display:flex; gap:8px; flex-wrap:wrap}
.parts button{border:2px solid var(--line); background:transparent; border-radius:999px; padding:8px 16px; font-weight:700; min-height:46px; color:var(--muted)}
.parts button[aria-selected="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--ink)}

.card{background:var(--panel); border:1.5px solid var(--line); border-radius:18px; padding:clamp(16px,2.2vw,28px); display:flex; flex-direction:column; gap:18px; min-width:0}
.card h2{font-size:clamp(24px,2.4vw,34px)}
.card .lead{margin:0; color:var(--muted); max-width:46em}
.partlabel{font-family:var(--display); font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:.78em; color:var(--accent-ink); margin:0 0 4px}
.task{display:flex; flex-direction:column; gap:12px; padding:16px 0 0; border-top:1.5px dashed var(--line); min-width:0}
.task:first-of-type{border-top:0; padding-top:0}
.q{display:flex; gap:12px; align-items:flex-start; margin:0; font-size:1.08em}
.q .num{flex:none; width:36px; height:36px; border-radius:50%; background:var(--ink); color:var(--panel); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:.9em}
.q .num.star{background:var(--accent); color:#1b1204}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.eq{display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:1.25em; font-family:var(--mono)}
input.box{font-family:var(--mono); font-size:1em; width:3.6em; min-height:50px; padding:6px 8px; text-align:center; border:2px solid var(--line); border-radius:10px; background:var(--panel2); color:var(--ink)}
input.box.wide{width:6em} input.box.xwide{width:9em; font-family:var(--body); text-align:left}
input.box.ok{border-color:var(--good); background:var(--good-soft)} input.box.no{border-color:var(--try); background:var(--try-soft)}
.mix{display:inline-flex; align-items:center; gap:6px}
.fin{display:inline-flex; flex-direction:column; align-items:center; gap:2px}
.fin input.box{width:3.4em; min-height:42px}
.fin .den{border-top:3px solid var(--ink); padding-top:2px; min-width:3em; text-align:center; font-family:var(--mono)}
.fr{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; line-height:1.02; font-size:.78em; margin:0 .08em}
.fr span:first-child{border-bottom:2px solid currentColor; padding:0 .1em}
.primary{border:0; background:var(--accent); color:#1b1204; font-weight:700; padding:12px 22px; border-radius:12px; min-height:50px; font-size:1em}
.primary:disabled{opacity:.45; cursor:default}
.secondary{border:2px solid var(--ink); background:var(--panel); font-weight:700; padding:10px 18px; border-radius:12px; min-height:50px}
.secondary:disabled{opacity:.4; cursor:default}
.choice{border:2px solid var(--line); background:var(--panel2); border-radius:12px; padding:10px 20px; min-height:52px; font-weight:700; font-family:var(--mono); font-size:1.1em}
.choice[aria-pressed="true"]{border-color:var(--sky); background:var(--sky-soft)}
.seg{display:inline-flex; border:2px solid var(--line); border-radius:12px; padding:3px; background:var(--panel2); flex-wrap:wrap}
.seg button{border:0; background:none; padding:8px 14px; border-radius:9px; font-weight:700; color:var(--muted); min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--panel)}
.fb{margin:0; padding:12px 16px; border-radius:12px; max-width:48em; background:var(--panel2)}
.fb:empty{display:none}
.fb.ok{background:var(--good-soft); border-left:5px solid var(--good)}
.fb.no{background:var(--try-soft); border-left:5px solid var(--try)}
.fb.info{background:var(--sky-soft); border-left:5px solid var(--sky)}
.note{font-size:.85em; color:var(--muted); margin:0}
.simtag{display:inline-block; font-size:.72em; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:6px; background:var(--sky-soft); color:var(--sky)}
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.talk{background:var(--accent-soft); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:10px}
.talk h3{font-size:1.1em}
.svgbox{width:100%; overflow-x:auto}
svg{display:block; max-width:100%; height:auto}
@media (max-width:700px){.svgbox svg#nl,.svgbox svg#ruler,.svgbox svg#lp,.svgbox svg#gymLog,.svgbox svg#gymTr,.svgbox svg#bar,.svgbox svg#bar3{min-width:660px; max-width:none}}
svg text{font-family:var(--mono); fill:var(--ink)}

/* stopwatch */
.watch{display:flex; flex-wrap:wrap; gap:20px; align-items:center}
.face{font-family:var(--mono); font-weight:700; font-size:clamp(56px,9vw,112px); line-height:1; padding:14px 26px; border-radius:22px; background:var(--ink); color:var(--panel); font-variant-numeric:tabular-nums; min-width:4.2ch; text-align:center}
.face small{font-size:.32em; opacity:.7; margin-left:.2em}
.target{font-family:var(--display); font-size:1.3em}
.target b{font-family:var(--mono); color:var(--accent-ink); font-size:1.3em}

/* hundredths grids */
.grids{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.gwrap{display:flex; flex-direction:column; align-items:center; gap:4px; font-family:var(--mono); font-size:.85em; color:var(--muted)}
.grid{display:grid; grid-template-columns:repeat(10,1fr); gap:1px; width:clamp(90px,12vw,140px); aspect-ratio:1; max-width:100%; background:var(--line); border:2px solid var(--ink)}
.grid i{background:var(--panel)}
.grid i.f{background:var(--sky)}
.grid i.t{background:var(--accent)}
.pv{border-collapse:collapse; font-family:var(--mono); font-size:1.2em}
.pv th{font-family:var(--body); font-size:.65em; color:var(--muted); padding:4px 12px; font-weight:700}
.pv td{border:2px solid var(--line); padding:6px 16px; text-align:center}
.pv td.hot{background:var(--accent-soft); border-color:var(--accent)}

/* tables */
.tbl{overflow-x:auto; max-width:100%}
table.log{border-collapse:collapse; min-width:100%}
table.log th{font-size:.8em; text-align:left; color:var(--muted); padding:6px 8px; border-bottom:2px solid var(--line); white-space:nowrap}
table.log td{padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:middle}
table.log td.nm{font-family:var(--display); font-weight:700}
table.log .val{font-family:var(--mono); font-size:1.1em}
.ftin{display:inline-flex; align-items:center; gap:4px; font-family:var(--mono)}
.ftin input.box{width:3.2em}
.mark{font-weight:700; font-size:1.2em}
.mark.ok{color:var(--good)} .mark.no{color:var(--try)}

.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{border:2px solid var(--line); background:var(--panel2); border-radius:12px; padding:8px 14px; font-family:var(--mono); font-weight:700; min-height:48px; font-size:1.05em}
.chip.cur{border-color:var(--accent); background:var(--accent-soft)}
.chip.done{opacity:.45; text-decoration:line-through}
.chip[aria-pressed="true"]{border-color:var(--sky); background:var(--sky-soft)}

.clickable{cursor:pointer}
.gtick:hover rect{fill:var(--accent-soft)}

/* showcase */
.show{gap:22px}
.podium{display:grid; gap:10px}
.prow{display:grid; grid-template-columns:3.2em minmax(0,1fr) auto; gap:14px; align-items:center; padding:12px 16px; border-radius:14px; background:var(--panel2); border:2px solid var(--line)}
.prow .rk{font-family:var(--display); font-weight:700; font-size:1.8em; color:var(--muted)}
.prow .pn{font-family:var(--display); font-weight:700; font-size:clamp(22px,2.6vw,36px); min-width:0; overflow-wrap:anywhere}
.prow .pv2{font-family:var(--mono); font-size:clamp(20px,2.2vw,30px); text-align:right}
.prow .pv2 small{display:block; font-size:.6em; color:var(--muted)}
.prow.first{border-color:var(--accent); background:var(--accent-soft)}
.prow.first .rk{color:var(--accent-ink)}
.prow.hid{opacity:.25}
.prow.hid .pn,.prow.hid .pv2{filter:blur(8px)}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px}
.fact{padding:14px 16px; border-radius:14px; border:2px solid var(--line)}
.fact b{display:block; font-family:var(--mono); font-size:1.6em}
.fact span{color:var(--muted); font-size:.9em}

@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.6); opacity:0}to{transform:scale(1); opacity:1}}
</style>

<div class="wrap" id="app">
<header class="top">
  <div class="brand">
    <p class="eyebrow">Grade 4 · Set 4 project · 3 class periods</p>
    <h1>The Flight <span>Lab</span></h1>
    <p class="tagline">Time it in hundredths. Measure it in inches. Let the data pick the champion.</p>
  </div>
  <div class="tools">
    <button class="ghost" id="fsBtn" data-act="fs">Full screen</button>
    <button class="ghost" data-act="reset">Start over</button>
  </div>
</header>

<nav class="classes" role="tablist" aria-label="Class periods">
  <button role="tab" data-cls="1" aria-selected="true"><b>Class 1</b><small>Hundredths &amp; test flights</small></button>
  <button role="tab" data-cls="2" aria-selected="false"><b>Class 2</b><small>Conversions, trials, line plot</small></button>
  <button role="tab" data-cls="3" aria-selected="false"><b>Class 3</b><small>Championship report</small></button>
  <button role="tab" data-cls="show" aria-selected="false"><b>Showcase</b><small>Crown the champion</small></button>
</nav>

<div id="main"></div>
</div>

<template id="tpl">
<!-- ================= CLASS 1 ================= -->
<section class="cview" data-view="1">
  <div class="parts" role="tablist">
    <button data-part="1a" aria-selected="true">Warm-up: Stop the watch</button>
    <button data-part="1b" aria-selected="false">Part 1 · Hundredths</button>
    <button data-part="1c" aria-selected="false">Part 2 · Test flight log</button>
  </div>

  <div class="card" data-pv="1a">
    <div><p class="partlabel">Warm-up</p><h2>Stop the watch on the target</h2></div>
    <p class="lead">A flight timer counts in hundredths of a second. Press Start, then try to stop it exactly on the target time. How close can you get?</p>
    <div class="watch">
      <div class="face" id="swFace">0.00<small>s</small></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="target">Target: <b id="swTarget">2.37</b> s</div>
        <div class="row">
          <button class="primary" data-act="swGo" id="swBtn">Start</button>
          <button class="secondary" data-act="swNext">New target</button>
        </div>
      </div>
    </div>
    <p class="fb" id="swFb"></p>
    <div class="grids" id="swGrids"></div>
  </div>

  <div class="card" data-pv="1b" hidden>
    <div><p class="partlabel">Part 1 · Class 1</p><h2>Hundredths on the stopwatch</h2></div>
    <p class="lead">A hundredth is <span class="fr"><span>1</span><span>100</span></span>. One whole second is 100 hundredths.</p>

    <div class="task">
      <p class="q"><span class="num">1</span>Write 2.37 seconds as a mixed number.</p>
      <div class="eq">2.37 = <span class="mix"><input class="box" id="t1w" inputmode="numeric" aria-label="whole seconds"><span class="fin"><input class="box" id="t1n" inputmode="numeric" aria-label="hundredths"><span class="den">100</span></span></span>
        <button class="primary" data-act="t1">Check</button></div>
      <p class="fb" id="t1fb"></p>
    </div>

    <div class="task">
      <p class="q"><span class="num">2</span>Write 2.4 seconds in hundredths, then as a mixed number.</p>
      <div class="eq">2.4 = 2.<input class="box" id="t2a" inputmode="numeric" aria-label="tenths digit" style="width:2.4em">0 = <span class="mix">2<span class="fin"><input class="box" id="t2n" inputmode="numeric" aria-label="hundredths"><span class="den">100</span></span></span>
        <button class="primary" data-act="t2">Check</button></div>
      <p class="fb" id="t2fb"></p>
    </div>

    <div class="task">
      <p class="q"><span class="num">3</span>Mark 2.37 and 2.4 on the number line. Which flight lasted longer?</p>
      <div class="row">
        <span>Pick a time, then tap the line:</span>
        <button class="chip" data-act="nlPick" data-v="237" aria-pressed="true">2.37</button>
        <button class="chip" data-act="nlPick" data-v="240" aria-pressed="false">2.4</button>
      </div>
      <div class="svgbox"><svg id="nl" viewBox="0 0 1000 170" class="clickable" role="img" aria-label="Number line from 2.0 to 2.5"></svg></div>
      <div class="row"><button class="primary" data-act="nlCheck">Check my marks</button><button class="secondary" data-act="nlZoom">Zoom 2.3 to 2.4</button></div>
      <p class="fb" id="nlfb"></p>
      <div class="row"><span>Which flight lasted longer?</span>
        <button class="choice" data-act="longer" data-v="237">2.37 s</button>
        <button class="choice" data-act="longer" data-v="240">2.4 s</button></div>
      <p class="fb" id="lgfb"></p>
    </div>

    <div class="task">
      <p class="q"><span class="num">4</span>Compare 1.9 and 1.85. Then rewrite 1.9 in hundredths.</p>
      <div class="eq">1.9 <span class="row" style="gap:6px">
        <button class="choice" data-act="cmp" data-v="&gt;">&gt;</button>
        <button class="choice" data-act="cmp" data-v="&lt;">&lt;</button>
        <button class="choice" data-act="cmp" data-v="=">=</button></span> 1.85</div>
      <p class="fb" id="cmpfb"></p>
      <div class="eq">1.9 = <input class="box wide" id="t4h" aria-label="1.9 in hundredths" placeholder="_.__"> <button class="primary" data-act="t4">Check</button></div>
      <p class="fb" id="t4fb"></p>
      <div class="talk">
        <h3>Talk it over: Why is 1.9 more, even though 85 is more than 9?</h3>
        <div class="row"><button class="secondary" data-act="why19">Show the evidence</button></div>
        <div id="why19"></div>
      </div>
    </div>
  </div>

  <div class="card" data-pv="1c" hidden>
    <div><p class="partlabel">Part 2 · Class 1</p><h2>Test flight log</h2></div>
    <p class="lead">Same dart for everyone. Time to the hundredth. Distance to where the nose stops. Fly three flights, then write each time as a mixed number and each distance in inches.</p>
    <div class="row">
      <div class="seg" role="group" aria-label="Where the data comes from">
        <button data-act="logMode" data-v="sim" aria-pressed="true">Simulated flights</button>
        <button data-act="logMode" data-v="real" aria-pressed="false">Type our real flights</button>
      </div>
      <button class="primary" data-act="fly" data-t="log" id="flyLog">Launch flight 1</button>
    </div>
    <div class="svgbox"><svg id="gymLog" viewBox="0 0 1000 250" role="img" aria-label="Gym floor with a paper plane flight"></svg></div>
    <div class="tbl"><table class="log" id="logT"></table></div>
    <div class="row"><button class="primary" data-act="logCheck">Check my log</button></div>
    <p class="fb" id="logfb"></p>

    <div class="task">
      <p class="q"><span class="num">★</span>My wingspan, to the nearest <span class="fr"><span>1</span><span>8</span></span> inch.</p>
      <p class="note">Each small tick is <span class="fr"><span>1</span><span>8</span></span> inch. The wing starts at 0. Read where it ends, to the closest tick.</p>
      <div class="svgbox"><svg id="ruler" viewBox="0 0 1000 190" role="img" aria-label="Ruler measuring a wing"></svg></div>
      <div class="eq">Wingspan = <span class="mix"><input class="box" id="wsw" inputmode="numeric" aria-label="whole inches"><span class="fin"><input class="box" id="wsn" inputmode="numeric" aria-label="eighths"><span class="den">8</span></span></span> in
        <button class="primary" data-act="wsCheck">Check</button><button class="secondary" data-act="wsNew">Measure another plane</button></div>
      <p class="fb" id="wsfb"></p>
    </div>
  </div>
</section>

<!-- ================= CLASS 2 ================= -->
<section class="cview" data-view="2" hidden>
  <div class="parts" role="tablist">
    <button data-part="2a" aria-selected="true">Part 3 · Conversions</button>
    <button data-part="2b" aria-selected="false">Part 4 · Engineering trials</button>
    <button data-part="2c" aria-selected="false">Part 5 · Wingspan line plot</button>
  </div>

  <div class="card" data-pv="2a">
    <div><p class="partlabel">Part 3 · Class 2</p><h2>Conversions: smaller unit, bigger number</h2></div>
    <p class="lead">An inch is smaller than a foot, so the same flight takes more inches than feet to describe. Fill the conversion table first.</p>
    <div class="eq" style="font-size:1.1em">1 ft = <input class="box" id="cv1" inputmode="numeric" aria-label="inches in a foot"> in
      &nbsp; 1 yd = <input class="box" id="cv2" inputmode="numeric" aria-label="feet in a yard"> ft
      &nbsp; 1 min = <input class="box" id="cv3" inputmode="numeric" aria-label="seconds in a minute"> s
      <button class="primary" data-act="cvFacts">Check</button></div>

function parseHund(s){ s=String(s).trim(); const m=s.match(/^(\d*)(?:\.(\d{1,2}))?$/); if(!m||(!m[1]&&!m[2])) return null; const w=m[1]?parseInt(m[1],10):0; let f=0; if(m[2]) f=m[2].length===1?parseInt(m[2],10)*10:parseInt(m[2],10); return w*100+f; }

function mix8(e){ const w=Math.floor(e/8), r=e%8; if(!r) return `${w}`; const g=gcd(r,8); return `${w} ${fr(r/g,8/g)}`; }

function fb(id,cls,html){ const el=document.getElementById(id); el.className='fb '+(cls||''); el.innerHTML=html||''; }

function svgEl(tag,attrs,text){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(text!=null) e.textContent=text; return e; }

/* ---------- shared checkers ---------- */
function checkMixed(h,w,n){
  const W=Math.floor(h/100), N=h%100;
  if(isNaN(w)||isNaN(n)) return {ok:false,msg:'Fill in both boxes: the whole seconds and the hundredths.'};
  if(w!==W) return {ok:false,msg:`The whole seconds are the digits <b>before</b> the decimal point. In ${dec(h)} that is ${W}. Try again.`};
  if(n===N) return {ok:true,msg:`Yes. ${dec(h)} = ${W} and ${N} hundredths = ${mixH(h)}.`};
  if(N<10 && n===N*10) return {ok:false,msg:`${W} ${fr(n,100)} would be ${W}.${String(n).padStart(2,'0')}. Look at the zero: ${dec(h)} has 0 tenths and ${N} hundredths. How many hundredths is that?`};
  if(N%10===0 && n===N/10) return {ok:false,msg:`${W} ${fr(n,100)} would be ${W}.0${n}, a tiny bit more than ${W}. The ${n} in ${dec(h)} is in the <b>tenths</b> place. How many hundredths make ${n} tenths?`};
  if(N>=10 && n===(N%10)*10+Math.floor(N/10)) return {ok:false,msg:`Check the order of the digits. Read the two digits right after the point, in order.`};
  return {ok:false,msg:`The two digits after the point tell how many hundredths. ${dec(h)} has ${Math.floor(N/10)} tenths and ${N%10} hundredths. How many hundredths is that in all?`};
}
function checkInches(f,i,ans){
  const c=f*12+i;
  if(isNaN(ans)) return {ok:false,msg:`Type the total inches for ${f} ft ${i} in.`};
  if(ans===c) return {ok:true,msg:`${f} ft ${i} in = ${f} × 12 + ${i} = ${c} in.`};
  if(ans===f*10+i) return {ok:false,msg:`That treats a foot as 10 inches. A foot is <b>12</b> inches. Try ${f} × 12 first, then add ${i}.`};
  if(ans===f*100+i||ans===parseInt(`${f}${i}`,10)) return {ok:false,msg:`Feet and inches are not place-value digits. Multiply the feet by 12, then add the leftover ${i} in.`};
  if(ans===f*12) return {ok:false,msg:`${f} × 12 = ${f*12} is the feet part. Don't forget the leftover ${i} in.`};
  return {ok:false,msg:`Not quite. Multiply ${f} ft by 12 inches, then add the ${i} leftover inches. Check your multiplication.`};
}

function hundredthsGrids(h,opts={}){
  const W=Math.floor(h/100), N=h%100; let out='';
  for(let g=0; g<W; g++) out+=`<div class="gwrap"><div class="grid">${'<i class="f"></i>'.repeat(100)}</div>1 whole</div>`;
  let cells=''; for(let k=0;k<100;k++){ const col=k%10; const row=Math.floor(k/10); const idx=col*10+row; cells+= idx<N ? (opts.tenths && idx<Math.floor(N/10)*10 ? '<i class="f"></i>' : '<i class="t"></i>') : '<i></i>'; }
  out+=`<div class="gwrap"><div class="grid">${cells}</div>${N} hundredths</div>`;

    <div class="fact"><b>${R[0].in - R[n-1].in} in</b><span>from first to last place (${ftin(R[0].in-R[n-1].in)})</span></div>
    <div class="fact"><b>${dec(tmax)} s</b><span>longest hang time: ${hung.join(' and ')}${hung.includes(R[0].name)?'':' (not the distance winner!)'}</span></div>` : '';
  drawBars('bar3',R.map((r,k)=>({name:r.name,v:r.in,show:k>=n-shown})),50,false,done?[0]:[]);
}
function ordinal(k){ return k+(['th','st','nd','rd'][k%10>3||Math.floor(k%100/10)===1?0:k%10]); }

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const c=ev.target.closest('[data-cls]'); if(c){ showClass(c.dataset.cls); return; }
  const p=ev.target.closest('[data-part]'); if(p){ showPart(p.dataset.part); return; }
  if(ev.target.closest('#nl')){ nlTap(ev); return; }
  if(ev.target.closest('#lp')){ const x=svgX($('#lp'),ev).x; lpTap(Math.max(28,Math.min(35,Math.round((x-110)/112)+28))); return; }
  const b=ev.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, v=b.dataset.v;
  switch(a){
    case 'fs': try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} break;
    case 'reset': init(); break;
    case 'swGo': swGo(); break;
    case 'swNext': if(S.sw.run) swStop(); S.sw.ti=(S.sw.ti+1)%TARGETS.length; $('#swTarget').textContent=dec(TARGETS[S.sw.ti]).replace(/^(\d\.\d)0$/,'$1'); $('#swFace').innerHTML='0.00<small>s</small>'; fb('swFb','',''); $('#swGrids').innerHTML=''; break;
    case 't1': t1(); break; case 't2': t2(); break; case 't4': t4(); break; case 'why19': why19(); break;
    case 'nlPick': S.nl.pick=+v; $$('[data-act="nlPick"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); break;
    case 'nlCheck': nlCheck(); break;
    case 'nlZoom': S.nl.zoom=!S.nl.zoom; b.textContent=S.nl.zoom?'Show 2.0 to 2.5':'Zoom 2.3 to 2.4'; drawNL(); break;
    case 'longer': longer(v); break; case 'cmp': cmp(v); break;
    case 'logMode': S.logMode=v; $$('[data-act="logMode"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); S.log=[{},{},{}]; renderLog(false); drawGym('gymLog'); fb('logfb','',''); break;
    case 'trMode': S.trMode=v; $$('[data-act="trMode"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); S.tr=[{},{},{}]; renderTr(false); drawGym('gymTr'); fb('trfb','',''); break;
    case 'fly': {
      if(S.flying) return; const isLog=b.dataset.t==='log', arr=isLog?S.log:S.tr, k=arr.findIndex(r=>r.h==null); if(k<0) return;
      let f;
      if(isLog) f=simFlight();
      else { const m=CHG[S.chg]; const bt=200+(S.trBase||0); f={h:Math.max(120,bt+m.dt+rnd(-20,20)), inch:Math.max(100,200+m.dd+rnd(-25,25))};
        let guard=0; while(arr.some(r=>r.h===f.h||r.inch===f.inch)&&guard++<20){ f.h+=rnd(1,9); f.inch+=rnd(1,9); } }
      const id=isLog?'gymLog':'gymTr'; drawGym(id); b.disabled=true;
      fly(id,f.h,f.inch,()=>{ arr[k]=f; isLog?renderLog():renderTr(); });
      break; }
    case 'logCheck': logCheck(); break;
    case 'wsCheck': wsCheck(); break; case 'wsNew': newWing(); break;
    case 'cvFacts': cvFacts(); break; case 'convCheck': convCheck(); break; case 'cvShow': drawConvBar(+b.dataset.k); break;
    case 'chg': S.chg=v; $$('[data-act="chg"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); S.tr=[{},{},{}]; renderTr(false); drawGym('gymTr'); fb('trfb','',''); break;
    case 'trCheck': trCheck(); break; case 'bwCheck': bwCheck(); break; case 'ordCheck': ordCheck(); break;
    case 'lpAll': lpAll(); break; case 'mcCheck': mcCheck(); break; case 'wnCheck': wnCheck(); break; case 'fqCheck': fqCheck(); break;
    case 'src': setSrc(v); break;
    case 'ceAdd': ceRead(); if(S.ce.length<8){ S.ce.push({name:'',t:'',f:'',i:''}); renderCE(); } break;
    case 'ceUse': ceUse(); renderQs(); renderTen(); break;
    case 'repCheck': repCheck(); break;
    case 'scale': S.scale=+v; $$('[data-act="scale"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderReport(); break;
    case 'q1': q1(); break; case 'q2': q2(); break; case 'q2show': q2show(); break; case 'q3': q3(); break; case 'q4': q4(); break;
    case 'q3yn': S.q3.yn=v; $$('[data-act="q3yn"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); break;
    case 'q3p': S.q3.plane=decodeURIComponent(v); $$('[data-act="q3p"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); break;
    case 'c1': c1(); break; case 'c2': c2(); break; case 'c3': c3(); break;
    case 'tenMode': S.tenMode=v; $$('[data-act="tenMode"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderTen(); fb('c3fb','',''); break;
    case 'tenFly': tenFly(); break;
    case 'reveal': S.rev=Math.min(S.rev+1,ranked().length); renderShow(); break;
    case 'revAll': S.rev=ranked().length; renderShow(); break;
    case 'revReset': S.rev=0; renderShow(); break;
  }
});
document.addEventListener('input',ev=>{ if(ev.target.matches('#axX,#axY')) drawBars('bar',rows().map((r,k)=>({name:r.name,v:inch(r),show:S.repOK[k]})),S.scale,true); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&ev.target.matches('input.box')){ const t=ev.target.closest('.task,.card'); const btn=t&&t.querySelector('.eq .primary, .row .primary'); if(btn) btn.click(); } });
document.addEventListener('fullscreenchange',()=>{ $('#fsBtn').textContent=document.fullscreenElement?'Exit full screen':'Full screen'; });
init();
})();
</script>
