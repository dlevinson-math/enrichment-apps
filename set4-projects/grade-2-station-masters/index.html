<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Station Masters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a station concourse. Enamel sign header, one platform tab per class, one working panel per Part; a split-flap departure board for the showcase. */
:root{
  --bg:#E9EDF2; --surface:#FFFFFF; --sunk:#F3F5F8; --ink:#14213D; --muted:#55627A; --line:#CCD4DF;
  --signal:#E9A21A; --signal-soft:#FCF0D6; --on-signal:#1B1404; --minute:#2563C9;
  --ok:#17804F; --ok-soft:#E1F3EA; --try:#B0501A; --try-soft:#FBEADF;
  --board:#0E1729; --board-ink:#FFC53D; --board-dim:#8090AE; --board-line:#22304D;
  --l-red:#D3263A; --l-blue:#1F68CF; --l-green:#18925A; --l-orange:#DB6A0C; --l-purple:#7A4CC7;
  --display:"Overpass","Segoe UI",system-ui,sans-serif;
  --mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
  --lc:var(--l-blue);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1220; --surface:#151E33; --sunk:#10182A; --ink:#E8EDF6; --muted:#9AA7BE; --line:#2A3757;
    --signal:#F2B33A; --signal-soft:#3A2D12; --minute:#6EA2F5;
    --ok:#4CC88D; --ok-soft:#13301F; --try:#F29A62; --try-soft:#3A2214;
    --board:#060B16; --board-line:#1A2640; --board-dim:#6C7A96;
    --l-red:#F0566A; --l-blue:#5B9BF2; --l-green:#3FC584; --l-orange:#F7943F; --l-purple:#A57CF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#151E33; --sunk:#10182A; --ink:#E8EDF6; --muted:#9AA7BE; --line:#2A3757;
  --signal:#F2B33A; --signal-soft:#3A2D12; --minute:#6EA2F5;
  --ok:#4CC88D; --ok-soft:#13301F; --try:#F29A62; --try-soft:#3A2214;
  --board:#060B16; --board-line:#1A2640; --board-dim:#6C7A96;
  --l-red:#F0566A; --l-blue:#5B9BF2; --l-green:#3FC584; --l-orange:#F7943F; --l-purple:#A57CF0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--display); font-size:18px; line-height:1.45; -webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 40px}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--signal); outline-offset:2px}
.wrap{max-width:1240px; margin:0 auto; display:flex; flex-direction:column; gap:18px}

/* Header: enamel station sign */
header{display:flex; flex-wrap:wrap; align-items:center; gap:14px 24px; padding-block:18px 4px}
.sign{display:flex; align-items:center; gap:16px; min-width:0}
.roundel{flex:none; width:58px; height:58px; border-radius:50%; border:7px solid var(--lc); display:grid; place-items:center; background:var(--surface)}
.roundel i{display:block; width:46px; height:12px; background:var(--ink); border-radius:2px}
.sign h1{margin:0; font-size:clamp(30px,4vw,48px); font-weight:900; letter-spacing:-.01em; line-height:1; text-wrap:balance}
.sign .sub{margin:4px 0 0; font-size:15px; color:var(--muted); font-weight:600; letter-spacing:.06em; text-transform:uppercase}
.sign .tag{margin:2px 0 0; font-size:17px; color:var(--muted)}
.tools{margin-left:auto; display:flex; gap:10px; flex-wrap:wrap}
.btn{min-height:52px; padding:10px 20px; border-radius:12px; font-weight:800; font-size:18px; border:2px solid transparent; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn.primary{background:var(--ink); color:var(--surface)}
.btn.go{background:var(--signal); color:var(--on-signal)}
.btn.ghost{background:var(--surface); border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.warn{background:var(--try-soft); border-color:var(--try); color:var(--ink)}
.btn:disabled{opacity:.45; cursor:default}
.btn.small{min-height:44px; padding:6px 14px; font-size:16px}

/* Class tabs: platform signs */
.classes{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.classes button{display:flex; align-items:center; gap:12px; text-align:left; padding:12px 14px; min-height:68px; border-radius:14px; border:2px solid var(--line); background:var(--surface)}
.classes .num{flex:none; width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:22px; background:var(--sunk); border:2px solid var(--line)}
.classes b{display:block; font-size:18px; line-height:1.1}
.classes small{display:block; font-size:14px; color:var(--muted); line-height:1.2}
.classes button[aria-selected="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.classes button[aria-selected="true"] small{color:inherit; opacity:.8}
.classes button[aria-selected="true"] .num{background:var(--signal); color:var(--on-signal); border-color:var(--signal)}
.parts{display:flex; gap:8px; flex-wrap:wrap}
.parts button{min-height:48px; padding:8px 18px; border-radius:999px; border:2px solid var(--line); background:var(--surface); font-weight:700; font-size:17px}
.parts button span{color:var(--muted); font-weight:600; margin-right:6px}
.parts button[aria-pressed="true"]{border-color:var(--signal); background:var(--signal-soft)}
.parts button[aria-pressed="true"] span{color:inherit}
.part{display:flex; flex-direction:column; gap:18px}
.lead{margin:0; font-size:clamp(19px,1.8vw,24px); max-width:44em}
.lead b{font-weight:800}
h3{margin:0; font-size:22px; font-weight:800}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:18px}
.card{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:14px; min-width:0}
.cardhead{display:flex; align-items:center; gap:12px}
.cardhead svg{flex:none}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.center{justify-content:center}

/* Clock */
.clockwrap{display:flex; justify-content:center}
.clock{width:min(100%, clamp(220px, 28vw, 320px)); height:auto; display:block; overflow:visible}
.clock.mini{width:84px}
.clock.big{width:min(100%, 340px)}
.clock .face{fill:var(--surface); stroke:var(--ink); stroke-width:7}
.clock .tk{stroke:var(--muted); stroke-width:1.5}
.clock .tk5{stroke:var(--ink); stroke-width:3.5}
.clock .nm{fill:var(--ink); font:800 21px var(--display); text-anchor:middle; dominant-baseline:central}
.clock .hh{stroke:var(--ink); stroke-width:10; stroke-linecap:round}
.clock .mh{stroke:var(--minute); stroke-width:6; stroke-linecap:round}
.clock .pin{fill:var(--signal)}
.clock .five{fill:var(--minute); font:800 15px var(--mono); text-anchor:middle; dominant-baseline:central}
.clock .fivedot{fill:var(--minute); opacity:.18}
.clock.drag{touch-action:none; cursor:grab}
.clock.drag .sel{filter:drop-shadow(0 0 4px var(--signal))}
.clock .ghostmark{fill:none; stroke:var(--signal); stroke-width:4}
.clock.mini .face{stroke-width:9}
.clock.mini .nm,.clock.mini .tk{display:none}
.nudges{display:grid; grid-template-columns:auto 1fr 1fr; gap:8px; align-items:center; font-size:15px; color:var(--muted); font-weight:600}
.nudges .btn{min-height:44px; padding:4px 10px}

/* Time entry */
.timeentry{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap}
.tbox{width:2.6em; height:62px; text-align:center; font:700 32px var(--mono); border:2px solid var(--line); border-radius:12px; background:var(--sunk); font-variant-numeric:tabular-nums}
.tbox.wide{width:4.2em}
.tbox:focus{border-color:var(--signal); outline:none}
.colon{font:700 32px var(--mono)}
.seg{display:inline-flex; border:2px solid var(--line); border-radius:12px; padding:3px; background:var(--surface)}
.seg button{border:0; background:none; min-height:48px; padding:6px 16px; border-radius:9px; font-weight:800; font-size:18px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}

/* Feedback */
.fb{margin:0; padding:12px 16px; border-radius:12px; font-size:18px; border-left:6px solid transparent; background:var(--sunk)}
.fb:empty{display:none}
.fb.ok{background:var(--ok-soft); border-left-color:var(--ok)}
.fb.try{background:var(--try-soft); border-left-color:var(--try)}
.sentence{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:19px; font-weight:600}
.choice{min-width:58px; min-height:52px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font:800 22px var(--mono)}
.choice.yes{background:var(--ok-soft); border-color:var(--ok)}

/* Detective card */
.detective{background:var(--signal-soft); border:2px dashed var(--signal); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:12px}
.detective .eyebrow{margin:0; font-size:14px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.detective .q{margin:0; font-size:clamp(19px,1.7vw,23px); font-weight:700; max-width:40em}
.detective .hint{margin:0; font-size:15px; color:var(--muted)}
.evidence{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start}
.evidence:empty{display:none}
.evi{display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:800}
.evi .clock{width:150px}

/* Tables */
.tablewrap{overflow-x:auto}
table.tt{border-collapse:collapse; width:100%; font-size:19px; font-variant-numeric:tabular-nums}
.tt th{font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 10px; border-bottom:2px solid var(--line)}
.tt td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
.tt td.time{font:700 22px var(--mono); white-space:nowrap}
.tt tr.sel td{background:var(--signal-soft)}
.tt tr.click{cursor:pointer}
.mark{font-weight:800; font-size:16px; white-space:nowrap}
.mark.ok{color:var(--ok)} .mark.try{color:var(--try)}
.num-in{width:3.4em; height:52px; text-align:center; font:700 24px var(--mono); border:2px solid var(--line); border-radius:10px; background:var(--sunk)}
.num-in:focus{border-color:var(--signal); outline:none}
.num-in.okb{border-color:var(--ok)} .num-in.tryb{border-color:var(--try)}

/* Hops */
.hops{overflow-x:auto; padding:6px 2px 4px}
.hopline{display:flex; align-items:flex-end; gap:0; width:max-content}
.hopstop{display:flex; flex-direction:column; align-items:center; gap:4px}
.hopstop span{font:700 17px var(--mono); padding:6px 8px; border-radius:8px; background:var(--sunk); border:2px solid var(--line); white-space:nowrap}
.hopstop.hour span{background:var(--signal); color:var(--on-signal); border-color:var(--signal)}
.hopstop.end span{border-color:var(--ink)}
.hoparc{width:46px; height:26px; border:3px solid var(--minute); border-bottom:0; border-radius:26px 26px 0 0; margin:0 -4px 22px; position:relative}
.hoparc.big{border-color:var(--signal)}
.hoparc em{position:absolute; top:-22px; left:50%; transform:translateX(-50%); font:700 13px var(--mono); color:var(--minute); font-style:normal}
.hopnote{font-size:16px; color:var(--muted); margin:0}

/* Timetable track */
.colors{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.colors button{min-height:48px; padding:6px 16px 6px 8px; border-radius:999px; border:2px solid var(--line); background:var(--surface); font-weight:800; display:inline-flex; gap:8px; align-items:center}
.colors button i{width:30px; height:30px; border-radius:50%; background:var(--c)}
.colors button[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink)}
.trackwrap{overflow-x:auto; padding-bottom:6px}
.track{position:relative; display:grid; grid-template-columns:repeat(13, minmax(64px,1fr)); min-width:840px; padding-top:54px}
.track::before{content:""; position:absolute; left:32px; right:32px; top:66px; height:10px; border-radius:5px; background:var(--lc)}
.stop{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:0; padding:0 0 4px; min-height:84px}
.stop .dot{width:34px; height:34px; border-radius:50%; background:var(--surface); border:5px solid var(--lc); position:relative; z-index:1}
.stop .lbl{font:700 16px var(--mono); color:var(--muted)}
.stop .lbl.hr{color:var(--ink)}
.stop .trn{position:absolute; top:-50px; width:52px; height:40px; display:none}
.stop.on .trn{display:block}
.stop.on .dot{background:var(--lc)}
.stop.on .lbl{color:var(--ink)}
.stop.gapbad .dot{border-style:dashed; border-color:var(--try); background:var(--try-soft)}
.stop:hover .dot{transform:scale(1.08)}
.counter{font-weight:800; font-size:18px}
select.sel{height:52px; font:700 21px var(--mono); border:2px solid var(--line); border-radius:10px; background:var(--sunk); padding:0 8px}

/* Tickets */
.tickets{display:flex; gap:14px; flex-wrap:wrap}
.ticket{position:relative; display:flex; flex-direction:column; justify-content:center; width:150px; height:96px; padding:10px 18px; border-radius:10px; background:var(--signal-soft); border:2px solid var(--signal)}
.ticket::before,.ticket::after{content:""; position:absolute; top:50%; width:18px; height:18px; margin-top:-9px; border-radius:50%; background:var(--surface)}
.ticket::before{left:-10px} .ticket::after{right:-10px}
.ticket small{font-size:14px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.ticket b{font:700 36px var(--mono)}
.party{display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap}
.person{display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:800}
.person .price{font:700 20px var(--mono); color:var(--muted); min-height:1.4em}
.coins{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font:700 18px var(--mono)}
.coin{width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:var(--signal); color:var(--on-signal)}
.bill{padding:12px 16px; border-radius:8px; background:var(--ok-soft); border:2px solid var(--ok); font:700 22px var(--mono)}

/* Tally + graph */
.tally{display:flex; gap:10px; flex-wrap:wrap; align-items:center; min-height:44px}
.tally svg{width:44px; height:40px}
.tally svg line{stroke:var(--ink); stroke-width:3.5; stroke-linecap:round}
.tbtns{display:flex; gap:6px}
.tbtns .btn{min-width:52px; font-size:22px; padding:4px 10px}
.graph{display:grid; grid-template-columns:44px 1fr; gap:8px; max-width:760px}
.yaxis{position:relative; height:340px}
.yaxis span{position:absolute; right:4px; transform:translateY(50%); font:700 14px var(--mono); color:var(--muted)}
.plot{position:relative; height:340px; border-left:3px solid var(--ink); border-bottom:3px solid var(--ink); display:grid; grid-template-columns:repeat(5,1fr); gap:12px; padding:0 12px}
.gl{position:absolute; left:0; right:0; height:0; border-top:1px dashed var(--line)}
.col{position:relative; z-index:1; display:flex; align-items:flex-end; justify-content:center; cursor:pointer; background:none; border:0; padding:0; height:100%}
.col:hover{background:color-mix(in srgb, var(--lc) 7%, transparent)}
.bar{width:72%; background:var(--lc); border-radius:6px 6px 0 0; transition:height .2s}
.bar.bad{background:repeating-linear-gradient(45deg, var(--lc) 0 10px, var(--try) 10px 16px)}
.bar b{display:block; text-align:center; font:700 15px var(--mono); color:var(--surface); padding-top:2px}
.xlabels{grid-column:2; display:grid; grid-template-columns:repeat(5,1fr); gap:12px; padding:0 12px}
.xl{display:flex; flex-direction:column; align-items:center; gap:4px}
.xl span{font:700 15px var(--mono)}
.xl .tbtns .btn{min-width:44px; min-height:40px; font-size:18px}
@media (prefers-reduced-motion: reduce){ .bar{transition:none} }

/* Express */
.exlist{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font:700 22px var(--mono)}
.exlist .fixed{padding:10px 12px; background:var(--sunk); border-radius:10px; border:2px solid var(--line)}
.exlist .num-in{width:4.4em}

/* Showcase board */
.board{background:var(--board); border-radius:20px; padding:20px clamp(14px,2.4vw,28px); color:#F2F4F8; display:flex; flex-direction:column; gap:14px}
.boardhead{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.boardhead .roundel{width:48px; height:48px; border-width:6px}
.boardhead h3{font-size:clamp(24px,3vw,36px); font-weight:900; color:#F2F4F8}
.boardhead .clk{margin-left:auto; font:700 clamp(24px,3vw,36px) var(--mono); color:var(--board-ink)}
.depart{width:100%; border-collapse:separate; border-spacing:0 6px; font-variant-numeric:tabular-nums}
.depart th{font:800 13px var(--display); letter-spacing:.12em; text-transform:uppercase; color:var(--board-dim); text-align:left; padding:0 10px}
.depart td{background:#152038; padding:8px 10px; font:700 clamp(20px,2.4vw,30px) var(--mono); color:var(--board-ink)}
.depart td:first-child{border-radius:8px 0 0 8px} .depart td:last-child{border-radius:0 8px 8px 0}
.depart td.dim{color:var(--board-dim); font-size:clamp(16px,1.8vw,22px)}
.depart tr.now td{background:#2A3A1A; color:#C8F27A}
.depart .flap{display:inline-block; animation:flap .35s ease-out}
@keyframes flap{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@media (prefers-reduced-motion: reduce){.depart .flap{animation:none}}
.showgrid{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:18px; align-items:start}
.prompts{display:flex; flex-direction:column; gap:12px}
.prompt{background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:14px 16px}
.prompt p{margin:0}
.prompt .pq{font-weight:800; font-size:19px}
.prompt .pa{margin-top:6px; color:var(--muted); font-size:17px}
.example{font-size:15px; color:var(--board-dim); margin:0}
input.text{height:52px; border:2px solid var(--line); border-radius:10px; background:var(--sunk); padding:0 12px; font-size:19px; font-weight:700; min-width:0; width:min(100%,320px)}

@media (max-width: 900px){
  .classes{grid-template-columns:repeat(2,1fr)}
  .showgrid{grid-template-columns:1fr}
}
@media (max-width: 520px){
  body{font-size:17px}
  .classes small{display:none}
  .tools{margin-left:0}
  .yaxis,.plot{height:260px}
  .plot,.xlabels{gap:6px; padding:0 4px}
  .bar{width:86%}
  .tt td{padding:6px 6px}
  .tt td.time{font-size:18px}
}
</style>

<div class="wrap">
<header>
  <div class="sign">
    <div class="roundel" aria-hidden="true"><i></i></div>
    <div>
      <p class="sub">Grade 2 · Set 4 project · 3 class periods</p>
      <h1>Station Masters</h1>
      <p class="tag">Read the station clock. Build the timetable. Get every passenger on the right train.</p>
    </div>
  </div>
  <div class="tools">
    <button class="btn ghost" id="fsBtn">Full screen</button>
    <button class="btn ghost" id="resetBtn">Start over</button>
  </div>
</header>
<nav class="classes" role="tablist" id="classTabs" aria-label="Class periods"></nav>
<main id="views"></main>
</div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad=n=>String(n).padStart(2,'0');
const NS='http://www.w3.org/2000/svg';
const T=(h,m,pm)=>((h%12)+(pm?12:0))*60+m;           // minutes since midnight
const norm=t=>((t%1440)+1440)%1440;
const fmt=t=>{t=norm(t); return `${(Math.floor(t/60)%12)||12}:${pad(t%60)}`;};
const ap=t=>norm(t)<720?'a.m.':'p.m.';
const angDiff=(a,b)=>((a-b)%360+540)%360-180;         // signed a−b in [−180,180)
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LINES={red:'Red',blue:'Blue',green:'Green',orange:'Orange',purple:'Purple'};

const ICON={
 sun:`<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="9" fill="var(--signal)"/>${[0,45,90,135,180,225,270,315].map(a=>`<line x1="22" y1="5" x2="22" y2="10" stroke="var(--signal)" stroke-width="3.5" stroke-linecap="round" transform="rotate(${a} 22 22)"/>`).join('')}</svg>`,

/* ---------------- Clock ---------------- */
function Clock(o={}){
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','-132 -132 264 264'); svg.setAttribute('role','img'); svg.setAttribute('aria-label',o.label||'Clock');
  svg.classList.add('clock'); if(o.cls) svg.classList.add(o.cls);
  let s=`<circle class="face" r="104"/>`;
  for(let i=0;i<60;i++) s+=`<line class="${i%5?'tk':'tk5'}" x1="0" y1="-96" x2="0" y2="${i%5?-91:-85}" transform="rotate(${i*6})"/>`;
  for(let i=1;i<=12;i++){const a=i*Math.PI/6; s+=`<text class="nm" x="${(Math.sin(a)*66).toFixed(1)}" y="${(-Math.cos(a)*66).toFixed(1)}">${i}</text>`;}
  s+=`<g class="extra"></g><g class="fives"></g><g class="hg"><line class="hh" x1="0" y1="10" x2="0" y2="-50"/></g><g class="mg"><line class="mh" x1="0" y1="14" x2="0" y2="-84"/></g><circle class="pin" r="7"/>`;
  svg.innerHTML=s;
  const hg=$('.hg',svg), mg=$('.mg',svg), fives=$('.fives',svg), extra=$('.extra',svg);
  const C={el:svg,minA:0,hourA:0,sel:null,onchange:null,gen:0};
  C.setAngles=(m,h)=>{C.minA=norm(Math.round(m*1000)/1000)%360; C.hourA=((h%360)+360)%360; mg.setAttribute('transform',`rotate(${C.minA})`); hg.setAttribute('transform',`rotate(${C.hourA})`);};
  C.setT=t=>{t=norm(t); C.setAngles((t%60)*6,((t%720))*.5);};
  C.setTime=(h,m)=>C.setT(T(h,m,false));
  C.animate=async(from,to,ms=1600)=>{
    const g=++C.gen; if(reduced||Math.abs(to-from)>180){C.setT(to);return;}
    const st=performance.now();
    while(true){ if(g!==C.gen)return; const k=Math.min(1,(performance.now()-st)/ms); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; const t=from+(to-from)*e;
      mg.setAttribute('transform',`rotate(${(t%60)*6})`); hg.setAttribute('transform',`rotate(${(t%720)*.5})`); if(k>=1)break; await new Promise(r=>requestAnimationFrame(r)); }
    C.setT(to);
  };
  C.showFives=async(m)=>{
    const g=++C.gen; fives.innerHTML=''; const n=m/5;
    for(let k=1;k<=n;k++){ if(g!==C.gen)return; const a=k*Math.PI/6;
      fives.insertAdjacentHTML('beforeend',`<circle class="fivedot" cx="${(Math.sin(a)*66).toFixed(1)}" cy="${(-Math.cos(a)*66).toFixed(1)}" r="16"/><text class="five" x="${(Math.sin(a)*119).toFixed(1)}" y="${(-Math.cos(a)*119).toFixed(1)}">${k*5}</text>`);
      if(!reduced) await sleep(420); }
  };
  C.clearFives=()=>{fives.innerHTML='';};
  C.extra=extra;
  if(o.drag){
    svg.classList.add('drag');
    const pt=e=>{const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(svg.getScreenCTM().inverse()); return {a:(Math.atan2(q.x,-q.y)*180/Math.PI+360)%360, r:Math.hypot(q.x,q.y)};};
    const mark=()=>{hg.classList.toggle('sel',C.sel==='h'); mg.classList.toggle('sel',C.sel==='m');};
    const move=p=>{ if(C.sel==='m') C.setAngles(Math.round(p.a/30)*30%360,C.hourA); else C.setAngles(C.minA,Math.round(p.a/2.5)*2.5%360); C.onchange&&C.onchange(); };
    svg.addEventListener('pointerdown',e=>{ const p=pt(e); const dm=Math.abs(angDiff(p.a,C.minA)), dh=Math.abs(angDiff(p.a,C.hourA));
      if(dm<22&&dh<22) C.sel=p.r<62?'h':'m'; else C.sel=dm<=dh?'m':'h';
      mark(); svg.setPointerCapture(e.pointerId); move(p); e.preventDefault(); });
    svg.addEventListener('pointermove',e=>{ if(!svg.hasPointerCapture(e.pointerId))return; move(pt(e)); });
    svg.addEventListener('pointerup',e=>{ try{svg.releasePointerCapture(e.pointerId);}catch(_){} });
    C.nudge=(hand,dir)=>{ C.sel=hand; mark(); if(hand==='m') C.setAngles(norm(C.minA+dir*30)%360,C.hourA); else C.setAngles(C.minA,(C.hourA+dir*2.5+360)%360); C.onchange&&C.onchange(); };
  }
  return C;
}
function nudgeBar(clk){
  const d=document.createElement('div'); d.className='nudges';
  d.innerHTML=`<span>Long hand</span><button class="btn ghost small" data-h="m" data-d="-1" aria-label="Long hand back 5 minutes">◀ 5 min</button><button class="btn ghost small" data-h="m" data-d="1" aria-label="Long hand forward 5 minutes">5 min ▶</button>
  <span>Short hand</span><button class="btn ghost small" data-h="h" data-d="-1" aria-label="Short hand back a little">◀ a bit</button><button class="btn ghost small" data-h="h" data-d="1" aria-label="Short hand forward a little">a bit ▶</button>`;
  $$('button',d).forEach(b=>b.onclick=()=>clk.nudge(b.dataset.h,+b.dataset.d));
  return d;
}
const frac=m=>({5:'just a tiny bit',10:'a little',15:'a quarter of the way',30:'halfway',45:'three quarters of the way'})[m]||`${m} of 60 minutes`;
function drawCheck(h,m,clk){
  const tm=(m*6)%360, th=((h%12)*60+m)*.5, next=h%12+1, tips=[];
  if(Math.abs(angDiff(clk.minA,tm))>0.01) tips.push(`The long hand shows the minutes. Count by fives to ${m||60}. The long hand belongs on the ${m/5||12}.`);
  const diff=angDiff(clk.hourA,th);
  const onMark=Math.abs(angDiff(clk.hourA,Math.round(clk.hourA/30)*30))<0.01;
  if(Math.abs(diff)>5){
    if(diff<0) tips.push(`Slide the short hand forward. At ${h}:${pad(m)} it has moved ${frac(m)} from ${h} toward ${next}.`);
    else tips.push(`The short hand went too far. It is not ${next} o'clock yet, so it has not reached ${next}.`);
  } else if(m>=10&&onMark){ tips.push(`So close! The short hand points right at the ${Math.round(clk.hourA/30)%12||12}. That is where it sits at ${Math.round(clk.hourA/30)%12||12}:00. ${m} minutes have passed, so nudge it a little toward ${next}.`); }
  return tips;
}
function fb(el,ok,msg){ el.className='fb '+(ok?'ok':'try'); el.innerHTML=msg; }
function detective(q,hint){
  const d=document.createElement('div'); d.className='detective';
  d.innerHTML=`<p class="eyebrow">Station detective</p><p class="q">${q}</p><div class="row acts"></div><div class="evidence"></div><p class="fb" aria-live="polite"></p><p class="hint">${hint||'Talk it over first, then tap a button to put evidence on screen.'}</p>`;
  return d;
}
function addAct(d,label,fn,primary){ const b=document.createElement('button'); b.className='btn '+(primary?'go':'ghost'); b.textContent=label; b.onclick=fn; $('.acts',d).append(b); return b; }
function numVal(inp){ const v=inp.value.trim(); return v===''?null:(/^\d+$/.test(v)?+v:NaN); }
function parseTime(s){ const m=String(s).trim().match(/^(\d{1,2})\s*[:.]?\s*(\d{2})$/); if(!m)return null; const h=+m[1], mi=+m[2]; if(h<1||h>12||mi>59)return null; return {h,m:mi}; }

/* ---------------- Part 1 ---------------- */
function buildP1(){
  const host=$('#p1');
  host.innerHTML=`<p class="lead"><b>Read the station clock.</b> Count by fives. Write the time, then pick a.m. or p.m.</p><div class="grid2" id="p1cards"></div>`;
  const cards=[{k:'am',title:'Morning train',icon:'sun',h:8,m:35,ap:'a.m.'},{k:'pm',title:'Evening train',icon:'moon',h:6,m:55,ap:'p.m.'}];
  const clocks={};
  cards.forEach(c=>{
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`<div class="cardhead">${ICON[c.icon]}<h3>${c.title}</h3></div><div class="clockwrap"></div>
      <div class="timeentry"><input class="tbox" id="p1h-${c.k}" inputmode="numeric" maxlength="2" aria-label="Hour" placeholder="__"><span class="colon">:</span><input class="tbox" id="p1m-${c.k}" inputmode="numeric" maxlength="2" aria-label="Minutes" placeholder="__">
      <div class="seg" role="group" aria-label="a.m. or p.m."><button data-ap="a.m." aria-pressed="false">a.m.</button><button data-ap="p.m." aria-pressed="false">p.m.</button></div></div>
      <div class="row center"><button class="btn primary chk">Check</button><button class="btn ghost fv">Count by fives</button></div><p class="fb" aria-live="polite"></p>`;
    const clk=Clock({label:`${c.title} station clock`}); clk.setTime(c.h,c.m); $('.clockwrap',card).append(clk.el); clocks[c.k]=clk;
    let pick=null;
    $$('.seg button',card).forEach(b=>b.onclick=()=>{pick=b.dataset.ap; $$('.seg button',card).forEach(x=>x.setAttribute('aria-pressed',x===b));});
    $('.fv',card).onclick=()=>clk.showFives(c.m);
    $('.chk',card).onclick=()=>{
      const H=numVal($('#p1h-'+c.k,card)), M=numVal($('#p1m-'+c.k,card)), out=$('.fb',card), tips=[];
      if(H===null||M===null){ fb(out,false,'Write the hour and the minutes first. Then check.'); return; }
      if(M!==c.m){ if(M===c.m/5) tips.push(`The long hand points at the ${c.m/5}, but minutes count by fives. Count 5, 10, 15… until you reach the ${c.m/5}.`); else tips.push('Look again at the minutes. Count by fives from the 12 to the long hand. Tap “Count by fives” to see it.'); }
      if(H!==c.h){ if(H===c.h%12+1) tips.push(`The short hand is close to ${c.h%12+1}, but it has not reached it yet. The hour is the number it passed last.`); else tips.push('Look again at the hour. Which number did the short hand pass last?'); }
      if(!pick) tips.push('Pick a.m. or p.m. too.');
      else if(pick!==c.ap) tips.push(c.ap==='a.m.'?'This train runs in the morning. Morning times, from midnight to noon, are a.m.':'This train runs in the evening. Times from noon to midnight are p.m.');
      if(!tips.length){ fb(out,true,`<b>Yes! ${c.h}:${pad(c.m)} ${c.ap}</b> The long hand on the ${c.m/5} means ${c.m} minutes.`); clk.showFives(c.m); }
      else fb(out,false,tips.join(' ')+' Try again.');
    };
    $('#p1cards',host).append(card);
  });
  const d=detective('At 8:35 the short hand is more than halfway to 9. So why do we still say 8, not 9?');
  const evi=$('.evidence',d), out=$('.fb',d);
  addAct(d,'Watch 8:00 to 8:35',async()=>{ out.className='fb'; out.textContent=''; clocks.am.clearFives(); clocks.am.setT(T(8,0)); await sleep(300); await clocks.am.animate(T(8,0),T(8,35),2600);
    fb(out,true,'At 8:00 the short hand is right on the 8. As the minutes go by, it creeps toward 9. At 8:35 it still has not arrived, so the hour is still 8.'); },true);
  addAct(d,'Finish the hour',async()=>{ clocks.am.clearFives(); await clocks.am.animate(T(8,35),T(9,0),1500); fb(out,true,'At 9:00 the long hand is back on 12, and the short hand finally reaches 9. Now it is 9 o\'clock.'); });
  addAct(d,'Back to 8:35',()=>{ clocks.am.gen++; clocks.am.setT(T(8,35)); out.className='fb'; out.textContent=''; });
  host.append(d);
}

/* ---------------- Part 2 ---------------- */
function buildP2(){
  const host=$('#p2');
  host.innerHTML=`<p class="lead"><b>Draw the hands.</b> Drag a hand, or use the buttons. Watch the short hand. Is it closer to one number than the other?</p><div class="grid2" id="p2cards"></div>`;
  const D=[
    {k:'a',h:2,m:45,ap:'p.m.',q:'The short hand is closest to',choices:[2,3],ans:3,why:{2:'45 minutes have gone by since 2:00. That is three quarters of the way to the next number. Which number is it closer to now?'},yes:'Three quarters of the hour is gone, so the short hand sits just before 3.'},
    {k:'b',h:11,m:10,ap:'a.m.',q:'The short hand is just past',choices:[10,11,12],ans:11,why:{10:'The short hand passed 10 at 10:00, more than an hour ago. Which number did it pass at 11:00?',12:'The short hand reaches 12 at 12:00. That is still 50 minutes away. Which number has it only just left?'},yes:'It left 11 only 10 minutes ago, so it is just a little past 11.'}
  ];
  D.forEach(c=>{
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`<div class="cardhead">${ICON[c.ap==='a.m.'?'sun':'moon']}<h3 style="font:700 30px var(--mono)">${c.h}:${pad(c.m)} ${c.ap}</h3></div><div class="clockwrap"></div><div class="nb"></div>
      <div class="row center"><button class="btn primary chk">Check my clock</button><button class="btn ghost show">Show me</button></div><p class="fb" aria-live="polite"></p>
      <div class="sentence"><span>${c.q}</span>${c.choices.map(n=>`<button class="choice" data-n="${n}">${n}</button>`).join('')}</div><p class="fb sfb" aria-live="polite"></p>`;
    const clk=Clock({drag:true,label:`Clock to set to ${c.h}:${pad(c.m)}`}); clk.setAngles(0,0); $('.clockwrap',card).append(clk.el); $('.nb',card).append(nudgeBar(clk));
    const out=$('.fb',card);
    clk.onchange=()=>{ if(out.classList.contains('ok')){out.className='fb'; out.textContent='';} };
    $('.chk',card).onclick=()=>{ const tips=drawCheck(c.h,c.m,clk); if(!tips.length) fb(out,true,`<b>Your clock says ${c.h}:${pad(c.m)}.</b> Long hand on the ${c.m/5}, short hand ${c.k==='a'?'just before 3':'just past 11'}.`); else fb(out,false,tips.join(' ')); };
    $('.show',card).onclick=async()=>{ const tm=T(c.h,c.m); await clk.animate(tm-30,tm,1200); fb(out,true,`Here is ${c.h}:${pad(c.m)}. Look where the short hand stopped.`); };
    $$('.choice',card).forEach(b=>b.onclick=()=>{ const n=+b.dataset.n, sf=$('.sfb',card);
      $$('.choice',card).forEach(x=>x.classList.remove('yes'));
      if(n===c.ans){ b.classList.add('yes'); fb(sf,true,`<b>${c.ans}.</b> ${c.yes}`); } else fb(sf,false,c.why[n]); });
    $('#p2cards',host).append(card);
  });
  const d=detective('The short hand never jumps. It slides a little every minute. Where is it at 2:15? At 2:30? At 2:45?');
  const evi=$('.evidence',d), out=$('.fb',d);
  addAct(d,'Show 2:15, 2:30, 2:45',()=>{ evi.innerHTML=''; [[2,15,'a quarter of the way'],[2,30,'halfway'],[2,45,'three quarters']].forEach(([h,m,w])=>{ const k=Clock({label:`${h}:${m}`}); k.setTime(h,m); const e=document.createElement('div'); e.className='evi'; e.append(k.el); e.insertAdjacentHTML('beforeend',`<span style="font:700 20px var(--mono)">${h}:${pad(m)}</span><span style="font-size:15px;color:var(--muted)">${w} to 3</span>`); evi.append(e); });
    fb(out,true,'The more minutes go by, the farther the short hand slides from 2 toward 3. At 2:15 it is still close to 2. At 2:45 it is close to 3.'); },true);
  host.append(d);
}

/* ---------------- Part 3 ---------------- */
const P3=[[T(8,0),T(8,10)],[T(8,10),T(8,25)],[T(8,25),T(8,30)],[T(8,30),T(8,50)],[T(3,50,1),T(4,5,1)]];
function hopsHTML(a,b){
  let h='<div class="hopline">';
  for(let t=a;t<=b;t+=5){ h+=`<div class="hopstop ${t%60===0?'hour':''} ${t===a||t===b?'end':''}"><span>${fmt(t)}</span></div>`; if(t<b) h+=`<div class="hoparc"></div>`; }
  return h+'</div>';
}

  const host=$('#p3');
  host.innerHTML=`<p class="lead"><b>Minutes between trains.</b> Count up by fives, or count up to the hour first. Tap a row to see the hops.</p>
  <div class="card"><div class="tablewrap"><table class="tt" id="p3t"><thead><tr><th>Train leaves</th><th>Next train</th><th>Minutes between</th><th></th></tr></thead><tbody>

  <div class="row"><button class="btn primary" id="p3chk">Check the table</button></div><p class="fb" id="p3fb" aria-live="polite"></p>
  <div class="hops" id="p3hops"></div><p class="hopnote" id="p3note"></p></div>
  <div class="card"><h3>Show how you found 3:50 to 4:05</h3>
   <div class="sentence"><span>3:50 → 4:00 is</span><input class="num-in" id="p3b1" inputmode="numeric" aria-label="Minutes from 3:50 to 4:00"><span>minutes, 4:00 → 4:05 is</span><input class="num-in" id="p3b2" inputmode="numeric" aria-label="Minutes from 4:00 to 4:05"><span>minutes, total</span><input class="num-in" id="p3b3" inputmode="numeric" aria-label="Total minutes"></div>
   <div class="row"><button class="btn primary" id="p3bchk">Check</button><button class="btn ghost" id="p3bshow">Count to the hour first</button></div>
   <div class="hops" id="p3bh"></div><p class="fb" id="p3bfb" aria-live="polite"></p></div>`;
  const showHops=i=>{ $$('#p3t tbody tr').forEach(tr=>tr.classList.toggle('sel',+tr.dataset.i===i)); const [a,b]=P3[i]; $('#p3hops').innerHTML=hopsHTML(a,b);
    $('#p3note').textContent=`Each arc is one hop of 5 minutes, from ${fmt(a)} to ${fmt(b)}. Count by fives as you go.${(b%60)<(a%60)?' The yellow stop is the new hour.':''}`; };
  $$('#p3t tbody tr').forEach(tr=>tr.onclick=e=>{ if(e.target.tagName!=='INPUT') showHops(+tr.dataset.i); });
  $$('#p3t input').forEach(inp=>inp.addEventListener('focus',()=>showHops(+inp.id.split('-')[1])));
  $('#p3chk').onclick=()=>{
    let wrong=-1, blank=0;
    P3.forEach((r,i)=>{ const v=numVal($('#p3-'+i)), ans=r[1]-r[0], mk=$('#p3m-'+i), inp=$('#p3-'+i);
      inp.classList.remove('okb','tryb'); mk.className='mark'; mk.textContent='';
      if(v===null){blank++;return;}

  let h='<thead><tr><th>Train (time)</th><th>Tally</th><th>Riders</th></tr></thead><tbody>';
  S.riders.forEach((r,i)=>{ h+=`<tr><td><select class="sel" data-i="${i}" aria-label="Train time">${opts.map(t=>`<option value="${t}" ${t===r.t?'selected':''}>${fmt(t)} ${ap(t)}</option>`).join('')}</select></td>
    <td><div class="row" style="gap:12px;flex-wrap:nowrap"><div class="tbtns"><button class="btn ghost" data-i="${i}" data-d="-1" aria-label="Remove a rider">−</button><button class="btn go" data-i="${i}" data-d="1" aria-label="Add a rider">+</button></div><div class="tally">${tallySVG(r.tally)}</div></div></td>
    <td><input class="num-in" id="p6c-${i}" inputmode="numeric" maxlength="3" aria-label="Riders on train ${i+1}" value="${r.count}"></td></tr>`; });
  $('#p6t').innerHTML=h+'</tbody>';
  $$('#p6t select').forEach(s=>s.onchange=()=>{ S.riders[+s.dataset.i].t=+s.value; renderGraph(); fillBusy(); });
  $$('#p6t .tbtns button').forEach(b=>b.onclick=()=>{ const r=S.riders[+b.dataset.i]; r.tally=Math.max(0,r.tally+ +b.dataset.d); renderP6(); });
  $$('#p6t input').forEach(inp=>inp.oninput=()=>{ S.riders[+inp.id.split('-')[1]].count=inp.value; });
  renderGraph(); fillBusy();
}
function fillBusy(){ const s=$('#p6busy'); const cur=s.value; s.innerHTML='<option value="">pick a train</option>'+S.riders.map(r=>`<option value="${r.t}">${fmt(r.t)} ${ap(r.t)}</option>`).join(''); if([...s.options].some(o=>o.value===cur)) s.value=cur; }
function renderGraph(bad=[]){
  const g=$('#p6g'); if(!g) return; const sc=S.scale;
  const mxv=Math.max(...S.riders.map(r=>Math.max(r.tally,r.bar)));
  let top=sc===1?Math.max(10,mxv):Math.max(20,mxv); if(top%sc) top+=sc-top%sc;
  let y='', gl='';
  for(let v=0; v<=top; v+=sc){ const p=v/top*100; if(sc===1&&top>20&&v%2) { gl+=`<div class="gl" style="bottom:${p}%"></div>`; continue; } y+=`<span style="bottom:${p}%">${v}</span>`; if(v) gl+=`<div class="gl" style="bottom:${p}%"></div>`; }
  g.innerHTML=`<div class="yaxis">${y}</div><div class="plot">${gl}${S.riders.map((r,i)=>`<button class="col" data-i="${i}" aria-label="Bar for ${fmt(r.t)}, ${r.bar} riders"><div class="bar ${bad.includes(i)?'bad':''}" style="height:${r.bar/top*100}%">${r.bar?`<b>${r.bar}</b>`:''}</div></button>`).join('')}</div>
   <div class="xlabels">${S.riders.map((r,i)=>`<div class="xl"><span>${fmt(r.t)}</span><div class="tbtns"><button class="btn ghost" data-i="${i}" data-d="-1" aria-label="Lower ${fmt(r.t)} bar">▼</button><button class="btn ghost" data-i="${i}" data-d="1" aria-label="Raise ${fmt(r.t)} bar">▲</button></div></div>`).join('')}</div>`;
  $$('.col',g).forEach(c=>c.onclick=e=>{ const rc=c.getBoundingClientRect(); const v=Math.round((rc.bottom-e.clientY)/rc.height*top/sc)*sc; S.riders[+c.dataset.i].bar=Math.max(0,Math.min(top,v)); renderGraph(); });
  $$('.xl button',g).forEach(b=>b.onclick=()=>{ const r=S.riders[+b.dataset.i]; r.bar=Math.max(0,r.bar+ +b.dataset.d); renderGraph(); });
}

/* ---------------- Express challenge ---------------- */
const EXP=Array.from({length:8},(_,k)=>T(8,5)+15*k);
function buildPX(){
  const host=$('#px');
  host.innerHTML=`<p class="lead"><b>Express Line Challenge.</b></p>
  <div class="card"><h3>1. The express leaves every 15 minutes, starting at 8:05. List the first eight departures.</h3>
   <div class="exlist"><span class="fixed">8:05</span>${EXP.slice(1).map((t,i)=>`<input class="num-in" id="ex-${i+1}" aria-label="Departure ${i+2}" placeholder="_:__">`).join('')}</div>
   <div class="row"><button class="btn primary" id="exchk">Check my list</button></div><p class="fb" id="exfb" aria-live="polite"></p></div>`;
  const d=detective('What pattern do the minutes make?');
  addAct(d,'Show the pattern',()=>{ const evi=$('.evidence',d); evi.innerHTML='';
    const k=Clock({label:'Where the long hand points for each express'}); k.el.style.width='240px';
    const pts=[1,4,7,10].map(n=>{const a=n*Math.PI/6; return [Math.sin(a)*84, -Math.cos(a)*84];});
    k.extra.innerHTML=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--signal)" stroke-width="5" stroke-linejoin="round"/>${pts.map(([x,y],i)=>`<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="var(--minute)" stroke-width="5" stroke-linecap="round" opacity=".85"/><circle cx="${x}" cy="${y}" r="9" fill="var(--signal)"/>`).join('')}`;
    $('.hg',k.el).style.display='none'; $('.mg',k.el).style.display='none';
    const e=document.createElement('div'); e.className='evi'; e.append(k.el); evi.append(e);
    const list=document.createElement('div'); list.className='exlist'; list.style.alignSelf='center';
    list.innerHTML=EXP.map(t=>`<span class="fixed">${Math.floor(norm(t)/60)%12||12}:<b style="color:var(--minute)">${pad(t%60)}</b></span>`).join('');
    evi.append(list);
    fb($('.fb',d),true,'The minutes go :05, :20, :35, :50, then start over at :05. Four expresses leave every hour. The long hand visits the 1, 4, 7 and 10, the corners of a square.'); },true);
  host.append(d);
  const c2=document.createElement('div'); c2.className='card';
  c2.innerHTML=`<h3>2. A train leaves at 12:55 p.m. The next one comes 10 minutes later. Write its time and draw it.</h3>
   <div class="grid2" style="align-items:center"><div class="clockwrap"></div><div style="display:flex;flex-direction:column;gap:12px">
    <div class="timeentry"><input class="tbox" id="ex2h" inputmode="numeric" maxlength="2" aria-label="Hour" placeholder="__"><span class="colon">:</span><input class="tbox" id="ex2m" inputmode="numeric" maxlength="2" aria-label="Minutes" placeholder="__"><span class="colon" style="font-size:26px">p.m.</span></div>
    <div class="nb"></div><div class="row center"><button class="btn primary" id="ex2chk">Check</button><button class="btn ghost" id="ex2hint">Count it on the clock</button></div><p class="fb" id="ex2fb" aria-live="polite"></p></div></div>`;
  host.append(c2);
  const clk=Clock({drag:true,label:'Clock to draw the next train'}); clk.setAngles(0,0); $('.clockwrap',c2).append(clk.el); $('.nb',c2).append(nudgeBar(clk));
  $('#ex2hint').onclick=async()=>{ fb($('#ex2fb'),true,'Start at 12:55 and watch 10 minutes go by. Where do the hands land?'); clk.setT(T(12,55)); await sleep(400); await clk.animate(T(12,55),T(12,55)+10,2400); };
  $('#ex2chk').onclick=()=>{ const H=numVal($('#ex2h')), M=numVal($('#ex2m')), tips=[], out=$('#ex2fb');
    if(H===null||M===null){ fb(out,false,'Write the hour and minutes first.'); return; }
    if(H===13) tips.push('Station clocks only go up to 12. After 12:59 the hour starts again at 1.');
    else if(H===12) tips.push('Count on from 12:55: 1 o\'clock comes 5 minutes later. Did the hour change?');
    else if(H!==1) tips.push('Look again at the hour. Count on 10 minutes from 12:55.');
    if(M!==5){ if(M===65) tips.push('There are only 60 minutes in an hour. At 60 the clock starts a new hour at :00.'); else tips.push('12:55 + 5 minutes reaches the hour. Then 5 more minutes. What are the minutes now?'); }
    tips.push(...drawCheck(1,5,clk).map(t=>'On the clock: '+t));
    if(!tips.length) fb(out,true,'<b>1:05 p.m.</b> 5 minutes to reach 1:00, then 5 more. Long hand on the 1, short hand just past 1.');
    else fb(out,false,tips.join(' '));
  };
  $('#exchk').onclick=()=>{ const out=$('#exfb'); let first=null, blank=0;
    EXP.slice(1).forEach((t,i)=>{ const inp=$('#ex-'+(i+1)); inp.classList.remove('okb','tryb'); const v=inp.value.trim(); if(!v){blank++;return;} const p=parseTime(v); const ok=p&&T(p.h,p.m,false)%720===t%720; inp.classList.add(ok?'okb':'tryb'); if(!ok&&first===null) first=i+1; });
    if(first!==null){ const prev=EXP[first-1]; const hr=Math.ceil((prev+1)/60)*60; fb(out,false,`Look at box ${first}. Add 15 minutes to ${fmt(prev)}.${EXP[first]>=hr?` Count to ${fmt(hr)} first (${hr-prev} minutes), then the rest.`:''} Write times like 8:20.`); return; }
    if(blank) fb(out,true,`So far so good. ${blank} box${blank>1?'es':''} to go.`); else fb(out,true,'<b>All eight are right!</b> 8:05, 8:20, 8:35, 8:50, 9:05, 9:20, 9:35, 9:50.'); };
}

/* ---------------- Showcase ---------------- */
const EXAMPLE=[T(8,0),T(8,10),T(8,25),T(8,40),T(8,50),T(9,0)];
function buildShow(){
  const host=$('#pshow');
  const m=S.morning.length===6?S.morning.slice().sort((a,b)=>a-b):null;
  const morn=m||EXAMPLE, eve=S.evening.map(eveT).filter(t=>t!==null);
  const trains=[...morn,...eve];
  const ridersAt=t=>{ const r=S.riders&&S.riders.find(x=>x.t===t&&x.tally>0); return r?r.tally:null; };
  const anyR=trains.some(t=>ridersAt(t)!==null);
  host.innerHTML=`<div class="row"><label for="team" style="font-weight:800">Team name</label><input class="text" id="team" value="${S.team.replace(/"/g,'&quot;')}" placeholder="Our team"></div>
  <div class="showgrid"><div class="board">
    <div class="boardhead"><div class="roundel" aria-hidden="true"><i></i></div><h3 id="bname">${S.team?S.team+' · ':''}${LINES[S.color]} Line</h3><span class="clk" id="bclk">--:--</span></div>
    ${m?'':'<p class="example">Example timetable shown. Build your own six trains in Class 2, Part 4, and it appears here.</p>'}
    <div class="tablewrap"><table class="depart"><thead><tr><th>Train</th><th>Departs</th><th></th><th>Next in</th>${anyR?'<th>Riders</th>':''}</tr></thead><tbody>
    ${trains.map((t,i)=>`<tr data-i="${i}"><td class="dim">${i+1}</td><td><span class="flap">${fmt(t)}</span></td><td class="dim">${ap(t)}</td><td class="dim">${trains[i+1]!=null&&trains[i+1]-t<=60?trains[i+1]-t+' min':'—'}</td>${anyR?`<td>${ridersAt(t)??'—'}</td>`:''}</tr>`).join('')}
    </tbody></table></div>
    <div class="row"><button class="btn go" id="bnext">Next departure</button><button class="btn ghost" id="bstart" style="background:transparent;color:#F2F4F8;border-color:#3A4A6A">Back to first train</button></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px;align-items:center"><div class="clockwrap" id="sclock"></div><p class="lead" id="snote" style="text-align:center;font-weight:700">Tap “Next departure” to run your line.</p></div></div>
  <div class="prompts"><h3>Talk about your line</h3>
   <div class="prompt"><p class="pq">Read your board aloud. Use a.m. and p.m.</p></div>
   <div class="prompt"><p class="pq">Which train was busiest? How many more riders did it have than the emptiest train?</p><p class="pa">${S.busy!=null?`Your answer: the ${fmt(S.busy)} ${ap(S.busy)} train.`:'Answer this in Class 3, Part 6.'}</p></div>
   <div class="prompt"><p class="pq">Why does the board need a.m. and p.m.?</p></div>
   <div class="prompt"><p class="pq">The express leaves every 15 minutes from 8:05. What pattern do the minutes make?</p></div>
  </div>`;
  const clk=Clock({label:'Station clock'}); clk.el.classList.add('big'); $('#sclock').append(clk.el); clk.setT(trains[0]);
  let idx=-1; const rows=$$('.depart tbody tr',host);
  const go=async i=>{ const prev=idx>=0?trains[idx]:trains[0]; idx=i; rows.forEach((r,j)=>r.classList.toggle('now',j===i)); const t=trains[i];
    $('#bclk').textContent=`${fmt(t)} ${ap(t)}`;
    const gap=i>0?t-trains[i-1]:null;
    $('#snote').textContent=i===0?`Train 1 departs at ${fmt(t)} ${ap(t)}`:(gap<=60?`Train ${i+1} departs at ${fmt(t)} ${ap(t)} That is ${gap} minutes after train ${i}.`:`Train ${i+1} departs at ${fmt(t)} ${ap(t)} The morning rush is over. Now the evening trains run.`);
    await clk.animate(prev,t,1400); };
  $('#bnext').onclick=()=>go((idx+1)%trains.length);
  $('#bstart').onclick=()=>{ idx=-1; go(0); };
  $('#team').oninput=e=>{ S.team=e.target.value; $('#bname').textContent=`${S.team?S.team+' · ':''}${LINES[S.color]} Line`; };
}

/* ---------------- Boot / reset ---------------- */
function boot(){
  S=freshState(); setLine('blue'); buildShell();
  buildP1(); buildP2(); buildP3(); buildP4(); buildP5(); buildP6(); buildPX(); buildShow();
}
let armed=null;
$('#resetBtn').onclick=()=>{ const b=$('#resetBtn');
  if(!armed){ b.textContent='Tap again to clear everything'; b.classList.add('warn'); armed=setTimeout(()=>{armed=null; b.textContent='Start over'; b.classList.remove('warn');},3500); return; }
  clearTimeout(armed); armed=null; b.textContent='Start over'; b.classList.remove('warn'); boot(); window.scrollTo(0,0); };
$('#fsBtn').onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} };
document.addEventListener('fullscreenchange',()=>{ $('#fsBtn').textContent=document.fullscreenElement?'Exit full screen':'Full screen'; });
boot();
})();
</script>
