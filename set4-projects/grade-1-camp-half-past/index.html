<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Camp Half Past</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: a camp trail of three class "stations" (tabs); each station is one big stage with a clock or snack board on the left and short prompts + big answer buttons on the right. */
:root{
  --bg:#EDF2EC; --card:#FFFFFF; --ink:#1B2A22; --muted:#56685D; --line:#CBD8CE;
  --pine:#1F5A40; --pine-soft:#DCEBE1; --lake:#2A76B6; --lake-soft:#DDEBF7;
  --sun:#E9A62A; --sun-soft:#FCF0D6; --ember:#D9602F; --ember-soft:#FBE3D8; --berry:#8A4FB8;
  --face:#FFFFFF; --rim:#1F3A5A; --short:#1F3A5A; --long:#2F7FC4; --pin:#C9962A;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111915; --card:#1A251F; --ink:#E7EFE9; --muted:#A0B3A7; --line:#33463B;
    --pine:#62C291; --pine-soft:#20372B; --lake:#6CB0EA; --lake-soft:#1B3040;
    --sun:#F3C25C; --sun-soft:#3A311B; --ember:#F28D62; --ember-soft:#3E2519; --berry:#BE8BEA;
    --face:#F4F7F5; --rim:#1F3A5A; --short:#1F3A5A; --long:#2F7FC4; --pin:#C9962A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111915; --card:#1A251F; --ink:#E7EFE9; --muted:#A0B3A7; --line:#33463B;
  --pine:#62C291; --pine-soft:#20372B; --lake:#6CB0EA; --lake-soft:#1B3040;
  --sun:#F3C25C; --sun-soft:#3A311B; --ember:#F28D62; --ember-soft:#3E2519; --berry:#BE8BEA;
  --face:#F4F7F5; --rim:#1F3A5A; --short:#1F3A5A; --long:#2F7FC4; --pin:#C9962A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.45; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--lake); outline-offset:3px}
.wrap{max-width:1320px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:14px 28px; display:flex; flex-direction:column; gap:16px}

header{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:14px; min-width:0}
.brand svg{flex:none}
h1{font-family:var(--display); font-weight:800; font-size:clamp(30px,3.6vw,48px); line-height:1; margin:0; letter-spacing:-.01em; color:var(--pine)}
.sub{margin:4px 0 0; font-size:15px; color:var(--muted); letter-spacing:.02em}
.tools{margin-left:auto; display:flex; gap:10px; flex-wrap:wrap}
.ghost{border:2px solid var(--line); background:var(--card); border-radius:14px; padding:10px 16px; font-weight:700; font-size:16px; min-height:48px}
.ghost:hover{border-color:var(--ink)}

/* class trail */
.trail{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.trail button{border:2.5px solid var(--line); background:var(--card); border-radius:18px; padding:10px 14px; text-align:left; display:flex; gap:12px; align-items:center; min-height:64px}
.trail .n{flex:none; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:22px; background:var(--pine-soft); color:var(--pine)}
.trail b{display:block; font-family:var(--display); font-size:20px; line-height:1.1}
.trail small{display:block; color:var(--muted); font-size:14px}
.trail button[aria-selected="true"]{border-color:var(--pine); background:var(--pine-soft)}
.trail button[aria-selected="true"] .n{background:var(--pine); color:var(--card)}

.parts{display:flex; gap:8px; flex-wrap:wrap}
.parts button{border:2px solid var(--line); background:var(--card); border-radius:999px; padding:8px 18px; font-weight:700; font-size:16px; min-height:46px; color:var(--muted)}
.parts button[aria-pressed="true"]{background:var(--ink); color:var(--card); border-color:var(--ink)}

.stage{background:var(--card); border:2px solid var(--line); border-radius:24px; padding:clamp(16px,2.2vw,28px); display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:clamp(16px,3vw,40px); align-items:start}
.stage.one{grid-template-columns:minmax(0,1fr)}
.col{display:flex; flex-direction:column; gap:14px; min-width:0}
.center{align-items:center}
.ptitle{font-family:var(--display); font-weight:800; font-size:clamp(26px,2.6vw,36px); line-height:1.05; margin:0; color:var(--pine); text-wrap:balance}
.eyebrow{font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0}
.big{font-family:var(--display); font-weight:700; font-size:clamp(24px,2.4vw,34px); line-height:1.15; margin:0; text-wrap:balance}
.tip{font-size:17px; color:var(--muted); margin:0; max-width:36em}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

.choice{border:3px solid var(--line); background:var(--card); border-radius:20px; min-width:120px; min-height:76px; padding:8px 20px; font-family:var(--display); font-weight:800; font-size:clamp(28px,3vw,40px); font-variant-numeric:tabular-nums}
.choice:hover{border-color:var(--lake)}
.choice.right{border-color:var(--pine); background:var(--pine-soft)}
.choice.miss{border-color:var(--ember); background:var(--ember-soft)}
.choice.small{font-size:clamp(22px,2.2vw,28px); min-height:64px}
.primary{border:0; background:var(--pine); color:var(--card); border-radius:16px; padding:14px 26px; font-weight:700; font-size:20px; min-height:58px}
.secondary{border:2.5px solid var(--ink); background:var(--card); border-radius:16px; padding:11px 20px; font-weight:700; font-size:18px; min-height:54px}
.primary:disabled,.secondary:disabled{opacity:.4; cursor:default}
.fb{border-radius:18px; padding:14px 18px; font-size:clamp(19px,1.7vw,23px); line-height:1.35; margin:0; background:var(--lake-soft)}
.fb:empty{display:none}
.fb.good{background:var(--pine-soft)}
.fb.try{background:var(--sun-soft)}
.fb b{font-family:var(--display)}

/* clocks */
.clockbox{width:min(100%, 420px); aspect-ratio:1; max-width:100%}
.clockbox.sm{width:min(100%, 300px)}
.clock{width:100%; height:100%; display:block}
.hand{transition:transform .45s cubic-bezier(.3,1.4,.5,1); transform-box:view-box; transform-origin:0 0}
.glow{animation:glow 1s ease-in-out 3}
@keyframes glow{50%{filter:drop-shadow(0 0 8px var(--sun)) drop-shadow(0 0 3px var(--sun))}}
.handpad{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; width:min(100%,440px)}
.handpad .lbl{grid-column:1/-1; display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; color:var(--muted); margin-top:2px}
.handpad .lbl i{display:inline-block; height:8px; border-radius:4px}
.hp{border:2.5px solid var(--line); background:var(--card); border-radius:16px; min-height:60px; font-weight:700; font-size:19px; display:flex; align-items:center; justify-content:center; gap:8px}
.hp[aria-pressed="true"]{border-color:var(--lake); background:var(--lake-soft)}
.readout{font-family:var(--display); font-weight:800; font-size:clamp(30px,3.4vw,46px); line-height:1; font-variant-numeric:tabular-nums; min-height:1em}
.readout small{display:block; font-family:var(--body); font-weight:400; font-size:17px; color:var(--muted); margin-top:6px}

.minis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.mini{border:3px solid var(--line); background:var(--card); border-radius:20px; padding:8px; display:flex; flex-direction:column; align-items:center; gap:4px}
.mini[aria-pressed="true"]{border-color:var(--lake)}
.mini .clockbox{width:100%}
.mini span{font-family:var(--display); font-weight:800; font-size:22px; min-height:1.2em; font-variant-numeric:tabular-nums}
.mini.done span{color:var(--pine)}

.pad{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; width:min(100%,480px)}
.pad button{border:2.5px solid var(--line); background:var(--card); border-radius:14px; min-height:56px; font-family:var(--display); font-weight:800; font-size:26px}
.pad button[aria-pressed="true"]{background:var(--lake); color:var(--card); border-color:var(--lake)}
.digital{display:inline-flex; align-items:center; gap:4px; font-family:var(--display); font-weight:800; font-size:clamp(46px,5vw,72px); line-height:1; background:var(--ink); color:var(--card); padding:12px 22px; border-radius:18px; font-variant-numeric:tabular-nums}
.digital .slot{min-width:1.2em; text-align:center; color:var(--sun)}
.words{font-family:var(--display); font-weight:800; font-size:clamp(34px,3.6vw,52px); line-height:1; color:var(--lake)}

/* schedule */
.sched{display:flex; flex-direction:column; gap:8px}
.srow{display:grid; grid-template-columns:auto 72px minmax(0,1fr) auto; gap:12px; align-items:center; border:2.5px solid var(--line); border-radius:18px; padding:8px 12px; background:var(--card); text-align:left; min-height:76px; width:100%}
.srow[aria-pressed="true"]{border-color:var(--lake); background:var(--lake-soft)}
.srow .t{font-family:var(--display); font-weight:800; font-size:26px; min-width:3.2em; font-variant-numeric:tabular-nums}
.srow .t.empty{color:var(--muted); font-weight:600}
.srow .act{display:flex; align-items:center; gap:8px; font-weight:700; font-size:19px; min-width:0}
.srow .tick{font-family:var(--display); font-weight:800; color:var(--pine); font-size:22px}
.acts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; width:100%}
.acts button{border:2.5px solid var(--line); background:var(--card); border-radius:16px; min-height:64px; display:flex; align-items:center; gap:8px; padding:6px 10px; font-weight:700; font-size:18px}
.acts button[aria-pressed="true"]{border-color:var(--sun); background:var(--sun-soft)}
.ico{width:36px; height:36px; flex:none; color:var(--ink)}
.stepper{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--line); border-radius:16px; padding:4px; background:var(--card)}
.stepper button{border:0; background:var(--bg); border-radius:12px; width:48px; height:48px; font-size:24px; font-weight:800}
.stepper output{font-family:var(--display); font-weight:800; font-size:26px; min-width:3.4em; text-align:center; font-variant-numeric:tabular-nums}

/* snacks */
.snackgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.board{width:min(100%,400px); aspect-ratio:1; max-width:100%}
.board svg{width:100%; height:100%; display:block; overflow:visible}
.cut{cursor:pointer}
.cut .guide{stroke:var(--muted); stroke-width:1.2; stroke-dasharray:3 3; opacity:.55}
.cut .knife{stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; opacity:0}
.cut.on .knife{opacity:1}
.cut.on .guide{opacity:0}
.cut .hit{stroke:transparent; stroke-width:12}
.cut:hover .guide{opacity:1; stroke:var(--lake)}
.piece{transition:transform .8s cubic-bezier(.4,0,.2,1), opacity .4s; transform-box:view-box; transform-origin:0 0; stroke:var(--ink); stroke-width:1.2}
.campers{display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap}
.status{font-family:var(--display); font-weight:700; font-size:22px}
.pick{display:flex; gap:8px; flex-wrap:wrap}

details.key{border-top:2px dashed var(--line); padding-top:10px; font-size:16px; color:var(--muted)}
details.key summary{cursor:pointer; font-weight:700; min-height:32px}
details.key p{margin:6px 0}

/* showcase */
.show{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:28px; align-items:center}
.timeline{display:flex; gap:10px; flex-wrap:wrap}
.tl{border:3px solid var(--line); border-radius:18px; padding:8px 12px; background:var(--card); display:flex; flex-direction:column; align-items:center; min-width:96px}
.tl.now{border-color:var(--sun); background:var(--sun-soft)}
.tl b{font-family:var(--display); font-size:24px; font-variant-numeric:tabular-nums}
.gallery{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.gal{border:2px solid var(--line); border-radius:18px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; font-weight:700}
.gal .board{width:100%}
.tag{font-size:14px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--bg); color:var(--muted)}
.tag.ok{background:var(--pine-soft); color:var(--pine)}

@media (max-width: 900px){
  .stage,.show{grid-template-columns:minmax(0,1fr)}
  .trail{grid-template-columns:minmax(0,1fr)}
  .trail button{min-height:56px}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 520px){
  .minis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .snackgrid{grid-template-columns:minmax(0,1fr)}
  .acts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pad{grid-template-columns:repeat(4,minmax(0,1fr))}
  .srow{grid-template-columns:auto 56px minmax(0,1fr)}
  .srow .tick{display:none}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  .hand,.piece{transition:none !important}
  .glow{animation:none; filter:drop-shadow(0 0 6px var(--sun))}
}
</style>

<div class="wrap">
<header>
  <div class="brand">
    <svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><path d="M29 4 L52 50 H6 Z" fill="var(--pine)"/><path d="M29 22 L38 50 H20 Z" fill="var(--sun)"/><circle cx="46" cy="12" r="7" fill="var(--sun)"/></svg>
    <div>
      <h1>Camp Half Past</h1>
      <p class="sub">Grade 1 · Set 4 project · 3 class periods · Read the camp clock. Plan the camp day. Share every snack fairly.</p>
    </div>

    <button class="ghost" id="resetBtn">Start over</button>
    <button class="ghost" id="fsBtn">Full screen</button>
  </div>
</header>

<nav class="trail" role="tablist" aria-label="Class periods">
  <button role="tab" data-cls="1" aria-selected="true"><span class="n">1</span><span><b>Read the clock</b><small>Class 1 · Parts 1–2</small></span></button>
  <button role="tab" data-cls="2" aria-selected="false"><span class="n">2</span><span><b>Plan the day · Snacks</b><small>Class 2 · Parts 3–4 + Challenge</small></span></button>
  <button role="tab" data-cls="3" aria-selected="false"><span class="n">3</span><span><b>Showcase</b><small>Class 3 · Show what we made</small></span></button>
</nav>

<div class="parts" id="parts" aria-label="Parts of this class"></div>
<main id="main"></main>
</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs={},html)=>{const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k.startsWith('on'))e[k]=attrs[k];else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;};

/* ===== Time model =====
   t = half-hour index 0..23 on a 12-hour clock. t=0 is 12:00, t=1 is 12:30, t=18 is 9:00, t=21 is 10:30.
   Short hand position (in "numbers") = t/2. Long hand = 0 minutes if t even, 30 if t odd. */
const hourOf=t=>{const h=Math.floor(((t%24)+24)%24/2);return h===0?12:h;};
const minOf=t=>(((t%24)+24)%24)%2?30:0;
const dig=t=>`${hourOf(t)}:${minOf(t)?'30':'00'}`;
const wordsOf=t=>minOf(t)?`half past ${hourOf(t)}`:`${hourOf(t)} o’clock`;
const tFrom=(h,m)=>((h%12)*2+(m?1:0));
const next=t=>(t+1)%24;

/* ===== Clock drawing ===== */
function clockSVG(){
  const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','-110 -110 220 220');s.classList.add('clock');
  let h=`<circle r="104" fill="var(--face)" stroke="var(--rim)" stroke-width="7"/>`;
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0,r1=big?88:94;h+=`<line x1="${(Math.sin(a)*r1).toFixed(2)}" y1="${(-Math.cos(a)*r1).toFixed(2)}" x2="${(Math.sin(a)*100).toFixed(2)}" y2="${(-Math.cos(a)*100).toFixed(2)}" stroke="var(--rim)" stroke-width="${big?3.4:1.4}" stroke-linecap="round"/>`;}
  for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;h+=`<text x="${(Math.sin(a)*72).toFixed(2)}" y="${(-Math.cos(a)*72+9).toFixed(2)}" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" font-size="26" fill="var(--rim)">${n}</text>`;}
  h+=`<g class="hand sh"><line x1="0" y1="8" x2="0" y2="-50" stroke="var(--short)" stroke-width="11" stroke-linecap="round"/></g>`;
  h+=`<g class="hand lh"><line x1="0" y1="10" x2="0" y2="-82" stroke="var(--long)" stroke-width="6.5" stroke-linecap="round"/></g>`;
  h+=`<circle r="7" fill="var(--pin)"/>`;
  s.innerHTML=h;
  s._sa=0;s._la=0;
  return s;
}
/* set hands: steps = short hand in half-number steps (0..23), long = 0 or 30. Keeps rotation continuous. */
function setHands(svg,steps,long){
  const target=steps*15, ltarget=long?180:0;
  const near=(cur,tgt)=>{let d=((tgt-cur)%360+540)%360-180;return cur+d;};
  svg._sa=near(svg._sa,target); svg._la=near(svg._la,ltarget);
  svg.querySelector('.sh').style.transform=`rotate(${svg._sa}deg)`;
  svg.querySelector('.lh').style.transform=`rotate(${svg._la}deg)`;
  svg.setAttribute('aria-label',`Clock. Short hand ${steps%2?`between ${hourOf(steps-1)} and ${hourOf(steps+1)}`:`on ${hourOf(steps)}`}. Long hand on ${long?6:12}.`);
  svg.setAttribute('role','img');
}
const setTime=(svg,t)=>setHands(svg,((t%24)+24)%24,minOf(t));
function glow(svg,which){const g=svg.querySelector(which==='long'?'.lh':'.sh');g.classList.remove('glow');void g.getBoundingClientRect();g.classList.add('glow');setTimeout(()=>g.classList.remove('glow'),3100);}
function clockBox(t,cls){const b=el('div',{class:'clockbox'+(cls?' '+cls:'')});const s=clockSVG();b.appendChild(s);if(t!=null)setTime(s,t);return {box:b,svg:s};}

/* Hand control: students move each hand themselves. */
function handControl(initSteps,onChange){
  const c=clockBox(null);let steps=initSteps,long=initSteps%2?30:0;
  const pad=el('div',{class:'handpad'});
  pad.appendChild(el('div',{class:'lbl'},`<i style="width:34px;background:var(--short)"></i>Short hand`));
  const back=el('button',{class:'hp','aria-label':'Move short hand back'},'⟲ back');
  const fwd=el('button',{class:'hp','aria-label':'Move short hand forward'},'forward ⟳');
  pad.append(back,fwd);
  pad.appendChild(el('div',{class:'lbl'},`<i style="width:48px;height:5px;background:var(--long)"></i>Long hand`));
  const up=el('button',{class:'hp'},'up to 12');const down=el('button',{class:'hp'},'down to 6');
  pad.append(up,down);
  const draw=()=>{setHands(c.svg,steps,long);up.setAttribute('aria-pressed',long===0);down.setAttribute('aria-pressed',long===30);onChange&&onChange(api);};
  back.onclick=()=>{steps=(steps+23)%24;draw();};
  fwd.onclick=()=>{steps=(steps+1)%24;draw();};
  up.onclick=()=>{long=0;draw();};
  down.onclick=()=>{long=30;draw();};
  const api={box:c.box,svg:c.svg,pad,get steps(){return steps},get long(){return long},
    set(s,l){steps=((s%24)+24)%24;long=l;draw();},
    valid(){return (steps%2===1)===(long===30);},
    time(){return this.valid()?steps:null;}};
  draw();
  return api;
}
/* Why a hand setting is not the target time. Returns HTML. */
function handAdvice(hc,target){
  const s=hc.steps,l=hc.long,tm=minOf(target),th=hourOf(target);
  if(l!==(tm?30:0)) return {which:'long',msg: tm?`<b>Half past</b> means the long hand points <b>down to 6</b>.`:`<b>O’clock</b> means the long hand points <b>straight up to 12</b>.`};
  if(tm && s%2===0) return {which:'short',msg:`The long hand is right! At half past, the short hand sits <b>between</b> two numbers: between <b>${th}</b> and <b>${hourOf(target+1)}</b>.`};

  pick.appendChild(el('span',{style:'font-weight:700;align-self:center'},'Each camper gets one'));
  ['half','fourth','whole'].forEach(w=>{const b=el('button',{class:'choice small'+(S[k].word===w?(w===word?' right':' miss'):'')},w);
    b.onclick=()=>{S[k].word=w;pick.querySelectorAll('.choice').forEach(x=>x.classList.remove('right','miss'));b.classList.add(w===word?'right':'miss');
      const inf=bd.info();
      if(w===word)say(fb,word==='half'?'<b>One half.</b> 2 equal pieces: each is a half.':'<b>One fourth</b> (a quarter). 4 equal pieces: each is a fourth.','good');
      else say(fb,w==='whole'?`A whole is the entire snack. ${need} campers share it, so each gets one of ${need} equal pieces.`:w==='fourth'?'A fourth is 1 of 4 equal pieces. Here there are 2 equal pieces. Count them!':'A half is 1 of 2 equal pieces. Here there are 4 equal pieces. Count them!','try');};
    pick.appendChild(b);});
  col.append(el('b',{style:'font-family:var(--display);font-size:22px'},title),bd.wrap,stt,sb,pick,fb);
  stt.textContent=statusOf(bd.info(),need);
  return col;
}

/* ===== Wire up ===== */
document.querySelectorAll('.trail button').forEach(b=>b.onclick=()=>{S.cls=+b.dataset.cls;render();});
const confirmBar={armed:false,timer:null};
$('#resetBtn').onclick=()=>{const b=$('#resetBtn');
  if(!confirmBar.armed){confirmBar.armed=true;b.textContent='Tap again to erase all';clearTimeout(confirmBar.timer);confirmBar.timer=setTimeout(()=>{confirmBar.armed=false;b.textContent='Start over';},3000);return;}
  confirmBar.armed=false;b.textContent='Start over';S=fresh();render();};
$('#fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}};
document.addEventListener('fullscreenchange',()=>$('#fsBtn').textContent=document.fullscreenElement?'Exit full screen':'Full screen');
render();
})();
</script>
